/* =========================================================================
   DÉCOUPE FROMAGE — écran de pesée d'un fromage
   ========================================================================= */
function CheeseWeigh({ product, pkey, status, operator, connected, onSetRow, onClose }) {
  const [w, setW] = useState("");
  const agg = frAgg(status);
  const { min, max } = frBounds(product);
  const weight = parseInt(w||"0", 10) || 0;
  const previewDest = weight>0 ? frRoute(product, weight, agg.kbgN) : null;
  const kbgLeft = Math.max(0, (product.kbgTarget||0) - agg.kbgN);
  const tap = (d) => setW(v => (v.length<4 ? v+d : v));
  const del = () => setW(v => v.slice(0,-1));
  const validate = () => {
    if (weight<=0) return;
    const dest = frRoute(product, weight, agg.kbgN);
    const pieces = [ ...((status&&status.pieces)||[]), { w:weight, dest, at:Date.now(), by:operator.name||("#"+operator.code) } ];
    onSetRow(pkey, { pieces });
    try { navigator.vibrate && navigator.vibrate(dest==="KBG"?60:[40,40,40]); } catch(e){}
    setW("");
  };
  const undo = () => {
    const pieces = [ ...((status&&status.pieces)||[]) ];
    if (!pieces.length) return;
    pieces.pop();
    onSetRow(pkey, { pieces });
  };
  const finish = () => {
    onSetRow(pkey, { done:true, doneBy:operator.name||("#"+operator.code), doneAt:Date.now() });
    onClose();
  };
  return (
    <div className="app">
      <div className="header fr-head" style={{background:"#8a5a00"}}>
        <div className="header-row">
          <div><h1 style={{fontSize:15}}>{product.designation}</h1>
            <div className="sub">cible {product.poids} g · tolérance ±{product.tol}% ({min}–{max} g) <span className={`conn-status ${!connected?"offline":""}`}>{connected?"● en ligne":"● hors ligne"}</span></div>
          </div>
          <div className="header-actions"><button className="header-btn" onClick={onClose}>← Retour</button></div>
        </div>
      </div>
      <div className="weigh-wrap">
        <div className="piece-tally">
          <div className="pt kbg">
            <div className="n">{agg.kbgN}{product.kbgTarget>0?`/${product.kbgTarget}`:""}</div>
            <div className="l">KELBONGOO · {Math.round(agg.kbgG)} g</div>
          </div>
          <div className="pt rob">
            <div className="n">{agg.robN}</div>
            <div className="l">ROBESPIERRE · {Math.round(agg.robG)} g</div>
          </div>
        </div>

        <div className="weigh-display">{w||"0"}<span className="weigh-unit"> g</span></div>
        <div className={`weigh-verdict ${previewDest?previewDest.toLowerCase():"none"}`}>
          {!previewDest ? "Pèse une pièce et tape son poids"
            : previewDest==="KBG" ? `✓ Dans la tolérance → KELBONGOO${kbgLeft>0?` (reste ${kbgLeft})`:""}`
            : (weight<min ? `⚖️ Trop léger → ROBESPIERRE` : weight>max ? `⚖️ Trop lourd → ROBESPIERRE` : kbgLeft===0 ? `Objectif Kelbongoo atteint → ROBESPIERRE` : `→ ROBESPIERRE`)}
        </div>

        <div className="keypad">
          {["1","2","3","4","5","6","7","8","9"].map(d=><button key={d} onClick={()=>tap(d)}>{d}</button>)}
          <button className="del" onClick={del}>⌫</button>
          <button onClick={()=>tap("0")}>0</button>
          <button className="act" onClick={validate} disabled={weight<=0}>✓ Pièce</button>
        </div>

        <div style={{display:"flex", gap:8, marginTop:14, maxWidth:420, marginLeft:"auto", marginRight:"auto"}}>
          <button className="btn-undo" style={{flex:1}} onClick={undo} disabled={agg.total===0}>↶ Annuler dernière pièce</button>
          <button className="btn-validate" style={{flex:1, background:"#2e7d32"}} onClick={finish}>✓ Terminer ce fromage</button>
        </div>

        {agg.total>0 && (
          <div className="recap-card" style={{marginTop:16}}>
            <h3>Pièces coupées ({agg.total})</h3>
            <div className="piece-log">
              {[ ...((status&&status.pieces)||[]) ].reverse().map((pc,i)=>(
                <div className="pl" key={i}><span>{pc.w} g</span><span className={`pd ${pc.dest.toLowerCase()}`}>{pc.dest==="KBG"?"Kelbongoo":"Robespierre"}</span></div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* =========================================================================
   PAVÉ NUMÉRIQUE — saisie poids / quantité fiable et sécurisée
   - Remplace le clavier natif (fini le « chiffre qui ne se note pas »).
   - Mode "poids" : bascule kg / g pour éviter 100000 g au lieu de 10 kg.
   - Garde-fou : alerte si le poids saisi est manifestement anormal.
   La valeur renvoyée est toujours dans l'unité de référence du champ
   (kg pour un poids, entier pour une quantité).
   ========================================================================= */
// Seuils de vraisemblance (par fromage) : au-delà, on demande une confirmation.
const NP_MAX_KG = 300;      // un seul fromage > 300 kg = quasi sûrement une erreur
const NP_MAX_COUNT = 3000;  // > 3000 portions/pièces = quasi sûrement une erreur
function NumPad({ title, sub, mode, value, onValidate, onClose }) {
  const isW = mode === "weight";
  const [unit, setUnit] = React.useState("kg");   // poids uniquement
  const [str, setStr]   = React.useState("");
  const [confirmWarn, setConfirmWarn] = React.useState(false);
  // Pré-remplissage depuis la valeur actuelle (une seule fois).
  React.useEffect(() => {
    if (value==null || value==="") { setStr(""); return; }
    if (!isW) { const n=parseInt(value,10)||0; setStr(n?String(n):""); }
    else { const kg=Number(value)||0; setStr(kg?String(kg).replace(".",","):""); setUnit("kg"); }
  }, []); // eslint-disable-line
  const maxLen = isW ? 7 : 5;
  const tap = (d) => { setConfirmWarn(false); setStr(v => {
    if (d===",") { if (!isW || v.includes(",")) return v; return v===""?"0,":v+","; }
    if (v.replace(/[^0-9]/g,"").length >= maxLen) return v;
    if (v==="0") return d;                 // pas de zéro en tête
    return v + d;
  }); };
  const del   = () => { setConfirmWarn(false); setStr(v=>v.slice(0,-1)); };
  const clear = () => { setConfirmWarn(false); setStr(""); };
  const raw   = str==="" ? 0 : (parseFloat(str.replace(",","."))||0);
  // Valeur canonique (kg pour un poids, entier pour une quantité).
  const canon = isW ? (unit==="g" ? Math.round(raw)/1000 : raw) : (parseInt(str||"0",10)||0);
  const abnormal = isW ? (canon > NP_MAX_KG) : (canon > NP_MAX_COUNT);
  const validate = () => {
    if (abnormal && !confirmWarn) { setConfirmWarn(true); return; }
    onValidate(str===""?"":canon);
    onClose();
  };
  return (
    <div className="np-back" onClick={onClose}>
      <div className="np-sheet" onClick={e=>e.stopPropagation()}>
        <div className="np-title">{title}</div>
        {sub && <div className="np-sub">{sub}</div>}
        {isW && (
          <div className="np-unit">
            <button className={unit==="kg"?"on":""} onClick={()=>{ setConfirmWarn(false); setUnit("kg"); }}>kg</button>
            <button className={unit==="g"?"on":""} onClick={()=>{ setConfirmWarn(false); setUnit("g"); }}>grammes (g)</button>
          </div>
        )}
        <div className="np-disp">{str||"0"}<span className="u">{isW?unit:""}</span></div>
        <div className="np-conv">{isW && unit==="g" && raw>0 ? `= ${(Math.round(raw)/1000).toString().replace(".",",")} kg` : ""}</div>
        {abnormal && confirmWarn && (
          <div className="np-warn">⚠️ {isW?`${canon.toString().replace(".",",")} kg`:`${canon} pièces`} pour un seul fromage, c'est inhabituel. {isW?"As-tu confondu kg et g ?":""} Appuie sur « Confirmer » si c'est correct.</div>
        )}
        <div className="np-pad">
          {["7","8","9","4","5","6","1","2","3"].map(d=><button key={d} onClick={()=>tap(d)}>{d}</button>)}
          {isW ? <button onClick={()=>tap(",")}>,</button> : <button className="clr" onClick={clear}>C</button>}
          <button onClick={()=>tap("0")}>0</button>
          <button className="del" onClick={del}>⌫</button>
        </div>
        <div className="np-actions">
          <button className="cancel" onClick={onClose}>Annuler</button>
          <button className={"ok"+(abnormal&&confirmWarn?" warn":"")} onClick={validate}>{abnormal&&confirmWarn?"Confirmer quand même":"Valider"}</button>
        </div>
      </div>
    </div>
  );
}
// Champ « tapable » qui ouvre le pavé numérique. `display` = texte affiché.
function NumField({ display, empty, color, onOpen, borderColor, big }) {
  return (
    <button type="button" className={"numfield"+(empty?" empty":"")} onClick={onOpen}
      style={{ border:`2px solid ${borderColor||"#ddd"}`, fontSize:big?22:16, color:color||"#1a1a1a", minHeight:big?44:40 }}>
      {display}
    </button>
  );
}

/* =========================================================================
   DÉCOUPE FROMAGE — écran principal (liste des fromages)
   ========================================================================= */
function DecoupeScreen({ sessionId, operator, supplier, products, onFinish, onLeave }) {
  const { state, meta, serverMeta, connected, setRow, flushNow, ensureMeta, pending, syncedAt } = useDecoupeSession(sessionId, operator);
  const [blEdit, setBlEdit] = useState("");
  // Quitter : alerte bloquante si des saisies ne sont PAS encore arrivées à la console ;
  // découpe vide (aucun fromage, rien saisi) → on ne laisse aucune ligne « parasite ».
  const leave = () => {
    if (pending) {
      if (!confirm("⚠️ ATTENTION — DÉCOUPE PAS ENCORE ENVOYÉE À LA CONSOLE\n\nTes saisies sont gardées sur CETTE tablette mais la console ne les a pas encore.\nElles partiront automatiquement dès que la tablette retrouve internet (wifi).\n\n➜ NE VIDE PAS le cache et ne change pas de tablette.\n\nQuitter quand même ?")) return;
    } else {
      const noState = !state || Object.keys(state).length===0;
      const noProd = !(serverMeta && Array.isArray(serverMeta.products) && serverMeta.products.length) && !(decLS(decPKey(sessionId), [])||[]).length;
      if (noState && noProd) {
        if (firebaseReady && serverMeta && serverMeta.libre) db.ref(`decoupe/${sessionId}`).remove().catch(()=>{});
        decClearLocal(sessionId);
      }
    }
    onLeave();
  };
  // Bouton « Retour / Précédent » de la tablette : il ne sort plus de l'app.
  // Pesée ouverte → on la ferme ; sinon même chemin que « Quitter » (alerte si pas envoyé).
  const backRef = useRef(null);
  backRef.current = () => { if (cutKeyRef.current) { setCutKeyRef.current(null); return; } leave(); };
  const cutKeyRef = useRef(null), setCutKeyRef = useRef(()=>{});
  useEffect(() => { const h = () => { if (backRef.current) backRef.current(); }; window.addEventListener("centrale-back-decoupe", h); return () => window.removeEventListener("centrale-back-decoupe", h); }, []);
  const saveBl = () => {
    const bl = (blEdit||"").trim(); if (!bl) return;
    try { const lm = decLocalMeta(sessionId); decLSset(decMetaKey(sessionId), { ...lm, docNumber:bl }); } catch(e){}
    if (firebaseReady && sessionId && serverMeta) db.ref(`decoupe/${sessionId}/meta`).update({ docNumber:bl }).catch(()=>{});
    setBlEdit("");
  };
  const [saveMsg, setSaveMsg] = useState("");
  const prevConnRef = useRef(connected);
  useEffect(()=>{ if(!prevConnRef.current && connected){ setSaveMsg("✓ Reconnecté — saisies synchronisées"); setTimeout(()=>setSaveMsg(""),3500); } prevConnRef.current = connected; }, [connected]);
  const [search, setSearch] = useState("");
  const [cutKey, setCutKey] = useState(null);
  cutKeyRef.current = cutKey; setCutKeyRef.current = setCutKey;
  const [tab, setTab] = useState("cut"); // cut | reception | traca
  const [labels, setLabels] = useState({});
  const [bls, setBls] = useState({});
  // Pavé numérique : { title, sub, mode:"weight"|"count", value, commit(val) }
  const [pad, setPad] = useState(null);

  useEffect(() => {
    if (!firebaseReady || !sessionId) return;
    const ref = db.ref(`decoupe/${sessionId}/tracabilite`);
    const h = (snap)=>setLabels(snap.val()||{});
    ref.on("value", h); return () => ref.off("value", h);
  }, [sessionId]);
  useEffect(() => {
    if (!firebaseReady || !sessionId) return;
    const ref = db.ref(`decoupe/${sessionId}/bl`);
    const h = (snap)=>setBls(snap.val()||{});
    ref.on("value", h); return () => ref.off("value", h);
  }, [sessionId]);

  // Découpe libre : la liste vient du BL (meta.products, poussé par la console) sinon des produits passés.
  // L'opérateur peut ajouter un fromage à la volée ; le rapprochement avec le BL se fait par frKey (désignation).
  const [newFr, setNewFr] = useState("");
  const [addManual, setAddManual] = useState(false); // saisie libre du nom (hors liste)
  // Repli hors-ligne : si Firebase n'a pas (encore) renvoyé la liste, on utilise la sauvegarde locale.
  const [prodTick, setProdTick] = useState(0);
  const lsProducts = useMemo(()=>{ try{ const a=JSON.parse(localStorage.getItem(decPKey(sessionId))||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } }, [sessionId, meta, connected, prodTick]);
  // Union serveur + appareil : un fromage ajouté hors ligne ne disparaît pas quand le BL (44 fromages) arrive.
  const srcProducts = useMemo(() => { const u = decUnionProducts((meta && Array.isArray(meta.products)) ? meta.products : [], lsProducts); return u.length ? u : (products||[]); }, [meta, lsProducts, products]);
  const addFromage = (nomArg) => {
    const nom = ((nomArg!=null?nomArg:newFr)||"").trim(); if(!nom) return;
    const exists = srcProducts.some(p=>frKey(p,0)===frKey({designation:nom},0));
    if(exists){ setNewFr(""); setAddManual(false); return; }
    const rp = kbgRefPoids(nom);
    const np = { article:"", designation:nom, fournisseur:"", robCmd:0, kbgTarget:0, poids:(rp>0?rp:FROMAGE_DEFAULT_POIDS), tol:FROMAGE_DEFAULT_TOL };
    const next = [...srcProducts, np];
    try{ localStorage.setItem(decPKey(sessionId), JSON.stringify(next)); }catch(e){} // sauvegarde locale immédiate (marche hors ligne)
    const ts = decMarkDirty(sessionId);
    ensureMeta(); // 1er fromage → la découpe apparaît dans « Rejoindre » et dans la console
    if (firebaseReady && sessionId) db.ref(`decoupe/${sessionId}/meta/products`).set(next).then(()=>{ if (serverMeta && serverMeta.startedAt) decMarkSynced(sessionId, ts); }).catch(()=>{});
    setProdTick(t=>t+1);
    setNewFr(""); setAddManual(false);
  };
  const list = useMemo(() => srcProducts.map((p,idx)=>{ const rp=kbgRefPoids(p.designation); return {...p, poids:(rp>0?rp:(p.poids||FROMAGE_DEFAULT_POIDS)), _pkey:frKey(p,idx)}; }).sort((a,b)=>a.designation.localeCompare(b.designation,"fr")), [srcProducts]);
  const filtered = useMemo(() => { const q=search.trim(); if(!q) return list; return list.filter(p=>smartMatch(p.designation,q)||(p.article||"").includes(q)); }, [list, search]);
  const stats = useMemo(() => { const total=list.length; const done=list.filter(p=>state[p._pkey]&&state[p._pkey].done).length; return { total, done }; }, [list, state]);
  // Fromages déjà dans la liste (pour ne pas les reproposer à l'ajout).
  const presentKeys = useMemo(() => new Set(list.map(p=>p._pkey)), [list]);
  // Options du menu déroulant d'ajout : dernier BL connu (mémorisé) + liste de référence, hors fromages déjà présents.
  // Menu <select> natif : fiable sur toutes les tablettes (la datalist ne marchait pas sur certaines).
  const addOptions = useMemo(() => {
    const seen=new Set(), bl=[], ref=[];
    const nk=(d)=>stripAccents((d||"").toLowerCase()).trim();
    let lastBl=[]; try { lastBl=JSON.parse(localStorage.getItem("centrale_last_bl_fromages")||"[]"); } catch(e){}
    lastBl.forEach(d=>{ const k=nk(d); if(d&&!seen.has(k)&&!presentKeys.has(frKey({designation:d},0))){ seen.add(k); bl.push(d); } });
    FROMAGE_NOMS_REF.forEach(d=>{ const k=nk(d); if(!seen.has(k)&&!presentKeys.has(frKey({designation:d},0))){ seen.add(k); ref.push(d); } });
    bl.sort((a,b)=>a.localeCompare(b,"fr"));
    return { bl, ref };
  }, [presentKeys]);
  // Mémorise la liste des fromages du dernier BL réellement chargé, pour la reproposer à l'ajout (même hors ligne / nouveau jour).
  useEffect(() => {
    if (meta && meta.docNumber && Array.isArray(meta.products) && meta.products.length) {
      try { localStorage.setItem("centrale_last_bl_fromages", JSON.stringify(meta.products.map(p=>p.designation).filter(Boolean))); } catch(e){}
    }
  }, [meta]);
  // Entité de la session (poussée par la console) : ROB = Montreuil (au poids, meules), KBG = Kelbongoo (pesée précise).
  const isRob = (((meta&&meta.entity)||"").toUpperCase()==="ROB");

  // Résumé live vers la console (quantités découpées / rendement) à chaque changement.
  // IMPORTANT : on pousse la liste RÉELLE affichée à l'opérateur (list = meta.products fusionnés,
  // poids résolus), et non le prop `products` qui reste vide en découpe libre. Sans ça, un fromage
  // ajouté à la volée (ex. Comté pour Kelbongoo) n'apparaissait ni dans le récap ni dans la console.
  useEffect(() => { if (serverMeta && serverMeta.startedAt) pushDecoupeRecap(sessionId, list, state, operator, meta&&meta.entity); }, [sessionId, list, state, meta]);
  // Étiquette traça / BL photographié sur une découpe pas encore créée → on crée l'en-tête (sinon invisible).
  useEffect(() => { if ((Object.keys(labels||{}).length || Object.keys(bls||{}).length) && !(serverMeta && serverMeta.startedAt)) ensureMeta(); }, [labels, bls, serverMeta, ensureMeta]);

  const cutProduct = cutKey ? list.find(p=>p._pkey===cutKey) : null;
  if (cutProduct) {
    return <CheeseWeigh product={cutProduct} pkey={cutKey} status={state[cutKey]||{}} operator={operator} connected={connected} onSetRow={setRow} onClose={()=>setCutKey(null)} />;
  }

  const setSticker = (pkey, patch) => setRow(pkey, patch);

  return (
    <div className="app">
      {pad && <NumPad title={pad.title} sub={pad.sub} mode={pad.mode} value={pad.value}
        onValidate={(val)=>pad.commit(val)} onClose={()=>setPad(null)} />}
      <div className="header fr-head" style={{background:"#8a5a00"}}>
        <div className="header-row">
          <div><h1>🧀 {supplier||"Découpe"}</h1>
            <div className="sub">{BRAND} • {operator.name||"Opérateur"}{meta&&meta.deliveryDate?` • récep. prévue ${meta.deliveryDate}`:""} • <span className={`conn-status ${!connected?"offline":""}`}>{connected?"● en ligne":"● hors ligne"}</span></div>
          </div>
          <div className="header-actions"><button className="header-btn" onClick={leave}>Quitter</button></div>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:`${stats.total>0?(stats.done/stats.total)*100:0}%`}}></div></div>
        <div className="progress-text" style={{color:"rgba(255,255,255,.85)"}}><span>{stats.done} / {stats.total} fromages</span><span>{stats.total-stats.done} restants</span></div>
      </div>
      {/* État d'envoi vers la console — toujours visible */}
      {pending ? (
        <div style={{background:"#b71c1c", color:"#fff", padding:"10px 12px", fontWeight:800, fontSize:14, textAlign:"center", animation:"updPulse 1.5s infinite"}}>
          ⚠️ PAS ENCORE ENVOYÉ À LA CONSOLE — {connected?"envoi en cours…":"en attente d'internet"} · ne vide pas le cache
        </div>
      ) : (syncedAt>0 && (
        <div style={{background:"#e8f5e9", color:"#1a4d2e", padding:"6px 12px", fontSize:12, fontWeight:700, textAlign:"center"}}>✓ Tout est envoyé à la console (dernier envoi {fmtTime(syncedAt)})</div>
      ))}

      {!connected && (
        <div style={{background:"#c62828", color:"#fff", padding:"10px 12px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, flexWrap:"wrap"}}>
          <div style={{fontWeight:700, fontSize:13}}>📴 Hors ligne — tes saisies sont gardées sur cette tablette. Elles partiront <b>automatiquement</b> dès le retour d'internet. Ne ferme pas l'app.</div>
          <button onClick={async()=>{ setSaveMsg("Sauvegarde…"); try{ await flushNow(); }catch(e){} setSaveMsg("✓ Gardé sur l'appareil — repartira au retour du réseau"); setTimeout(()=>setSaveMsg(""),3500); }} style={{background:"#fff", color:"#c62828", border:"none", borderRadius:8, padding:"8px 12px", fontWeight:800, fontSize:13, whiteSpace:"nowrap"}}>💾 Sauvegarder maintenant</button>
        </div>
      )}
      {connected && saveMsg && (
        <div style={{background:"#e8f5e9", color:"#1a4d2e", padding:"8px 12px", fontSize:13, fontWeight:700, textAlign:"center"}}>{saveMsg}</div>
      )}

      <div className="tabs-bar">
        <button className={`tab ${tab==="cut"?"active":""}`} onClick={()=>setTab("cut")}>🔪 Découpe</button>
        <button className={`tab ${tab==="reception"?"active":""}`} onClick={()=>setTab("reception")}>📥 Réception</button>
        <button className={`tab ${tab==="traca"?"active":""}`} onClick={()=>setTab("traca")}>🏷️ Traçabilité</button>
      </div>

      {tab==="traca" && (
        <TracabilitePanel sessionId={sessionId} operator={operator} products={products} labels={labels} blNumber={meta&&meta.docNumber} />
      )}
      {tab==="reception" && (
        <ReceptionPanel sessionId={sessionId} operator={operator} products={list} state={state} onSetRow={setRow} bls={bls} />
      )}

      {tab==="cut" && (
        <>
          <div className="search-bar" style={{top:106}}>
            <input type="text" placeholder="🔍 Chercher un fromage…" value={search} onChange={e=>setSearch(e.target.value)} />
          </div>
          <div className="product-list">
            {isRob
              ? <div style={{fontSize:12, color:"#6a1b9a", background:"#f3e5f5", border:"1px solid #ce93d8", borderRadius:8, padding:"8px 10px", margin:"2px 2px 10px"}}>🟣 <b>Pribon Robespierre (Montreuil)</b> — vendu au poids. On se fiche des portions : indique juste le <b>poids total envoyé (kg)</b> pour chaque fromage.</div>
              : <div style={{fontSize:12, color:"#1565c0", background:"#e3f2fd", border:"1px solid #90caf9", borderRadius:8, padding:"8px 10px", margin:"2px 2px 10px"}}>🔵 <b>Kelbongoo</b> — portions de poids fixe. Coupe dans la fourchette affichée, saisis le <b>nombre de portions</b> et les <b>kg partis à Montreuil</b> (hors gabarit). Le rendement se calcule tout seul.</div>}
            {/* Ajouter un fromage à découper : menu déroulant fiable (dernier BL connu + référence), ou saisie à la main.
                Remplace la datalist qui ne s'ouvrait pas sur certaines tablettes. */}
            <div style={{margin:"0 2px 10px"}}>
              {!addManual ? (
                <select value="" onChange={e=>{ const v=e.target.value; if(v==="__manual__"){ setAddManual(true); setNewFr(""); } else if(v){ addFromage(v); } }} style={{width:"100%", padding:11, border:"1.5px solid #8a5a00", borderRadius:8, fontSize:15, fontWeight:600, background:"#fff", color:"#8a5a00"}}>
                  <option value="">➕ Ajouter un fromage à découper…</option>
                  {addOptions.bl.length>0 && (
                    <optgroup label="🧀 Dernier BL connu">
                      {addOptions.bl.map((d,i)=><option key={"b"+i} value={d}>{d}</option>)}
                    </optgroup>
                  )}
                  <optgroup label="Référence fromages">
                    {addOptions.ref.map((d,i)=><option key={"r"+i} value={d}>{d}</option>)}
                  </optgroup>
                  <option value="__manual__">➕ Autre — saisir à la main…</option>
                </select>
              ) : (
                <div style={{display:"flex", gap:6}}>
                  <input value={newFr} onChange={e=>setNewFr(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addFromage(); }} placeholder="Nom du fromage (saisie libre)" autoFocus style={{flex:1, padding:10, border:"1.5px solid #8a5a00", borderRadius:8, fontSize:14}} />
                  <button onClick={()=>addFromage()} disabled={!newFr.trim()} style={{padding:"10px 16px", borderRadius:8, background:newFr.trim()?"#8a5a00":"#ccc", color:"#fff", fontWeight:800, fontSize:14, border:"none"}}>Ajouter</button>
                  <button onClick={()=>{ setAddManual(false); setNewFr(""); }} style={{padding:"10px 12px", borderRadius:8, background:"#f0f0f0", color:"#555", fontWeight:600, fontSize:13, border:"none"}}>Liste</button>
                </div>
              )}
            </div>
            {meta&&meta.docNumber
              ? <div style={{fontSize:11, color:"#777", margin:"0 2px 8px"}}>Lié au BL <b>n°{meta.docNumber}</b>{serverMeta&&serverMeta.loadedBy?<> · 📦 BL chargé par le responsable ({serverMeta.loadedBy})</>:<> · en attente du BL du responsable (la liste se complètera toute seule)</>}</div>
              : <div style={{display:"flex", gap:6, alignItems:"center", background:"#fff3e0", border:"1.5px solid #e65100", borderRadius:8, padding:8, margin:"0 2px 8px"}}>
                  <span style={{fontSize:12, color:"#e65100", fontWeight:800, flex:1}}>⚠ N° de BL manquant — obligatoire pour relier ta découpe au BL du responsable</span>
                  <input value={blEdit} onChange={e=>setBlEdit(e.target.value)} placeholder="N° BL" inputMode="numeric" style={{width:90, padding:8, border:"1.5px solid #e65100", borderRadius:6, fontSize:14}} />
                  <button onClick={saveBl} disabled={!blEdit.trim()} style={{padding:"8px 12px", borderRadius:6, background:blEdit.trim()?"#e65100":"#ccc", color:"#fff", fontWeight:800, border:"none"}}>OK</button>
                </div>}
            {filtered.length===0 && <div style={{textAlign:"center", padding:40, color:"#999"}}>Aucun fromage. Ajoute-en un ci-dessus, ou attends le BL.</div>}
            {filtered.map(p => {
              const st = state[p._pkey]||{}; const agg = frAggFull(p, st); const isDone = st.done;
              const rec = st.reception;
              const defMag = (p.kbgTarget>0 || p.robCmd===0) ? "KBG" : "ROB";
              const mag = st.magasin || defMag;
              const rob = st.rob || {}; const robUnit = rob.unit || "meule"; const meules = Number(rob.meules)||0;
              const addMeule = (f,lbl) => setRow(p._pkey,{ rob:{...rob, unit:robUnit, meules: Math.round((meules+f)*100)/100, type:lbl } });
              const kgApprox = agg.robG>0 ? Math.round(agg.robG/1000*10)/10 : 0;
              // Poids reçu (BL) / découpé (saisi) / restant — pour savoir ce qu'il reste à découper.
              const recuKg = Number(p.poidsRecu)||0;
              const decKg = (st.poidsDecoupe!=null && st.poidsDecoupe!=="") ? Number(st.poidsDecoupe) : null;
              const restantKg = (recuKg>0 && decKg!=null) ? Math.round((recuKg-decKg)*10)/10 : (recuKg>0?recuKg:null);
              return (
                <div className={`cheese-card ${isDone?"done":""}`} key={p._pkey}>
                  <div className="cc-name">{p.designation}{isDone && <span className="done-badge" style={{marginLeft:8}}>✓ {st.doneBy}</span>}{rec==="ok"&&<span className="badge" style={{marginLeft:6, background:"#e8f5e9", color:"#2e7d32", fontSize:11, padding:"2px 7px", borderRadius:9}}>reçu</span>}{rec==="nonconf"&&<span className="badge" style={{marginLeft:6, background:"#fdecea", color:"#c62828", fontSize:11, padding:"2px 7px", borderRadius:9}}>non conf.</span>}</div>
                  {/* ---- À LA PIÈCE : fromage NON découpé, vendu tel quel ---- */}
                  <label style={{display:"flex", alignItems:"center", gap:8, fontSize:13, margin:"2px 0 8px", padding:"8px 10px", fontWeight:800, color:st.sticker?"#e65100":"#555", background:st.sticker?"#fff3e0":"#f7f7f9", border:`1.5px solid ${st.sticker?"#e65100":"#e0e0e0"}`, borderRadius:8}}>
                    <input type="checkbox" checked={!!st.sticker} onChange={e=>setSticker(p._pkey,{sticker:e.target.checked})} style={{width:20, height:20}} />
                    🔖 Pas à découper — vendu à la pièce
                  </label>

                  {st.sticker ? (
                    /* Vendu à la pièce : on ne découpe pas, on note juste le nombre de pièces + le magasin. */
                    <div style={{marginBottom:6}}>
                      <div style={{fontSize:12, color:"#e65100", fontWeight:700, marginBottom:6}}>Ce fromage n'est pas découpé. Indique le nombre de pièces vendues telles quelles.</div>
                      <div style={{display:"flex", gap:6, alignItems:"flex-end", marginBottom:6}}>
                        <div style={{flex:1}}><label style={{fontSize:11, fontWeight:800, color:"#666"}}>Nombre de pièces</label>
                          <NumField big color="#e65100" borderColor="#e65100"
                            empty={st.stickerCount==null||st.stickerCount===""||!st.stickerCount}
                            display={st.stickerCount?String(st.stickerCount):"0"}
                            onOpen={()=>setPad({ title:p.designation, sub:"Nombre de pièces (à la pièce)", mode:"count", value:st.stickerCount, commit:(v)=>setSticker(p._pkey,{stickerCount:(v===""?0:v)}) })} /></div>
                        <div style={{flex:1.4}}><label style={{fontSize:11, fontWeight:800, color:"#666"}}>Magasin</label>
                          <div style={{display:"flex", gap:4}}>
                            {FROMAGE_ENTITES.map(e=>(<button key={e.code} onClick={()=>setSticker(p._pkey,{magasin:e.code})} style={{flex:1, padding:10, borderRadius:6, fontSize:13, fontWeight:800, border:"none", background:mag===e.code?(e.code==="KBG"?"#1565c0":"#6a1b9a"):"#eef2f7", color:mag===e.code?"#fff":"#333"}}>{e.code}</button>))}
                          </div></div>
                      </div>
                    </div>
                  ) : isRob ? (<>
                  <div className="cc-tar">
                    <div className="tgt rob" style={{flex:1}}><span className="big">{meules}</span>{robUnit==="meule"?"meule(s)":"colis"} découpé(s){p.robCmd>0?` · cmd ${p.robCmd}`:""}</div>
                    <div className="tgt" style={{flex:1, background:"#ede7f6", color:"#5e35b1"}}><span className="big">{agg.robN}</span>morceaux{kgApprox>0?` · ≈ ${kgApprox} kg`:""}</div>
                  </div>
                  <div style={{fontSize:11, fontWeight:800, color:"#666", margin:"2px 0 3px"}}>TYPE DE COUPE</div>
                  <div style={{display:"flex", gap:4, margin:"0 0 6px"}}>
                    {[["Entier",1],["½ meule",0.5],["¼",0.25]].map(([lbl,f])=>(
                      <button key={lbl} onClick={()=>addMeule(f,lbl)} style={{flex:1, padding:12, borderRadius:6, border:`1.5px solid ${rob.type===lbl?"#6a1b9a":"#ce93d8"}`, background:rob.type===lbl?"#6a1b9a":"#fff", color:rob.type===lbl?"#fff":"#6a1b9a", fontSize:15, fontWeight:800}}>+{lbl}</button>
                    ))}
                    <button onClick={()=>setRow(p._pkey,{rob:{...rob, meules:0, type:"libre"}})} title="Réinitialiser" style={{padding:"12px 12px", borderRadius:6, border:"1.5px solid #ddd", background:"#fafafa", color:"#c62828", fontSize:15, fontWeight:700}}>↺</button>
                  </div>
                  <div style={{display:"flex", gap:6, alignItems:"flex-end", marginBottom:6}}>
                    <div style={{flex:1}}><label style={{fontSize:11, fontWeight:800, color:"#6a1b9a"}}>Poids total → Montreuil</label>
                      <NumField big color="#6a1b9a" borderColor="#6a1b9a"
                        empty={st.poidsDecoupe==null||st.poidsDecoupe===""}
                        display={(st.poidsDecoupe!=null&&st.poidsDecoupe!=="")?`${String(st.poidsDecoupe).replace(".",",")} kg`:"— kg"}
                        onOpen={()=>setPad({ title:p.designation, sub:"Poids total envoyé à Montreuil", mode:"weight", value:st.poidsDecoupe, commit:(v)=>setRow(p._pkey,{poidsDecoupe:v}) })} /></div>
                    <div style={{flex:1}}><label style={{fontSize:11, fontWeight:700, color:"#666"}}>Morceaux (option.)</label>
                      <NumField color="#333" borderColor="#ddd"
                        empty={!rob.morceaux}
                        display={rob.morceaux?String(rob.morceaux):"0"}
                        onOpen={()=>setPad({ title:p.designation, sub:"Nombre de morceaux (optionnel)", mode:"count", value:rob.morceaux, commit:(v)=>setRow(p._pkey,{rob:{...rob, morceaux:(v===""?0:v)}}) })} /></div>
                  </div>
                  {recuKg>0 && (
                    <div style={{display:"flex", gap:8, fontSize:12, background:"#faf6ff", border:"1px solid #e1c9f0", borderRadius:8, padding:"7px 10px", marginBottom:8}}>
                      <span>Reçu BL : <b>{recuKg} kg</b></span>
                      <span>· Découpé : <b>{decKg!=null?decKg:0} kg</b></span>

        </>
      )}
    </div>
  );
}

/* =========================================================================

function generateFromageBL(supplier, products, state, entity) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const entLabel = entity==="KBG" ? "KELBONGOO (Pantin)" : "PRIBON ROBESPIERRE";
  doc.setFillColor(138,90,0); doc.rect(0,0,210,25,"F");
  doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont(undefined,"bold"); doc.text("LA CENTRALE PDP", 14, 12);
  doc.setFontSize(11); doc.setFont(undefined,"normal"); doc.text("Découpe fromage — Bon de livraison", 14, 19);
  doc.setFontSize(16); doc.setFont(undefined,"bold"); doc.text(entLabel, 196, 15, { align:"right" });
  doc.setTextColor(0,0,0); doc.setFontSize(10); doc.setFont(undefined,"normal");
  let y=35; doc.text("Fournisseur : "+(supplier||"-"), 14, y); y+=6;
  doc.text("Date : "+new Date().toLocaleDateString("fr-FR"), 14, y); y+=8;
  const rows = [];
  products.forEach((p,idx) => {
    const st = state[frKey(p,idx)]||{}; const agg = frAggFull(p, st);
    if (entity==="KBG") { if (agg.kbgN>0) rows.push([ p.designation, String(agg.kbgN), Math.round(agg.kbgG)+" g" ]); }
    else { // Robespierre : meules/colis + morceaux + kg approx
      if (agg.robN>0 || agg.robMeules>0) { const unit=(st.rob&&st.rob.unit)||"meule"; const kg=agg.robG>0?(Math.round(agg.robG/1000*10)/10+" kg"):"—";
        rows.push([ p.designation, (agg.robMeules||0)+" "+(unit==="meule"?"meule(s)":"colis"), String(agg.robN||0), kg ]); }
    }
  });
  if (entity==="KBG") {
    doc.autoTable({ startY:y, head:[["Fromage","Pièces","Poids total"]], body:rows,
      headStyles:{ fillColor:[138,90,0], textColor:255, fontStyle:"bold" }, styles:{ fontSize:9, cellPadding:2 },
      columnStyles:{ 0:{cellWidth:120}, 1:{cellWidth:30, halign:"center"}, 2:{cellWidth:32, halign:"center"} }, margin:{left:14,right:14} });
    const totN = rows.reduce((s,r)=>s+parseInt(r[1],10),0);
    const fy = doc.lastAutoTable.finalY+6; doc.setFont(undefined,"bold");
    doc.text(`TOTAL : ${rows.length} fromage(s) — ${totN} pièce(s)`, 14, fy);
  } else {
    doc.autoTable({ startY:y, head:[["Fromage","Découpé","Morceaux","Poids approx."]], body:rows,
      headStyles:{ fillColor:[106,27,154], textColor:255, fontStyle:"bold" }, styles:{ fontSize:9, cellPadding:2 },
      columnStyles:{ 0:{cellWidth:100}, 1:{cellWidth:34, halign:"center"}, 2:{cellWidth:26, halign:"center"}, 3:{cellWidth:26, halign:"center"} }, margin:{left:14,right:14} });
    const totN = rows.reduce((s,r)=>s+parseInt(r[2],10),0);
    const fy = doc.lastAutoTable.finalY+6; doc.setFont(undefined,"bold");
    doc.text(`TOTAL : ${rows.length} fromage(s) — ${totN} morceau(x)`, 14, fy);
  }
  doc.save(`Decoupe_${entity}_${(supplier||"").replace(/[^a-zA-Z0-9]/g,"")}_${new Date().toISOString().slice(0,10)}.pdf`);
}
function DecoupeRecap({ sessionId, operator, supplier, entity, products, state, allDecoupe, onClose, onLeave }) {
  const [sent, setSent] = useState(false); const [sending, setSending] = useState(false); const [error, setError] = useState("");
  const dateKey = todayKey();
  const dateStr = new Date().toLocaleDateString("fr-FR");
  // RÉCAP CONSOLIDÉ DE LA JOURNÉE : agrège toutes les sessions du jour (Kelbongoo + Montreuil,
  // tous les BL, découpe libre). Un seul envoi de fin de journée au lieu d'un envoi par fromage/session.
  const day = useMemo(() => dayDecoupeAgg(allDecoupe, dateKey), [allDecoupe, dateKey]);
  const kgMontreuilKbg = day.kbgMontreuilG>0 ? Math.round(day.kbgMontreuilG/1000*10)/10 : 0;
  const kgRob = day.robG>0 ? Math.round(day.robG/1000*10)/10 : 0;
  const rp = day.rendPortions; const bravoP = rp!=null ? rp>=FROMAGE_RENDEMENT_OK : true;
  const nbSessions = day.sessions.length;
  const alreadySent = day.sessions.some(se=>{ const s=(allDecoupe||{})[se.id]; return s && s.recap && s.recap.daySentAt; });
  const send = async () => {
    setSending(true); setError("");
    const kbgOut = day.kbgLines.map(l=>({ entity:"KBG", designation:l.designation, kbgN:l.kbgN, kbgTheo:l.theo||0, rend:(l.rend!=null?l.rend:null), kbgG:Math.round(l.kbgG||0), robG:Math.round(l.montreuilG||0), poidsRecu:Math.round(l.poidsRecu||0) }));
    const robOut = day.robLines.map(l=>({ entity:"ROB", designation:l.designation, robMeules:Math.round((l.robMeules||0)*100)/100, robN:l.robN||0, robG:Math.round(l.robG||0), robUnit:l.robUnit||"meule" }));
    const payload = { action:"log-decoupe-recap", sessionId, journee:true, date:dateStr, dateKey, at:new Date().toISOString(),
      operator:safeName(operator.name), operatorCode:operator.code, brand:BRAND,
      mailTo:DECOUPE_MAIL, subject:`Découpe du jour — ${dateStr}`,
      subjectKbg:`Découpe Kelbongoo du ${dateStr}`, subjectRob:`Découpe Montreuil du ${dateStr}`,
      nbSessions, rendementPortions:(day.rendPortions!=null?day.rendPortions:null),
      totals:{ kbgN:day.kbgN, kbgTheo:day.kbgTheo, kbgG:day.kbgG, kbgMontreuilG:day.kbgMontreuilG, robN:day.robN, robG:day.robG, robMeules:day.robMeules },
      lines:[...kbgOut, ...robOut] };
    try {
      await fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload) });
      // Marque toutes les sessions du jour comme « récap envoyé » (info pour la console).
      if (firebaseReady) day.sessions.forEach(se=>{ db.ref(`decoupe/${se.id}/recap`).update({ daySentAt:Date.now(), daySentBy:operator.name||("#"+operator.code) }).catch(()=>{}); });
      if (bravoP && day.hasKbg) { try{ launchConfetti(); }catch(e){} }
      setSent(true);
    } catch(e){ setError(e.message); } finally { setSending(false); }
  };
  return (
    <div className="app">
      <div className="header fr-head" style={{background:"#8a5a00"}}>
        <div className="header-row"><div><h1>Récap de la journée</h1><div className="sub">🧀 Découpe du {dateStr} · {nbSessions} découpe(s)</div></div>
          <div className="header-actions"><button className="header-btn" onClick={onClose}>← Retour</button></div></div>
      </div>
      <div className="recap-section">
        {!day.hasKbg && !day.hasRob && (
          <div className="recap-card" style={{textAlign:"center", color:"#999", fontSize:14}}>Aucune découpe saisie aujourd'hui pour l'instant.</div>
        )}
        {day.hasKbg && (
          <div className="recap-card" style={{textAlign:"center", background:bravoP?"#e8f5e9":"#fff3e0", border:`1.5px solid ${bravoP?"#a5d6a7":"#ffcc80"}`}}>
            <div style={{fontSize:44, fontWeight:900, color:bravoP?"#2e7d32":"#e65100"}}>{rp!=null?`${rp}%`:`${day.kbgN}`}</div>
            <div style={{fontSize:15, fontWeight:800, color:bravoP?"#2e7d32":"#e65100"}}>{rp!=null?`Rendement Kelbongoo — ${bravoP?"bravo 👏":"peut mieux faire"}`:"portions Kelbongoo"}</div>
            <div style={{fontSize:12, color:"#666", marginTop:4}}>{day.kbgN} portions réelles{day.kbgTheo>0?` / ${day.kbgTheo} théoriques`:""} · {Math.round(day.kbgG/1000*10)/10} kg{kgMontreuilKbg>0?` · ${kgMontreuilKbg} kg hors gabarit → Montreuil`:""}</div>
          </div>

        {day.hasRob && (
          <div className="recap-card" style={{textAlign:"center", background:"#f3e5f5", border:"1.5px solid #ce93d8"}}>

            <div style={{fontSize:15, fontWeight:800, color:"#6a1b9a"}}>{day.robN} morceaux découpés{kgRob>0?` · ≈ ${kgRob} kg`:""}</div>
            <div style={{fontSize:12, color:"#666", marginTop:4}}>Pribon Robespierre / Montreuil — vendu au poids</div>

        {day.hasKbg && (

            <h3>🔵 Kelbongoo — détail par fromage</h3>

            {day.robLines.map((l,i)=>(
              <div className="recap-stat" key={"r"+i}><span className="label">{l.designation}</span>
                <span className="value">{l.robMeules} {l.robUnit==="colis"?"colis":"meule(s)"} · {l.robN} morceaux{l.robG>0?` · ≈ ${Math.round(l.robG/1000*10)/10} kg`:""}</span></div>
            ))}
          </div>
        )}
        <div className="recap-card">
          <h3>📄 Bon de livraison — cette découpe</h3>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8}}>
            <button className="btn-secondary" onClick={()=>generateFromageBL(supplier, products, state, "KBG")}>BL Kelbongoo</button>

        </div>
        <div className="recap-card">
          <h3>📤 Clôturer la journée & envoyer le récap</h3>
          <p style={{fontSize:12, color:"#666", margin:"0 0 10px"}}>Un <b>seul</b> envoi pour toute la journée (les {nbSessions} découpe(s) du jour, Kelbongoo + Montreuil) vers <b>{DECOUPE_MAIL}</b> et le suivi de la console. À faire une fois que <b>toutes</b> les découpes du jour sont terminées.</p>

      </div>
    </div>
  );

/* =========================================================================

function AdminLoadFromage({ onSessionStart }) {
  const [supplierName, setSupplierName] = useState("");
  const [poids, setPoids] = useState(String(FROMAGE_DEFAULT_POIDS));
  const [tol, setTol] = useState(String(FROMAGE_DEFAULT_TOL));
  const [pending, setPending] = useState(null);
  const [error, setError] = useState("");
  const [sent, setSent] = useState(false);
  const fileRef = useRef(null);
  const processFile = async (file) => {
    setError(""); if (!file) return;
    try {
      const buf = await file.arrayBuffer(); const wb = XLSX.read(buf, { type:"array" });
      const { products, hasRob, hasKbg } = parseFromageFile(wb);
      const P = parseInt(poids,10)||FROMAGE_DEFAULT_POIDS, T = parseInt(tol,10)||FROMAGE_DEFAULT_TOL;
      const prods = products.map(p => ({ ...p, poids:p.poids||P, tol:T }));
      setPending({ products:prods, hasRob, hasKbg, fileName:file.name||"decoupe" });
    } catch(e){ setError("Erreur de lecture : "+e.message); setPending(null); }
  };
  const sendDecoupe = () => {
    if (!pending) { setError("Charge d'abord le fichier de découpe."); return; }
    const supplier = supplierName.trim() || "Découpe";
    setSent(true); launchConfetti();
    const sid = `decoupe_${stripAccents(supplier).replace(/[^a-zA-Z0-9]/g,"_").toLowerCase()}_${Date.now()}`;
    onSessionStart(sid, supplier, pending.products);
  };
  return (
    <>
      <div className="recap-card">
        <h3>🧀 Charger une découpe fromage</h3>
        <div className="field"><label>Fournisseur / lot</label>
          <input type="text" value={supplierName} onChange={e=>setSupplierName(e.target.value)} placeholder="Ex: LAITERIE X" style={{textTransform:"uppercase"}} disabled={!!pending} /></div>
        <div style={{display:"flex", gap:8}}>
          <div className="field" style={{flex:1}}><label>Poids pièce Kelbongoo (g)</label>
            <input type="number" value={poids} onChange={e=>setPoids(e.target.value)} disabled={!!pending} /></div>
          <div className="field" style={{flex:1}}><label>Tolérance ± %</label>
            <input type="number" value={tol} onChange={e=>setTol(e.target.value)} disabled={!!pending} /></div>
        </div>
        {!pending && (
          <div className="upload-zone" onClick={()=>fileRef.current&&fileRef.current.click()}>
            <div className="icon">🧀</div>
            <div className="label">Charger le fichier de découpe (Excel)</div>
            <div className="hint">colonnes Robespierre / Kelbongoo (+ poids optionnel)</div>
          </div>
        )}
        <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>processFile(e.target.files[0])} />
        {pending && (
          <div style={{background:"#fff8e1", border:"1.5px solid #ffe082", borderRadius:8, padding:12, marginTop:4}}>
            <div style={{fontWeight:700, color:"#8a5a00"}}>✓ Fichier prêt : {pending.fileName}</div>
            <div style={{fontSize:13, color:"#333", marginTop:4}}>{pending.products.length} fromage(s) · {pending.hasRob?"colonne Robespierre ✓":"⚠ pas de colonne Robespierre"} · {pending.hasKbg?"colonne Kelbongoo ✓":"⚠ pas de colonne Kelbongoo"}</div>
            <div style={{fontSize:12, color:"#666", marginTop:4}}>Pièce Kelbongoo cible : {parseInt(poids,10)||FROMAGE_DEFAULT_POIDS} g · ±{parseInt(tol,10)||FROMAGE_DEFAULT_TOL}%</div>
            <button className="btn-secondary" onClick={()=>{ setPending(null); setSent(false); if(fileRef.current)fileRef.current.value=""; }} style={{marginTop:8, fontSize:13}}>↺ Changer de fichier</button>
          </div>
        )}
        {error && <div style={{color:"#d32f2f", fontSize:13, marginTop:12}}>{error}</div>}
      </div>
      <div className="recap-card" style={{border:"1.5px solid #8a5a00"}}>
        <h3>🚀 Lancer la découpe</h3>
        <button className="btn-primary" onClick={sendDecoupe} disabled={!pending||sent} style={{background:(!pending||sent)?"#aaa":"#ef8f00", fontSize:17}}>{sent?"🎉 Découpe lancée !":"🚀 Lancer la découpe"}</button>
      </div>
    </>
  );
}

              <label style={{fontSize:12, fontWeight:700, color:"#666"}}>URL de la console</label>
              <input type="text" value={draft} onChange={e=>setDraft(e.target.value)} style={{width:"100%", padding:10, border:"1.5px solid #ddd", borderRadius:8, fontSize:13, marginTop:4}} placeholder="https://…/chargement.html" />
              <div style={{display:"flex", gap:8, marginTop:8}}>
                <button className="btn-secondary" style={{flex:1}} onClick={()=>setEdit(false)}>Annuler</button>
                <button className="btn-primary" style={{flex:1}} onClick={save}>Enregistrer</button>
              </div>
            </div>
          )}
        </div>
        <button className="btn-secondary" onClick={onBack} style={{color:"#666"}}>← Retour au menu</button>
      </div>
    </div>
  );
}

// Abonnement live à tous les inventaires vin.
function useInventaireVin() {
  const [all, setAll] = useState({});
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref("inventaire_vin");
    const h = (snap) => setAll(snap.val() || {});
    ref.on("value", h);
    return () => ref.off("value", h);
  }, []);
  return all;
}

// Compteur de quantité (cartons / bouteilles) avec + / − et saisie directe.
function QtyBox({ label, val, onDelta, onSet, onBlur, color, autoFocus }) {

// Résumé (nb de références + total bouteilles) d'un inventaire.
function vinSummary(v) {
  const L = Object.values((v && v.lines) || {});
  let units = 0, refs = 0;
  L.forEach(l => { const u = (l.units!=null ? l.units : ((l.cartons||0)*CARTON_VIN + (l.bottles||0))); if (u>0) refs++; units += u; });
  return { refs, units };
}

function InventaireVinHome({ operator, allVin, onNew, onJoin, onBack, onLogout }) {
  const today = todayKey();
  const list = Object.entries(allVin||{}).map(([id,v])=>Object.assign({id}, v||{}))
    .filter(v=>v.meta).sort((a,b)=>((b.meta.startedAt||0)-(a.meta.startedAt||0)));
  const todays = list.filter(v=>(v.meta.dateKey||"")===today);
  const older  = list.filter(v=>(v.meta.dateKey||"")!==today);
  const card = (v) => {
    const s = vinSummary(v);
    const st  = v.validated ? "validé" : (v.meta.closed ? "clôturé" : "en cours");
    const col = v.validated ? "#2e7d32" : (v.meta.closed ? "#5e35b1" : "#e65100");
    return (
      <div key={v.id} className="pal-card" onClick={()=>onJoin(v.id)}>
        <div className="pc-top">
          <div className="pc-store" style={{fontSize:16}}>🍷 {v.meta.label||"Inventaire vin"}</div>
          <span className="pc-num" style={{background:col}}>{st}</span>
        </div>
        <div style={{fontSize:12, color:"#666", marginBottom:8}}>{fmtTime(v.meta.startedAt)} · {safeName(v.meta.createdBy)}</div>
        <div className="pc-foot">
          <div><b>{s.refs}</b> réf.</div>
          <div style={{color:"#7b1e3a"}}><b>{s.units}</b> bouteille(s)</div>
        </div>
      </div>
    );
  };
  return (
    <div className="app">
      <div className="header" style={{background:"#7b1e3a"}}>
        <div className="header-row">
          <div><h1>🍷 Inventaire vin</h1><div className="sub">{BRAND} • entrepôt</div></div>
          <div className="header-actions"><button className="header-btn" onClick={onBack}>← Menu</button></div>
        </div>
      </div>
      <div style={{padding:16, maxWidth:640, margin:"0 auto"}}>
        <button className="btn-primary" style={{background:"#7b1e3a", marginBottom:18}} onClick={onNew}>＋ Nouvel inventaire</button>
        <h3 style={{fontSize:14, color:"#555", margin:"6px 4px 8px"}}>Aujourd'hui</h3>
        {todays.length ? todays.map(card) : <div className="admin-note">Aucun inventaire aujourd'hui.</div>}
        {older.length>0 && <><h3 style={{fontSize:14, color:"#555", margin:"18px 4px 8px"}}>Précédents</h3>{older.slice(0,10).map(card)}</>}
        <div className="land-foot" style={{marginTop:22}}>
          {onLogout && <button onClick={onLogout} style={{color:"#c62828"}}>↪ Se déconnecter</button>}
        </div>
      </div>
    </div>
  );
}

function InventaireVinScreen({ invId, inv, operator, onLeave }) {
  const [localInv, setLocalInv] = useState(inv || {meta:{}, lines:{}});
  const data  = firebaseReady ? (inv || {meta:{}, lines:{}}) : localInv;
  const lines = data.lines || {};
  const meta  = data.meta  || {};
  const [scan, setScan] = useState("");
  const [activeKey, setActiveKey] = useState(null);
  const [editKey, setEditKey] = useState(null); // ligne en cours d'édition dans la popup
  const [scanMode, setScanMode] = useState("select"); // select = scan → popup quantité (défaut) ; bottle = 1 scan +1 bouteille
  const [showCam, setShowCam] = useState(false);
  const [toast, setToast] = useState("");
  const [showMissing, setShowMissing] = useState(false); // popup des vins non comptés (inventaire ciblé)
  const [linkQuery, setLinkQuery] = useState("");        // recherche pour lier un scan inconnu à la liste
  const scanRef = useRef(null);
  const focusScan = () => { setTimeout(()=>{ if (scanRef.current) scanRef.current.focus({ preventScroll:true }); }, 30); };
  useEffect(()=>{ focusScan(); }, []);
  const flash = (m) => { setToast(m); setTimeout(()=>setToast(""), 1100); };
  const opBy = operator.name || "Opérateur";

  // Écriture d'une ligne (saisie manuelle / désignation).
  const writeLine = (key, patch) => {
    const cur  = lines[key] || {};
    const next = Object.assign({}, cur, patch);
    next.units = (Number(next.cartons)||0)*CARTON_VIN + (Number(next.bottles)||0);
    next.updatedAt = Date.now();
    if (cur.createdAt == null) next.createdAt = Date.now();
    next.by = opBy;
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/lines/${key}`).update(next);
    else setLocalInv(d => ({ ...d, lines: { ...(d.lines||{}), [key]: Object.assign({}, (d.lines||{})[key], next) } }));
  };
  const removeLine = (key) => {
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/lines/${key}`).remove();
    else setLocalInv(d => { const l = {...(d.lines||{})}; delete l[key]; return {...d, lines:l}; });
    if (activeKey === key) setActiveKey(null);
    focusScan();
  };

  const commitScan = (raw) => {
    const ean = extractEan(raw); // gère code-barres classique ET QR/DataMatrix GS1
    if (ean.length < 4) { setScan(""); focusScan(); return; }
    if (scanMode === "bottle") {
      // Mode « 1 scan = 1 bouteille » : on regroupe par code-barres (incrément atomique).
      const key = vinLineKey(ean);
      if (firebaseReady) {
        db.ref(`inventaire_vin/${invId}/lines/${key}`).transaction(cur => {
          cur = cur || { ean, cartons:0, bottles:0, createdAt:Date.now() };
          cur.ean = ean;
          cur.cartons = Number(cur.cartons)||0;
          cur.bottles = (Number(cur.bottles)||0) + 1;
          cur.units = cur.cartons*CARTON_VIN + cur.bottles;
          cur.updatedAt = Date.now(); cur.by = opBy;
          return cur;
        });
      } else {
        setLocalInv(d => {
          const l = {...(d.lines||{})}; const c = l[key] || { ean, cartons:0, bottles:0, createdAt:Date.now() };
          const b = (Number(c.bottles)||0)+1; const ca = Number(c.cartons)||0;
          l[key] = Object.assign({}, c, { ean, bottles:b, cartons:ca, units:ca*CARTON_VIN+b, updatedAt:Date.now(), by:opBy });
          return {...d, lines:l};
        });
      }
      flash("🍾 +1 bouteille");
      setActiveKey(key);
      setScan(""); focusScan();
    } else if (isCible) {
      // Inventaire CIBLÉ : on relie le scan à la liste du fournisseur.
      const known = eanMap[ean];
      if (known && refByCode[String(known)]) {
        // EAN déjà connu → on ouvre directement le vin de la liste.
        const key = "r_" + known; const rw = refByCode[String(known)];
        if (!lines[key]) writeLine(key, { ean, code:String(known), designation:rw.designation||"", bottles:0, cartons:0 });
        else writeLine(key, { ean });
        setActiveKey(key); setEditKey(key);
      } else {
        // EAN inconnu → ligne à lier (la popup proposera la liste du fournisseur).
        const key = "s_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
        writeLine(key, { ean, bottles:0, cartons:0, needsLink:true });
        setActiveKey(key); setEditKey(key); setLinkQuery("");
      }
      setScan("");
    } else {
      // Mode « Scan → quantité » : CHAQUE scan crée une NOUVELLE ligne, même si le
      // code-barres a déjà été scanné (c'est PROGMAG/G5 qui fusionnera les codes ensuite).
      const key = "s_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
      writeLine(key, { ean, bottles:0, cartons:0 });
      setActiveKey(key);
      setEditKey(key);
      setScan("");
    }
    try { navigator.vibrate && navigator.vibrate(40); } catch(e){}
  };

  const openEditor  = (key) => { setActiveKey(key); setEditKey(key); };
  const closeEditor = () => { setEditKey(null); focusScan(); };

  // Bouteille SANS code-barres : on crée une ligne manuelle et on ouvre la popup (désignation + quantité).
  const addManualLine = () => {
    const key = "m_" + Date.now();
    writeLine(key, { ean:"", designation:"", bottles:0, cartons:0, manual:true });
    setActiveKey(key); setEditKey(key); setScan("");
  };

  const setQty = (key, field, val) => writeLine(key, { [field]: Math.max(0, Math.floor(Number(val)||0)) });
  // NB : plus de focusScan() ici — c'est ce qui faisait remonter la page à chaque +.
  const bump   = (key, field, delta) => {
    const cur = lines[key] || {}; writeLine(key, { [field]: Math.max(0, (Number(cur[field])||0)+delta) });
  };

  const arr = Object.entries(lines).map(([k,l])=>Object.assign({key:k}, l))
    .sort((a,b)=>((a.createdAt||0)-(b.createdAt||0)));
  const uOf = (l) => (l.units!=null ? l.units : ((l.cartons||0)*CARTON_VIN + (l.bottles||0)));
  const totalUnits = arr.reduce((s,l)=>s+uOf(l), 0);
  const refs = arr.filter(l=>uOf(l)>0).length;

  // ---- Inventaire CIBLÉ (liste de référence poussée par la console) ----
  const isCible  = !!meta.cible;
  const refList  = Array.isArray(meta.ref) ? meta.ref : [];
  const eanMap   = meta.eanMap || {};
  const refByCode = {}; refList.forEach(r=>{ if(r&&r.code!=null) refByCode[String(r.code)] = r; });
  // Un vin de la liste est "compté" s'il existe une ligne avec ce code (unités>0 ou explicitement pointé à 0).
  const countedCodes = {}; arr.forEach(l=>{ if(l.code!=null && l.code!=="" && (uOf(l)>0 || l.counted)) countedCodes[String(l.code)] = true; });
  const missingRefs = refList.filter(r => !countedCodes[String(r.code)]);
  const cibleCounted = refList.length - missingRefs.length;
  const learnEan = (ean, code) => {
    if (!ean) return;
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/meta/eanMap/${ean}`).set(code);
    else setLocalInv(d => ({ ...d, meta:{ ...(d.meta||{}), eanMap:{ ...((d.meta||{}).eanMap||{}), [ean]:code } } }));
  };
  // Pointe un vin de la liste (par code) à une quantité (bouteilles). counted:true => exporté même à 0.
  const setRefQty = (code, qty) => {
    const rw = refByCode[String(code)] || {};
    writeLine("r_"+code, { code:String(code), designation:rw.designation||"", ean:"", cartons:0, bottles:Math.max(0,Math.floor(Number(qty)||0)), counted:true });
  };
  // Lie une ligne scannée (EAN inconnu) à un vin de la liste + mémorise le lien pour la prochaine fois.
  const linkScanToRef = (key, code) => {
    const ln = lines[key] || {}; const rw = refByCode[String(code)] || {};
    writeLine(key, { code:String(code), designation:rw.designation||"", needsLink:false });
    if (ln.ean) learnEan(ln.ean, code);
    setLinkQuery("");
  };

  const doClose = () => {
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/meta/closed`).set(true);
    else setLocalInv(d => ({ ...d, meta:{ ...(d.meta||{}), closed:true } }));
    onLeave();
  };
  const cloturer = () => {
    // Inventaire ciblé : avant de clôturer, on montre les vins non comptés (popup 0 / quantité retrouvée).
    if (isCible && missingRefs.length > 0) { setShowMissing(true); return; }
    if (!confirm("Clôturer cet inventaire ?\n\nLa validation et la génération du .txt (pour PROGMAG) se font ensuite dans la console responsable.")) return;
    doClose();
  };
  const rename = () => {
    const n = prompt("Nom de l'inventaire :", meta.label || "Inventaire vin");
    if (n == null) return;
    const lab = n.trim() || "Inventaire vin";
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/meta/label`).set(lab);
    else setLocalInv(d => ({ ...d, meta:{ ...(d.meta||{}), label:lab } }));
  };

  return (
    <div className="app">
      <div className="header" style={{background:"#7b1e3a"}}>
        <div className="header-row">
          <div><h1 onClick={rename} style={{cursor:"pointer"}}>🍷 {meta.label||"Inventaire vin"} ✎</h1><div className="sub">{refs} réf. · {totalUnits} bouteille(s){isCible?` · 🎯 ${cibleCounted}/${refList.length} liste`:""}</div></div>
          <div className="header-actions"><button className="header-btn" onClick={onLeave}>← Retour</button></div>
        </div>
      </div>

      <div style={{padding:14, paddingBottom:130}}>
        {!firebaseReady && <div className="admin-note" style={{color:"#c62828"}}>⚠️ Hors-ligne : l'inventaire ne sera pas synchronisé avec la console.</div>}

        {isCible
          ? <div style={{marginBottom:10, padding:"8px 12px", borderRadius:8, background:"#fbeef2", border:"1.5px solid #7b1e3a", fontSize:13, color:"#7b1e3a", fontWeight:700}}>🎯 Inventaire ciblé{meta.fournisseur?(" — "+meta.fournisseur):""} · scanne, à la clôture les vins non comptés te seront proposés.</div>
          : <div style={{display:"flex", gap:8, marginBottom:10}}>
              <button onClick={()=>{setScanMode("select");focusScan();}} style={{flex:1, padding:10, borderRadius:8, fontWeight:800, fontSize:13, border:"1.5px solid #7b1e3a", background:scanMode==="select"?"#7b1e3a":"#fff", color:scanMode==="select"?"#fff":"#7b1e3a"}}>Scan → quantité</button>
              <button onClick={()=>{setScanMode("bottle");focusScan();}} style={{flex:1, padding:10, borderRadius:8, fontWeight:800, fontSize:13, border:"1.5px solid #7b1e3a", background:scanMode==="bottle"?"#7b1e3a":"#fff", color:scanMode==="bottle"?"#fff":"#7b1e3a"}}>1 scan = 1 bouteille</button>
            </div>}

        <div className="scan-search-wrap">
          <input ref={scanRef} className="scan-search-input" style={{borderColor:"#7b1e3a"}} type="text" inputMode="numeric"
            placeholder="Scanne un code-barres…" value={scan}
            onChange={e=>setScan(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); commitScan(scan); } }} autoFocus />
        </div>
        <div style={{display:"flex", gap:8, marginBottom:10}}>
          <button className="btn-secondary" style={{flex:1}} onClick={()=>setShowCam(true)}>📷 Caméra</button>
          <button className="btn-secondary" style={{flex:1}} onClick={()=>commitScan(scan)} disabled={!scan}>Ajouter</button>
        </div>
        <button onClick={addManualLine} style={{width:"100%", padding:12, marginBottom:14, borderRadius:10, fontWeight:800, fontSize:14, border:"1.5px dashed #7b1e3a", background:"#fff", color:"#7b1e3a"}}>✏️ Bouteille sans code-barres</button>

        <h3 style={{fontSize:14, color:"#555", margin:"8px 4px"}}>Lignes ({arr.length})</h3>
        {arr.length===0 && <div className="admin-note">Scanne un premier code-barres, ou ajoute une bouteille sans code-barres.</div>}
        {arr.slice().reverse().map(l=>{
          const un = uOf(l); const isA = l.key===activeKey; const noBar = !l.ean;
          const toLink = l.needsLink && !l.code;
          const hasName = !!(l.code && l.designation);
          const titre = hasName ? l.designation : (toLink ? "⚠️ À lier" : (noBar ? (l.designation || "Sans code-barres") : l.ean));
          const sous  = hasName
            ? `${l.ean||""}${(l.cartons||0)>0?` · ${l.cartons} carton(s)`:""}${(l.bottles||0)>0?` · ${l.bottles} vrac`:""}`
            : (noBar
              ? [(l.cartons||0)>0?`${l.cartons} carton(s)`:"", (l.bottles||0)>0?`${l.bottles} vrac`:""].filter(Boolean).join(" · ")
              : `${l.designation||l.ean}${(l.cartons||0)>0?` · ${l.cartons} carton(s)`:""}${(l.bottles||0)>0?` · ${l.bottles} vrac`:""}`);
          return (
            <div key={l.key} onClick={()=>openEditor(l.key)}
              style={{background:isA?"#fbe9ee":(toLink?"#fff7f9":"#fff"), border:"1.5px solid "+(isA?"#7b1e3a":(toLink?"#e6a8bd":"#e6e8ec")), borderRadius:10, padding:"10px 12px", marginBottom:8, cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", gap:10}}>
              <div style={{minWidth:0}}>
                <div style={{fontFamily:(hasName||noBar||toLink)?"inherit":"monospace", fontWeight:700, fontSize:14, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{noBar&&!toLink&&!hasName?"✏️ ":""}{titre}</div>
                <div style={{fontSize:12, color:"#777", fontFamily:hasName?"monospace":"inherit", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{sous}</div>
              </div>
              <div style={{fontWeight:900, fontSize:18, color:"#7b1e3a", whiteSpace:"nowrap"}}>{un}</div>
            </div>
          );
        })}
      </div>

      <div className="bottom-bar">
        <div className="stats"><span>{refs} référence(s)</span><span>Total : <b>{totalUnits}</b> bouteille(s)</span></div>
        <button className="btn-finish" style={{background:"#7b1e3a"}} onClick={cloturer}>✓ Clôturer l'inventaire</button>
      </div>

      {toast && <div className="toast">{toast}</div>}
      {showCam && <CameraScanner onDetect={(code)=>{ setShowCam(false); commitScan(code); }} onClose={()=>{ setShowCam(false); focusScan(); }} />}

      {/* Popup de saisie de quantité (s'ouvre au scan, sur « sans code-barres », ou en touchant une ligne). */}
      {editKey && lines[editKey] && (() => {
        const el = lines[editKey]; const noBar = !el.ean;
        const needsLink = isCible && el.needsLink && !el.code;
        const linked = isCible && el.code;
        const q = stripAccents((linkQuery||"").toLowerCase());
        const propositions = needsLink ? refList.filter(r => { const d=stripAccents((r.designation||"").toLowerCase()); const c=String(r.code||""); return !q || d.includes(q) || c.includes(q); }).slice(0,40) : [];
        return (
        <div onClick={closeEditor}
          style={{position:"fixed", inset:0, background:"rgba(0,0,0,.5)", zIndex:1000, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"28px 12px", overflowY:"auto"}}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:"#fff", width:"100%", maxWidth:460, borderRadius:16, padding:18, boxShadow:"0 12px 40px rgba(0,0,0,.3)"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, gap:8}}>
              <div style={{fontWeight:800, fontSize:15, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
                {linked ? ("🍷 "+(el.designation||el.code)) : (noBar ? "✏️ Sans code-barres" : (<span style={{fontFamily:"monospace"}}>{el.ean}</span>))}
              </div>
              <button onClick={()=>{ removeLine(editKey); setEditKey(null); }}
                style={{background:"#fdecea", color:"#c62828", borderRadius:6, padding:"6px 12px", fontWeight:700, fontSize:13, whiteSpace:"nowrap"}}>🗑 Supprimer</button>
            </div>
            {needsLink && (
              <div style={{marginBottom:14, border:"1.5px solid #7b1e3a", borderRadius:10, padding:10, background:"#fbeef2"}}>
                <div style={{fontSize:13, fontWeight:800, color:"#7b1e3a", marginBottom:2}}>Code-barres inconnu : <span style={{fontFamily:"monospace"}}>{el.ean}</span></div>
                <div style={{fontSize:12, color:"#666", marginBottom:8}}>Choisis le vin correspondant dans la liste du fournisseur (mémorisé pour la prochaine fois) :</div>
                <input type="text" value={linkQuery} onChange={e=>setLinkQuery(e.target.value)} placeholder="Rechercher un vin…" autoFocus
                  style={{width:"100%", padding:10, border:"1.5px solid #ddd", borderRadius:8, marginBottom:8, fontSize:14}} />
                <div style={{maxHeight:200, overflowY:"auto"}}>
                  {propositions.map(r => (
                    <div key={r.code} onClick={()=>linkScanToRef(editKey, r.code)}
                      style={{padding:"8px 10px", borderBottom:"1px solid #f0e0e6", cursor:"pointer", fontSize:13}}>
                      {r.designation||"(sans nom)"} <span style={{color:"#999", fontFamily:"monospace"}}>· {r.code}</span>
                    </div>
                  ))}
                  {propositions.length===0 && <div style={{fontSize:12, color:"#999", padding:6}}>Aucun vin trouvé.</div>}
                </div>
                <div style={{fontSize:11, color:"#999", marginTop:6}}>Ou saisis quand même une quantité ci-dessous (le vin restera « hors liste »).</div>
              </div>
            )}
            <input type="text" value={el.designation||""} placeholder={noBar ? "Désignation (ex. Côtes du Rhône 75cl)" : "Désignation (optionnel)"}
              autoFocus={noBar && !needsLink}
              onChange={e=>writeLine(editKey,{designation:e.target.value})}
              style={{width:"100%", padding:12, border:"1.5px solid "+(noBar?"#7b1e3a":"#ddd"), borderRadius:8, marginBottom:14, fontSize:15}} />
            <div style={{display:"flex", gap:12, marginBottom:12}}>
              <QtyBox label="Cartons (×6)" val={el.cartons||0} onDelta={d=>bump(editKey,"cartons",d)} onSet={v=>setQty(editKey,"cartons",v)} onBlur={()=>{}} color="#7b1e3a" />
              <QtyBox label="Bouteilles" val={el.bottles||0} onDelta={d=>bump(editKey,"bottles",d)} onSet={v=>setQty(editKey,"bottles",v)} onBlur={()=>{}} color="#e65100" />
            </div>
            <div style={{textAlign:"center", fontSize:17, fontWeight:800, color:"#1a4d2e", background:"#e8f5e9", borderRadius:8, padding:"12px 0", marginBottom:14}}>
              = {(Number(el.cartons)||0)*CARTON_VIN + (Number(el.bottles)||0)} bouteille(s)
            </div>
            <button onClick={closeEditor}
              style={{width:"100%", padding:16, background:"#7b1e3a", color:"#fff", borderRadius:12, fontWeight:800, fontSize:17}}>✓ Valider</button>
          </div>
        </div>
        );
      })()}

      {/* Popup CLÔTURE inventaire ciblé : les vins de la liste non comptés (0 rapide / quantité retrouvée). */}
      {showMissing && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,.5)", zIndex:1100, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"22px 12px", overflowY:"auto"}}>
          <div style={{background:"#fff", width:"100%", maxWidth:520, borderRadius:16, padding:18, boxShadow:"0 12px 40px rgba(0,0,0,.3)"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6, gap:8}}>
              <div style={{fontWeight:900, fontSize:17}}>🍷 Vins non comptés</div>
              <div style={{fontSize:13, color:"#7b1e3a", fontWeight:800}}>{missingRefs.length} restant(s)</div>
            </div>
            <div style={{fontSize:12, color:"#666", marginBottom:12}}>
              {meta.fournisseur ? ("Fournisseur : "+meta.fournisseur+". ") : ""}Mets <b>0</b> (pas en stock) ou saisis la <b>quantité retrouvée</b> pour chaque vin. Les vins déjà comptés ont disparu de la liste.
            </div>
            {missingRefs.length===0
              ? <div style={{textAlign:"center", padding:"16px 0", color:"#2e7d32", fontWeight:800}}>✓ Tous les vins de la liste sont comptés.</div>
              : (
              <div style={{maxHeight:"52vh", overflowY:"auto", marginBottom:12}}>
                {missingRefs.map(r => (
                  <div key={r.code} style={{display:"flex", alignItems:"center", gap:8, padding:"8px 4px", borderBottom:"1px solid #f0f0f0"}}>
                    <div style={{flex:1, minWidth:0, fontSize:13}}>
                      <div style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{r.designation||"(sans nom)"}</div>
                      <div style={{fontSize:11, color:"#999", fontFamily:"monospace"}}>{r.code}</div>
                    </div>
                    <button onClick={()=>setRefQty(r.code, 0)}
                      style={{background:"#fdecea", color:"#c62828", border:"none", borderRadius:8, padding:"8px 12px", fontWeight:800, fontSize:14}}>0</button>
                    <input type="tel" inputMode="numeric" placeholder="retrouvé" defaultValue=""
                      onFocus={e=>e.target.select()}
                      onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); const v=e.target.value.replace(/\D/g,""); if(v!=="") setRefQty(r.code, v); } }}
                      onBlur={e=>{ const v=e.target.value.replace(/\D/g,""); if(v!=="") setRefQty(r.code, v); }}
                      style={{width:78, padding:"8px 6px", fontSize:15, fontWeight:700, textAlign:"center", border:"1.5px solid #ddd", borderRadius:8}} />
                  </div>
                ))}
              </div>
            )}
            <div style={{display:"flex", gap:8}}>
              <button onClick={()=>setShowMissing(false)}
                style={{flex:1, padding:14, background:"#eef2f7", color:"#333", borderRadius:12, fontWeight:800, fontSize:15}}>← Continuer l'inventaire</button>
              <button onClick={()=>{ setShowMissing(false); doClose(); }}
                style={{flex:1, padding:14, background:"#7b1e3a", color:"#fff", borderRadius:12, fontWeight:800, fontSize:15}}>✓ Clôturer</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   PICKING (v5.7) — préparation d'une commande magasin depuis le STOCK de l'entrepôt.
   Chargé par la console (onglet Chargement → carte « Dispatch & Picking » → mode Picking),
   nœud Firebase  picking/<sid>/{meta, state/<k>, closed}.
   - 1 picking = 1 magasin (meta.storeCode / meta.storeLabel).
   - Produits classés PAR FOURNISSEUR (pour retrouver les produits dans l'entrepôt).
   - Scan Zebra (douchette clavier + Entrée) → popup quantité → « Valider » (ou quantité inférieure).
   - Clôture → feu d'artifice + citation + mail récap à rr@pribon.org (action log-picking-recap).
   ========================================================================= */
const PICKING_COLOR = "#1565c0";      // bleu = PICKING  (vert #1a4d2e = DISPATCH)
const PICKING_BG    = "#e3f2fd";
const DISPATCH_COLOR = "#1a4d2e";
const PICKING_MAIL  = "rr@pribon.org"; // destinataire fixé côté Apps Script (info seulement)

  "La qualité n'est jamais un accident, c'est toujours le résultat d'un effort.",
  "Petit à petit, l'oiseau fait son nid.",

// Feu d'artifice + citation encourageante (dispatch ET picking).
function launchCelebration(title, sub){

    d.style.cssText = "position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:20px";

    d.innerHTML = `<div style="background:#fff;border-radius:18px;max-width:420px;width:100%;padding:26px 22px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.35)">
      <div style="font-size:46px;line-height:1">🎉</div>

      ${sub?`<div style="font-size:14px;color:#555;margin-bottom:14px">${esc(sub)}</div>`:""}
      <div style="font-size:16px;font-style:italic;color:#333;background:#f6f8fb;border-radius:12px;padding:14px 12px;margin:8px 0 16px">« ${esc(q)} »</div>
      <button style="width:100%;padding:14px;border-radius:12px;background:#1a4d2e;color:#fff;font-weight:800;font-size:16px;border:none">Merci 👍</button></div>`;
