<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;

  /* Header */

  /* Login / screens */
  .screen-center { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .logo { font-size: 26px; font-weight: 800; color: #1a4d2e; margin-bottom: 6px; letter-spacing: -.5px; text-align:center; }
  .tag { color: #666; font-size: 14px; margin-bottom: 28px; text-align:center; }
  .card { width: 100%; max-width: 380px; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); padding: 24px; margin-bottom: 12px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #555; }
  .field input, .field select { width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid #ddd; border-radius: 8px; background: #fff; }
  .field input:focus, .field select:focus { outline: none; border-color: #1a4d2e; }
  .btn-primary { width: 100%; padding: 14px; font-size: 16px; font-weight: 700; background: #1a4d2e; color: #fff; border-radius: 8px; transition: background .15s; }
  .btn-primary:active { background: #0d3d20; }
  .btn-primary:disabled { background: #aaa; }
  .btn-secondary { width: 100%; padding: 12px; font-size: 14px; font-weight: 600; background: #f0f0f0; color: #333; border-radius: 8px; margin-top: 8px; }
  /* Upload */
  .upload-zone { border: 2px dashed #1a4d2e; border-radius: 12px; padding: 26px 16px; text-align: center; background: #f4f9f5; cursor: pointer; }
  .upload-zone:active { background: #e6f1ea; }
  .upload-zone .icon { font-size: 36px; margin-bottom: 6px; }
  .upload-zone .label { font-weight: 600; color: #1a4d2e; }
  .upload-zone .hint { font-size: 12px; color: #666; margin-top: 4px; }

  .upload-zone.bdc .label { color:#5e35b1; }
  /* Progress */
  .progress-bar { background: #e6e8ec; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: #4caf50; transition: width .3s ease; }

  /* Product list */
  .product-list { padding: 8px; padding-bottom: 100px; }
  .product-card { background: #fff; border: 1.5px solid #e6e8ec; border-radius: 10px; padding: 12px; margin-bottom: 8px; transition: all .2s; }

  .btn-edit { padding: 12px 14px; font-size: 14px; background: #f0f0f0; color: #555; border-radius: 8px; }

  .scan-results .product-card { padding: 16px; margin-bottom: 12px; }
  .scan-results .designation { font-size: 16px; }

  /* Bottom bar */
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e6e8ec; padding: 12px 16px; box-shadow: 0 -2px 8px rgba(0,0,0,.06); z-index: 10; }
  .bottom-bar .stats { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 8px; }
  .btn-finish { width: 100%; padding: 14px; font-size: 16px; font-weight: 700; background: #4caf50; color: #fff; border-radius: 8px; }

  .edit-cell label { font-size: 11px; font-weight: 700; color: #666; }

const pad2 = (n) => n.toString().padStart(2, "0");

const daysBetweenISO = (aIso, bIso) => { const a=new Date((aIso||todayKey())+"T00:00:00"), b=new Date((bIso||todayKey())+"T00:00:00"); if(isNaN(a)||isNaN(b)) return null; return Math.round((b-a)/86400000); };

const keyOfTs = (ts) => { const d=new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtDateKey = (k) => { if(!k) return ""; const [y,m,d]=k.split("-"); return new Date(+y,+m-1,+d).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); };
const stripAccents = (s) => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");

// Recherche tolérante : multi-mots, sans accents, pluriel souple.
// "yaourt nature" trouve "Yaourts nature bio".
const smartMatch = (haystack, query) => {
  const h = stripAccents((haystack||"").toLowerCase());
  const tokens = stripAccents((query||"").toLowerCase()).split(/[\s,]+/).filter(Boolean);
  if (!tokens.length) return true;
  return tokens.every(t => {
    if (h.includes(t)) return true;
    const sing = t.replace(/(aux|eaux|s|x)$/,"");
    return sing.length >= 3 && h.includes(sing);
  });
};
const isBarcode = (q) => /^\d{5,}$/.test((q||"").trim());

// Correspondance code-barres tolérante : ne garde que les chiffres (le champ
// "article" peut contenir espaces/tirets/points), gère les zéros de tête
// (EAN-13 vs code interne) et compare dans les deux sens.
const digitsOnly = (s) => (s||"").toString().replace(/\D/g,"");
const trimZeros = (s) => s.replace(/^0+/,"") || s;

// Extraction de l'EAN depuis un code scanné, y compris les QR/DataMatrix GS1.
// Un code GS1 commence par l'AI (01) suivi du GTIN sur 14 chiffres, PUIS d'autres
// données (n° de série AI 21, lot AI 10, DLC AI 17…) qu'il faut IGNORER.
//   (01)03463310025489 21xxxxxx  ->  EAN-13 3463310025489
// Un code-barres classique (EAN-13/8, UPC) est renvoyé tel quel.
function extractEan(raw){
  let s = digitsOnly(raw);
  if (s.startsWith("01")) {
    if (s.length >= 16) {           // GS1 : (01) + GTIN-14 (+ éventuel reste)
      let gtin = s.substr(2, 14);
      return (gtin.length === 14 && gtin[0] === "0") ? gtin.slice(1) : gtin; // GTIN-14 -> EAN-13
    }
    if (s.length === 15) return s.substr(2); // (01) + EAN-13 en clair (sans zéro de bourrage)
  }
  return s;
}
const barcodeMatch = (article, code) => {
  const a = digitsOnly(article), q = digitsOnly(code);
  if (!a || !q) return false;
  if (a === q) return true;
  if (a.includes(q)) return true;                     // le code scanné figure dans le champ article
  const az = trimZeros(a), qz = trimZeros(q);
  if (az === qz) return true;                         // tolérance zéros de tête
  if (az.includes(qz) && qz.length >= 8) return true; // code long contenu (EAN)
  if (qz.includes(az) && az.length >= 8) return true;
  return false;
};

/* =========================================================================
   LOGIN PAR CODE (validé côté serveur, comme l'app Réception)
   POST { action:"verify-code", code, storeCode:"CENTRALE" } -> { valid, name? }
   Repli tolérant : si le serveur ne répond pas / n'implémente pas l'action,
   on n'empêche pas l'entrepôt de travailler (le code sert d'identifiant).
   ========================================================================= */
// moduleKey = "dispatch" | "decoupe" -> le serveur vérifie la colonne correspondante
// du Sheet des codes ("DISPATCH PALETTE" / "DECOUPE FROMAGE").
const MODULE_COLUMN = { dispatch:"DISPATCH PALETTE", decoupe:"DECOUPE FROMAGE", vin:"DISPATCH PALETTE" };
// (Inventaire vin : accès réutilisé du dispatch — mêmes opérateurs entrepôt. Changer la colonne si un registre dédié est créé.)
async function verifyCentraleCode(code, moduleKey) {
  const clean = (code||"").toString().trim();
  if (!/^\d{3,8}$/.test(clean)) return { valid:false, reason:"format" };
  try {
    // MÊME mécanisme que les apps magasin (réception / kelbongoo) : on envoie storeCode =
    // le nom de la colonne du registre à vérifier. Ici la colonne = le module
    // ("DISPATCH PALETTE" / "DECOUPE FROMAGE"). Le serveur déjà déployé coche cette colonne.
    // (moduleColumn est envoyé en plus, au cas où le serveur utilise ce nom.)
    const col = MODULE_COLUMN[moduleKey] || "";
    const r = await fetch(CODE_VERIFY_URL, {
      method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({ action:"verify-code", code:clean, scope:"CENTRALE", storeCode:col, moduleColumn:col, module:moduleKey||"" })
    });
    const j = await r.json();
    if (j && typeof j.valid === "boolean") return { valid:j.valid, name:(j.name||j.prenom||"").trim(), reason:j.reason||"", server:true };
    // Réponse inattendue -> repli
    return { valid:true, name:"", server:false, degraded:true };
  } catch(e) {
    // Serveur injoignable / action absente -> repli local (ne bloque pas l'entrepôt)
    return { valid:true, name:"", server:false, degraded:true };
  }
}

// Bannière de messages envoyés par la console (nœud "broadcasts" du projet CENTRALE).
// Rendu hors-React (injection DOM) pour être visible sur tous les écrans.
let __lastBcast = {};
function renderBroadcastBanner(data){
  __lastBcast = data || {};
  const now = Date.now();
  let seen = []; try { seen = JSON.parse(localStorage.getItem("centrale_bcast_seen")||"[]"); } catch(e){}
  const mod = window.__centraleModule || null; // module courant (dispatch|decoupe|null)
  const list = Object.entries(__lastBcast).map(([id,b])=>({id,...b}))
    .filter(b => (!b.validUntil || b.validUntil>=now) && seen.indexOf(b.id)===-1)
    .filter(b => { const t=b.target||"all"; return t==="all" || !mod || t===mod; })
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let el = document.getElementById("centrale-bcast");
  if(!list.length){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="centrale-bcast"; el.className="bcast-wrap"; document.body.appendChild(el); }
  const esch = (s)=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  el.innerHTML = list.map(b=>`<div class="bcast"><span>📢 ${esch(b.message)}</span><button onclick="centraleDismissBcast('${b.id}')">✕ OK</button></div>`).join("");
}
window.centraleDismissBcast = function(id){
  try { const s=JSON.parse(localStorage.getItem("centrale_bcast_seen")||"[]"); if(s.indexOf(id)===-1){ s.push(id); localStorage.setItem("centrale_bcast_seen", JSON.stringify(s)); } } catch(e){}
  renderBroadcastBanner(__lastBcast);
};

/* =========================================================================
   EXCEL PARSING (fromage) — détecte désignation + colonnes ROB / KBG + poids
   ========================================================================= */
function parseFromageFile(workbook) {
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });
  const N = (s) => stripAccents((s||"").toString()).toLowerCase().trim();
  const isRob = (n) => /(rob|robespierre|montreuil|pribon)/.test(n);
  const isKbg = (n) => /(kbg|kelbongoo|pantin)/.test(n);
  const isPoids = (n) => /(poids|grammage|gramme|piece.*g|pds)/.test(n);
  const isDesig = (n) => n.includes("designation")||n==="produit"||n==="libelle"||n==="nom"||n==="fromage"||n==="description"||n==="article";
  const isCode = (n) => n==="code"||n==="ref"||n==="reference"||n==="ean"||n==="code article"||n.includes("gencod");
  // Recherche de la ligne d'en-têtes
  let hIdx = -1, headers = null;
  for (let i=0; i<Math.min(rows.length,25); i++) {
    const r = rows[i].map(N);
    if (r.some(isDesig) && (r.some(isRob)||r.some(isKbg))) { hIdx=i; headers=rows[i]; break; }
  }
  if (hIdx === -1) {
    for (let i=0; i<Math.min(rows.length,25); i++) {
      const r = rows[i].map(N);
      if (r.some(isDesig)) { hIdx=i; headers=rows[i]; break; }
    }
  }
  if (hIdx === -1) throw new Error("Impossible de trouver une ligne d'en-têtes (désignation / fromage).");
  let iDes=-1, iCode=-1, iRob=-1, iKbg=-1, iPds=-1;
  headers.forEach((h,idx) => {
    const n = N(h); if (!n) return;
    if (iDes<0 && isDesig(n) && n!=="article") iDes=idx;
    if (iCode<0 && (isCode(n)||n==="article")) iCode=idx;
    if (iRob<0 && isRob(n)) iRob=idx;
    if (iKbg<0 && isKbg(n)) iKbg=idx;
    if (iPds<0 && isPoids(n)) iPds=idx;
  });
  if (iDes<0 && iCode>=0) iDes=iCode;
  if (iDes<0) throw new Error("Colonne désignation introuvable.");
  const num = (v) => { const n=parseFloat(String(v).replace(",",".").replace(/[^\d.]/g,"")); return isNaN(n)?0:n; };
  const products = [];
  for (let i=hIdx+1; i<rows.length; i++) {
    const row = rows[i]; if (!row) continue;
    const designation = (row[iDes]||"").toString().trim();
    if (!designation) continue;
    const dl = stripAccents(designation.toLowerCase());
    if (dl==="total"||dl==="totaux"||dl.includes("montant")) continue;
    const robCmd = iRob>=0 ? num(row[iRob]) : 0;
    const kbgCmd = iKbg>=0 ? num(row[iKbg]) : 0;
    const poids  = iPds>=0 && num(row[iPds])>0 ? num(row[iPds]) : FROMAGE_DEFAULT_POIDS;
    if (robCmd===0 && kbgCmd===0 && iRob<0 && iKbg<0) { /* pas de commande détectée: on garde quand même */ }
    products.push({
      article: iCode>=0 ? (row[iCode]||"").toString().trim() : "",
      designation,
      robCmd,                    // commande Robespierre (pièces ou kg selon usage)
      kbgTarget: Math.round(kbgCmd), // nb de pièces précises pour Kelbongoo (0 si vide)
      poids,                     // poids cible d'une pièce Kelbongoo (g)
      tol: FROMAGE_DEFAULT_TOL   // tolérance ± %
    });
  }
  if (!products.length) throw new Error("Aucune ligne fromage trouvée.");
  return { products, hasRob:iRob>=0, hasKbg:iKbg>=0, hasPoids:iPds>=0 };
}

/* =========================================================================
   EXCEL PARSING (dispatch)  — inchangé + détection colisage
   ========================================================================= */
const normCol = (s) => stripAccents((s||"").toString()).toLowerCase().trim();
const G5_STORE_MAP = {
  "01":"rob","03":"tol","98":"pdp","05":"bic","02":"bar","04":"bor",
  "06":"ces","07":"cha","09":"for","10":"lil","11":"nca","12":"ncc",
  "13":"pad","14":"pdc","17":"rom","18":"stb"
};
const NON_STORE_KEYWORDS = new Set([
  "article","code article","code","ref","reference","ean","barcode","sku",
  "designation","libelle","nom","produit","description",
  "quantite","qte","qty","uvc","uc","cde","cde en uvc","commande en uvc",
  "commande","cmd","cdt","pcb","colisage","conditionnement",
  "recue","receptionnee","recu","reception",
  "quantite receptionnee","quantites receptionnees","quantite cmd frs","quantite cmd",
  "prix","tarif","poids","poids kg","kg","tva","pu","pu ht","pu ttc","ht","ttc","puht","putc",
  "total","totale","totaux","totalite","montant","montant ht","montant tva","montant ttc",
  "remise","taux","marge","coef","coeff",
  "lot","dlc","ddm","fournisseur","frs","four","famille",""
]);
const parseG5Cell = (v) => {
  if (v===""||v===null||v===undefined) return 0;
  const s = v.toString().trim();
  const lastSep = s.lastIndexOf("|||");
  let numStr = lastSep>=0 ? s.substring(lastSep+3).trim() : s;
  const um = numStr.match(/^(\d+)\s*u/);
  if (um) return parseInt(um[1],10);
  const n = parseFloat(numStr);
  return isNaN(n) ? 0 : Math.round(n);
};

function parseExcelFile(workbook) {
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  const isSigle = (s) => /^[a-z0-9]{2,6}$/.test(s) && !NON_STORE_KEYWORDS.has(s);
  const detectStoreColumn = (cellRaw, cellNorm) => {
    if (!cellNorm) return null;
    if (NON_STORE_KEYWORDS.has(cellNorm)) return null;
    if (cellNorm.startsWith("magasin")) {
      const code = cellNorm.replace(/^magasin\s*/,"").trim();
      const mapped = G5_STORE_MAP[code];
      if (mapped) { const uc = mapped.toUpperCase(); return { code:uc, label:uc, needsNaming:false }; }
      return { code:`MAGASIN_${code}`, label:`Magasin ${code}`, needsNaming:true, originalHeader:cellRaw };
    }
    if (isSigle(cellNorm)) { const uc = cellNorm.toUpperCase(); return { code:uc, label:uc, needsNaming:false }; }
    const tokens = cellNorm.split(/[\s\-_()\/]+/).filter(Boolean);
    for (const t of tokens) { if (isSigle(t)) { const uc = t.toUpperCase(); return { code:uc, label:uc, needsNaming:false }; } }
    return null;
  };
  let headerIdx = -1, headers = null;
  for (let i=0; i<Math.min(rows.length,20); i++) {
    const row = rows[i].map(c=>normCol(c));
    const hasDesig = row.some(c => c.includes("designation")||c==="produit"||c==="libelle"||c==="libellé"||c==="nom"||c==="article"||c==="description"||c.includes("designation produit"));
    if (hasDesig) { headerIdx = i; headers = rows[i]; break; }
  }
  if (headerIdx === -1) {
    for (let i=0; i<Math.min(rows.length,20); i++) {
      const row = rows[i].map(c=>normCol(c));
      const hasQty = row.some(c => c==="quantite"||c==="qte"||c==="qty"||c==="uvc"||c==="cde en uvc"||c==="cde"||c.includes("commande")||detectStoreColumn(null,c)!==null);
      const hasTextHeader = row.some(c => c.length>0 && c.length<50 && !/^\d+([.,]\d+)?$/.test(c));
      if (hasQty && hasTextHeader) { headerIdx = i; headers = rows[i]; break; }
    }
  }
  if (headerIdx === -1) throw new Error("Impossible de trouver une ligne d'en-têtes (produit/désignation/article/quantité/commande).");

  const colMap = {};
  let isG5Format = false;
  const articleAsCode = [];
  const storeColumns = [];
  headers.forEach((h, idx) => {
    const n = normCol(h);
    if (!n) return;
    if (n.includes("designation")||n==="produit"||n==="libelle"||n==="libellé"||n==="nom"||n==="description") {
      if (colMap.designation === undefined) colMap.designation = idx;
    }
    else if (n === "article") { articleAsCode.push(idx); }
    else if (n==="code article"||n==="code"||n==="ref"||n==="reference"||n==="référence"||n==="ean"||n==="ean13"||n==="gencod"||n==="gencode"||n==="code barre"||n==="code barres"||n==="barcode") {
      if (colMap.article === undefined) colMap.article = idx;
    }
    // Colisage / conditionnement (unités par carton)
    else if (n==="colisage"||n==="conditionnement"||n==="cond"||n==="pcb"||n==="cdt"||n.includes("colisage")||n.includes("conditionnement")||n.includes("par colis")||n.includes("nb colis")) {
      if (colMap.colisage === undefined) colMap.colisage = idx;
    }
    else if (detectStoreColumn(null,n)===null && (n.includes("cmd")||n==="commande"||(n.includes("commande") && !detectStoreColumn(null,n)))) {
      if (colMap.cmd === undefined) colMap.cmd = idx;
    }
    else if (n.includes("recept")||n.includes("recu")||n==="reçu") {
      if (colMap.recue === undefined) colMap.recue = idx;
    }
    else {
      const def = detectStoreColumn(h, n);
      if (def) { storeColumns.push({ idx, def }); if (n.startsWith("magasin")) isG5Format = true; }
    }
  });

  if (colMap.designation === undefined && articleAsCode.length > 0) {
    const articleIdx = articleAsCode[0];
    let textCount=0, numericCount=0;
    for (let i=headerIdx+1; i<Math.min(headerIdx+6,rows.length); i++) {
      const v = (rows[i]&&rows[i][articleIdx]) ? String(rows[i][articleIdx]).trim() : "";
      if (!v) continue;
      if (/^\d{6,}$/.test(v)) numericCount++;
      else if (v.length>5 && /[a-zA-Z]/.test(v)) textCount++;
    }
    if (textCount>numericCount) colMap.designation = articleIdx;
    else if (colMap.article === undefined) colMap.article = articleIdx;
  }
  if (colMap.designation === undefined) {
    const usedCols = new Set([colMap.article,colMap.cmd,colMap.recue,colMap.colisage,...storeColumns.map(s=>s.idx)].filter(x=>x!==undefined));
    let bestIdx=-1, bestAvgLen=0;
    for (let c=0; c<headers.length; c++) {
      if (usedCols.has(c)) continue;
      let totalLen=0, count=0;
      for (let i=headerIdx+1; i<Math.min(headerIdx+11,rows.length); i++) {
        const v = (rows[i]&&rows[i][c]) ? String(rows[i][c]).trim() : "";
        if (!v) continue;
        if (/^[\d\s.,]+$/.test(v)) continue;
        totalLen+=v.length; count++;
      }
      const avg = count>0 ? totalLen/count : 0;
      if (avg>bestAvgLen && avg>8) { bestAvgLen=avg; bestIdx=c; }
    }
    if (bestIdx!==-1) colMap.designation = bestIdx;
  }
  if (storeColumns.length === 0) {
    let quantityColIdx = -1;
    headers.forEach((h, idx) => {
      const n = normCol(h);
      if (!n) return;
      if (idx===colMap.article||idx===colMap.designation||idx===colMap.cmd||idx===colMap.recue||idx===colMap.colisage) return;
      if (quantityColIdx===-1 && (
        n==="quantite"||n==="qte"||n==="qty"||n==="commande en uvc"||n==="uvc"||n==="uc"||n==="cde en uvc"||n==="cde"||
        n.includes("cde en uvc")||n.includes("commande en uvc")||(n.includes("quantite")&&!n.includes("recept"))||
        (n.includes("commande")&&!detectStoreColumn(null,n))||(n.startsWith("cde")&&!detectStoreColumn(null,n))
      )) quantityColIdx = idx;
    });
    if (quantityColIdx!==-1) {
      storeColumns.push({ idx:quantityColIdx, def:{ code:`COL_${quantityColIdx}`, label:String(headers[quantityColIdx]||"Colonne quantité").trim(), needsNaming:true, originalHeader:headers[quantityColIdx] } });
    } else if (colMap.cmd!==undefined) {
      storeColumns.push({ idx:colMap.cmd, def:{ code:`COL_${colMap.cmd}`, label:String(headers[colMap.cmd]||"Commande").trim(), needsNaming:true, originalHeader:headers[colMap.cmd] } });
      colMap.cmd = undefined;
    }
  }
  if (colMap.designation === undefined) throw new Error("Impossible de trouver une colonne désignation/produit.");
  if (storeColumns.length === 0) throw new Error("Aucune colonne de quantité/magasin trouvée.");

  const products = [];
  for (let i=headerIdx+1; i<rows.length; i++) {
    const row = rows[i];
    if (!row || row.every(c=>c===""||c===null||c===undefined)) continue;
    const designation = (row[colMap.designation]||"").toString().trim();
    if (!designation) continue;
    const desigLower = stripAccents(designation.toLowerCase());
    if (desigLower.includes("montant ht")||desigLower.includes("montant ttc")||desigLower.includes("montant tva")||desigLower==="total"||desigLower==="totaux") continue;
    const parse = isG5Format ? parseG5Cell : (v) => {
      if (v===""||v===null||v===undefined) return 0;
      const s = v.toString().trim();
      if (s.includes("|||")) return parseG5Cell(s);
      const m = s.match(/^(\d+)\s*u/);
      if (m) return parseInt(m[1],10);
      const cleaned = s.replace(",",".");
      const n = parseFloat(cleaned);
      return isNaN(n) ? 0 : Math.round(n);
    };
    const stores = {};
    let total = 0;
    for (const sc of storeColumns) { const q = parse(row[sc.idx]); stores[sc.def.code]=q; total+=q; }
    if (total===0) continue;
    let recue = colMap.recue!==undefined ? parse(row[colMap.recue]) : total;
    let cmd = colMap.cmd!==undefined ? parse(row[colMap.cmd]) : recue;
    const colisage = colMap.colisage!==undefined ? parseColisage(row[colMap.colisage]) : 0;
    const cond = colMap.colisage!==undefined ? String(row[colMap.colisage]||"").trim() : "";
    products.push({
      article: colMap.article!==undefined ? (row[colMap.article]||"").toString().trim() : "",
      designation, cmd, recue, stores, colisage, cond
    });
  }
  const storeTotals = {};
  storeColumns.forEach(sc => { storeTotals[sc.def.code]=0; });
  products.forEach(p => { storeColumns.forEach(sc => { storeTotals[sc.def.code]+=(p.stores[sc.def.code]||0); }); });
  const keptStoreCols = storeColumns.filter(sc => !(sc.def.needsNaming && storeTotals[sc.def.code]===0));
  const removedCodes = storeColumns.filter(sc => !keptStoreCols.some(k=>k.def.code===sc.def.code)).map(sc=>sc.def.code);
  if (removedCodes.length>0) products.forEach(p => { removedCodes.forEach(code=>{ delete p.stores[code]; }); });
  return { products, storeColumns: keptStoreCols.map(s=>s.def) };
}

/* =========================================================================
   BDC — parseur léger colisage (fichier optionnel, matché au dispatch)
   ========================================================================= */
function parseBdcColisage(workbook) {
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });
  let headerIdx=-1, headers=null;
  for (let i=0; i<Math.min(rows.length,25); i++) {
    const r = rows[i].map(c=>normCol(c));
    if (r.some(c => c.includes("colisage")||c.includes("conditionnement")||c==="pcb"||c==="cdt"||c.includes("par colis"))) { headerIdx=i; headers=rows[i]; break; }
  }
  if (headerIdx===-1) return { byArticle:{}, byName:{}, count:0 };
  let artIdx=-1, desIdx=-1, colIdx=-1;
  headers.forEach((h,idx) => {
    const n = normCol(h);
    if (colIdx===-1 && (n.includes("colisage")||n.includes("conditionnement")||n==="pcb"||n==="cdt"||n.includes("par colis"))) colIdx=idx;
    if (artIdx===-1 && (n==="code article"||n==="article"||n==="code"||n==="ean"||n==="ean13"||n==="ref"||n==="reference"||n.includes("gencod"))) artIdx=idx;
    if (desIdx===-1 && (n.includes("designation")||n==="produit"||n==="libelle"||n==="nom"||n==="description")) desIdx=idx;
  });
  const byArticle={}, byName={}; let count=0;
  for (let i=headerIdx+1; i<rows.length; i++) {
    const row = rows[i]; if (!row) continue;
    const col = colIdx>=0 ? parseColisage(row[colIdx]) : 0;
    if (!col || col<=1) continue;
    if (artIdx>=0) { const a=String(row[artIdx]||"").trim(); if (a){ byArticle[a]=col; count++; } }
    if (desIdx>=0) { const d=stripAccents(String(row[desIdx]||"").toLowerCase().trim()); if (d) byName[d]=col; }
  }
  return { byArticle, byName, count };
}
function applyColisage(products, map) {
  return products.map(p => {
    if (p.colisage && p.colisage>1) return p;
    let c = 0;
    if (p.article && map.byArticle[p.article]) c = map.byArticle[p.article];
    if (!c) { const d = stripAccents((p.designation||"").toLowerCase().trim()); if (map.byName[d]) c = map.byName[d]; }
    return c>1 ? { ...p, colisage:c } : p;
  });
}
// Idem, mais renvoie aussi un décompte (utile pour l'application rétroactive sur une session déjà envoyée).
function applyColisageWithCount(products, map) {
  let applied = 0, already = 0, missing = 0;
  const out = (products||[]).map(p => {
    if (p.colisage && p.colisage>1) { already++; return p; }
    let c = 0;
    if (p.article && map.byArticle[p.article]) c = map.byArticle[p.article];
    if (!c) { const d = stripAccents((p.designation||"").toLowerCase().trim()); if (map.byName[d]) c = map.byName[d]; }
    if (c>1) { applied++; return { ...p, colisage:c }; }
    missing++; return p;
  });
  return { products: out, applied, already, missing };
}

/* =========================================================================
   FIREBASE / SESSION SYNC
   ========================================================================= */
function useFirebaseSession(sessionId, operatorName) {
  const [state, setState] = useState({});
  const [meta, setMeta] = useState(null);
  const [connected, setConnected] = useState(false);
  useEffect(() => {
    if (!firebaseReady || !sessionId) return;
    const stateRef = db.ref(`dispatch/${sessionId}/state`);
    const metaRef = db.ref(`dispatch/${sessionId}/meta`);
    const connectedRef = db.ref(".info/connected");
    const onState = (snap) => setState(snap.val()||{});
    const onMeta = (snap) => setMeta(snap.val()||null);
    const onConn = (snap) => setConnected(!!snap.val());
    stateRef.on("value", onState); metaRef.on("value", onMeta); connectedRef.on("value", onConn);
    return () => { stateRef.off("value",onState); metaRef.off("value",onMeta); connectedRef.off("value",onConn); };
  }, [sessionId]);
  const updateLocal = useCallback((key, patch) => { setState(prev => ({ ...prev, [key]:{ ...(prev[key]||{}), ...patch } })); }, []);
  const lockRow = useCallback((key) => {
    const patch = { lockedBy:operatorName, lockedAt:Date.now() };
    if (firebaseReady && sessionId) db.ref(`dispatch/${sessionId}/state/${key}`).update(patch); else updateLocal(key,patch);
  }, [sessionId, operatorName, updateLocal]);
  const unlockRow = useCallback((key) => {
    const patch = { lockedBy:null, lockedAt:null };
    if (firebaseReady && sessionId) db.ref(`dispatch/${sessionId}/state/${key}`).update(patch); else updateLocal(key,patch);
  }, [sessionId, updateLocal]);
  const validateRow = useCallback((key, qtys) => {
    const patch = { done:true, doneBy:operatorName, doneAt:Date.now(), lockedBy:null, lockedAt:null, ...(qtys||{}) };
    if (firebaseReady && sessionId) db.ref(`dispatch/${sessionId}/state/${key}`).update(patch); else updateLocal(key,patch);
  }, [sessionId, operatorName, updateLocal]);
  const undoRow = useCallback((key) => {
    const patch = { done:false, doneBy:null, doneAt:null, ecarts:null };
    if (firebaseReady && sessionId) db.ref(`dispatch/${sessionId}/state/${key}`).update(patch); else updateLocal(key,patch);
  }, [sessionId, updateLocal]);
  return { state, meta, connected: firebaseReady?connected:true, lockRow, unlockRow, validateRow, undoRow };
}

// Abonnement global à toutes les sessions dispatch (accueil, palettes, admin).
function useAllSessions() {
  const [sessions, setSessions] = useState({});
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref("dispatch");
    const h = (snap) => setSessions(snap.val()||{});
    ref.on("value", h);
    return () => ref.off("value", h);
  }, []);
  return sessions;
}

/* =========================================================================
   PALETTES FICTIVES — agrégation par magasin
   ========================================================================= */
// Construit, pour le jour choisi, les items dispatchés par magasin.
function buildPaletteItems(allSessions, dateKey) {
  const byStore = {}; // code -> { label, items:[] }
  Object.entries(allSessions||{}).forEach(([sid, s]) => {
    if (!s || !s.meta) return;
    const supplier = s.meta.supplier || "?";
    const products = s.meta.products || [];
    const cols = s.meta.storeColumns || [];
    const labelOf = {};
    cols.forEach(c => { labelOf[c.code] = c.label; });
    products.forEach((p, idx) => {
      const pkey = productKey(p, idx);
      const st = (s.state && s.state[pkey]) || {};
      if (!st.done || !st.doneAt) return;
      if (keyOfTs(st.doneAt) !== dateKey) return;
      const codes = new Set([...Object.keys(p.stores||{}), ...Object.keys(st.qtyStores||{})]);
      codes.forEach(code => {
        const q = effQty(st, p, code);
        if (!q || q<=0) return;
        if (!byStore[code]) byStore[code] = { label: labelOf[code]||code, items:[] };
        if (!byStore[code].label || byStore[code].label===code) byStore[code].label = labelOf[code]||code;
        byStore[code].items.push({
          sid, supplier, article:p.article||"", designation:p.designation,
          qty:q, colisage:p.colisage||0, doneAt:st.doneAt, pkey
        });
      });
    });
  });
  Object.values(byStore).forEach(s => s.items.sort((a,b)=>a.doneAt-b.doneAt));
  return byStore;
}
// Découpe les items d'un magasin en palettes selon les bornes de clôture (closes).
function splitIntoPalettes(items, closes) {
  const sorted = [...(closes||[])].sort((a,b)=>a-b);
  const palettes = sorted.map((ts,i) => ({ n:i+1, sentAt:ts, sent:true, items:[] }));
  const open = { n: sorted.length+1, sentAt:null, sent:false, items:[] };
  items.forEach(it => {
    let placed = false;
    for (let i=0;i<sorted.length;i++){ if (it.doneAt <= sorted[i]) { palettes[i].items.push(it); placed=true; break; } }
    if (!placed) open.items.push(it);
  });
  return { palettes, open };
}
// Agrège les items d'une palette : par fournisseur + totaux colis / hors-colis.
function aggregatePalette(items) {
  const bySupplier = {};
  let totalArticles = 0, totalColis = 0, totalHors = 0;
  const refs = new Set();
  items.forEach(it => {
    if (!bySupplier[it.supplier]) bySupplier[it.supplier] = { qty:0, colis:0, hors:0, lines:[] };
    const { colis, hors } = cartonSplit(it.qty, it.colisage);
    bySupplier[it.supplier].qty += it.qty;
    bySupplier[it.supplier].colis += colis;
    bySupplier[it.supplier].hors += hors;
    bySupplier[it.supplier].lines.push({ ...it, colis, hors });
    totalArticles += it.qty; totalColis += colis; totalHors += hors;
    refs.add((it.article||it.designation)+"|"+it.supplier);
  });
  return { bySupplier, totalArticles, totalColis, totalHors, nbRefs: refs.size };
}

function usePalettesCloses(dateKey) {
  const [closes, setCloses] = useState({});
  useEffect(() => {

/* =========================================================================
   FIREBASE — SESSIONS DÉCOUPE FROMAGE  (nœud "decoupe")
   ========================================================================= */
// Clés de sauvegarde locale (résilience hors-ligne) : l'opérateur peut travailler sans internet,
// tout est gardé sur l'appareil et renvoyé à Firebase au retour de connexion (ou au clic « Sauvegarder »).
const decStKey = (sid)=>"dec_backup_"+sid;      // état par fromage (portions, poids, terminé…)
const decPKey  = (sid)=>"dec_pbackup_"+sid;     // liste des fromages (dont ajouts à la volée)
const decMetaKey  = (sid)=>"dec_meta_"+sid;     // en-tête local (entité, BL, date…) — créé sur le serveur au 1er fromage seulement
const decDirtyKey = (sid)=>"dec_dirty_"+sid;    // horodatage de la dernière saisie locale
const decSyncKey  = (sid)=>"dec_sync_"+sid;     // horodatage de la dernière saisie CONFIRMÉE par le serveur
function decLS(k, def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function decLSset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
// ---- Suivi « envoyé / à envoyer » (partagé par toute l'app) ----
const __decSyncListeners = new Set();
let __decOnline = false, __decLastSyncAt = 0;
function decSyncEmit(){ __decSyncListeners.forEach(f=>{ try{ f(); }catch(e){} }); }
function useDecSyncTick(){ const [,setT]=useState(0); useEffect(()=>{ const f=()=>setT(x=>x+1); __decSyncListeners.add(f); return ()=>{ __decSyncListeners.delete(f); }; },[]); }
function decMarkDirty(sid){ const ts=Date.now(); decLSset(decDirtyKey(sid), ts); decSyncEmit(); return ts; }
function decMarkSynced(sid, ts){ const cur=decLS(decSyncKey(sid),0); if(ts>cur) decLSset(decSyncKey(sid), ts); __decLastSyncAt=Date.now(); decSyncEmit(); }
function decIsPending(sid){ return decLS(decDirtyKey(sid),0) > decLS(decSyncKey(sid),0); }
// Déduit entité / BL / jour depuis l'identifiant (bl_rob_41488, jour_kbg_20260925…) — utile pour les anciennes sauvegardes.
function decSidInfo(sid){
  let m = /^bl_(rob|kbg)_(.+)$/i.exec(sid||""); if (m) return { entity:m[1].toUpperCase(), docNumber:m[2] };
  m = /^jour_(rob|kbg)_(\d{4})(\d{2})(\d{2})$/i.exec(sid||""); if (m) return { entity:m[1].toUpperCase(), docNumber:"", day:`${m[2]}-${m[3]}-${m[4]}` };
  m = /^decoupe_(rob|kbg)_(\d+)$/i.exec(sid||""); if (m) return { entity:m[1].toUpperCase(), docNumber:"" };
  return { entity:"", docNumber:"" };
}
function decLocalMeta(sid){
  const lm = decLS(decMetaKey(sid), null); if (lm) return lm;
  const inf = decSidInfo(sid); const ent = inf.entity||"ROB";
  return { supplier:(ent==="KBG"?"Découpe Kelbongoo":"Découpe Robespierre")+(inf.docNumber?(" · BL "+inf.docNumber):" · du jour"), entity:ent, docNumber:inf.docNumber||"",
           startedAt:(inf.day?new Date(inf.day+"T08:00:00").getTime():Date.now()), libre:true };
}
// Toutes les découpes connues sur CET appareil (sauvegardes locales).
function decLocalSids(){
  const out = new Set();
  try { for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i)||""; const m=/^dec_(?:backup|pbackup|meta|dirty)_(.+)$/.exec(k); if(m) out.add(m[1]); } } catch(e){}
  return [...out];
}
function decLocalHasData(sid){
  const st = decLS(decStKey(sid), {}); const ps = decLS(decPKey(sid), []);
  return (st && Object.keys(st).length>0) || (Array.isArray(ps) && ps.length>0);
}
function decPendingSids(){ return decLocalSids().filter(sid=>decIsPending(sid) && decLocalHasData(sid)); }
// Efface les traces locales d'une découpe (après suppression, ou découpe vide abandonnée).
function decClearLocal(sid){ [decStKey,decPKey,decMetaKey,decDirtyKey,decSyncKey].forEach(f=>{ try{ localStorage.removeItem(f(sid)); }catch(e){} }); decSyncEmit(); }
// Liste des fromages avec poids de portion résolu (même calcul que l'écran de découpe).
function decResolveList(products){
  return (products||[]).map((p,idx)=>{ const rp=kbgRefPoids(p.designation); return {...p, poids:(rp>0?rp:(p.poids||FROMAGE_DEFAULT_POIDS)), _pkey:frKey(p,idx)}; });
}
function decUnionProducts(a, b){ const seen=new Set(), out=[]; [...(a||[]), ...(b||[])].forEach(p=>{ if(!p) return; const k=frKey(p,0); if(!seen.has(k)){ seen.add(k); out.push(p); } }); return out; }
const decMetaFields = ["supplier","entity","docNumber","startedAt","createdBy","libre"];
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("délai dépassé")), ms))]); }
// ENVOI d'une découpe gardée sur l'appareil vers le serveur (fusion, sans rien écraser côté BL/console).
// Crée l'en-tête sur le serveur s'il manque (découpe commencée hors ligne), pousse l'état + la liste,
// recalcule le récap lu par la console, puis marque « envoyé ».
async function decFlushSession(sid, opts){
  if (!firebaseReady || !sid) return false;
  opts = opts||{};
  const dirtyAt = decLS(decDirtyKey(sid), 0) || Date.now();
  const st = decLS(decStKey(sid), {}) || {}; const ps = decLS(decPKey(sid), []) || [];
  const hasData = Object.keys(st).length>0 || ps.length>0;
  const m = (await withTimeout(db.ref(`decoupe/${sid}/meta`).once("value"), 15000)).val();
  if (!hasData){ decMarkSynced(sid, dirtyAt); return true; }
  if (opts.legacy && !(m && m.startedAt)) {
    // Ancienne sauvegarde sans suivi : on ne ressuscite pas une découpe supprimée, sauf si elle date d'aujourd'hui / hier.
    const inf = decSidInfo(sid); const recent = inf.day && (Date.now()-new Date(inf.day+"T00:00:00").getTime()) < 2*86400000;
    if (!recent){ decMarkSynced(sid, dirtyAt); return true; }
  }
  const lm = decLocalMeta(sid); const patch = {};
  decMetaFields.forEach(f=>{ if ((m==null || m[f]==null || m[f]==="") && lm[f]!=null && lm[f]!=="") patch[f]=lm[f]; });
  const writes = [];
  if (Object.keys(patch).length) writes.push(db.ref(`decoupe/${sid}/meta`).update(patch));
  Object.entries(st).forEach(([k,v])=>{ if (v && typeof v==="object") writes.push(db.ref(`decoupe/${sid}/state/${k}`).update(v)); });
  const merged = decUnionProducts((m&&m.products)||[], ps);
  if (merged.length && merged.length !== (((m&&m.products)||[]).length)) writes.push(db.ref(`decoupe/${sid}/meta/products`).set(merged));
  await withTimeout(Promise.all(writes), 20000);
  // Récap console recalculé avec l'état serveur fusionné.
  try {
    const s = (await withTimeout(db.ref(`decoupe/${sid}`).once("value"), 15000)).val() || {};
    const mm = s.meta||{};
    pushDecoupeRecap(sid, decResolveList(mm.products||merged), s.state||{}, { name:(s.recap&&s.recap.by)||mm.createdBy||"" }, mm.entity||lm.entity);
  } catch(e){}
  decMarkSynced(sid, dirtyAt);
  return true;
}
let __decFlushing = false;
async function decFlushAll(){
  if (!firebaseReady || __decFlushing) return;
  __decFlushing = true;
  try {
    for (const sid of decLocalSids()){
      const legacy = localStorage.getItem(decDirtyKey(sid))==null && localStorage.getItem(decSyncKey(sid))==null;
      if (!legacy && !decIsPending(sid)) continue;
      try { await decFlushSession(sid, { legacy }); } catch(e){ /* réessai au prochain passage */ }
    }
  } finally { __decFlushing = false; decSyncEmit(); }
}
function useDecoupeSession(sessionId, operator) {
  const stKey = decStKey(sessionId), pKey = decPKey(sessionId);
  const [state, setState] = useState(()=>decLS(stKey, {}) || {});
  const stateRef = useRef(state); useEffect(()=>{ stateRef.current = state; }, [state]);
  const [serverMeta, setServerMeta] = useState(null);
  const [metaLoaded, setMetaLoaded] = useState(false);
  const serverMetaRef = useRef(null);
  const [connected, setConnected] = useState(false);
  useDecSyncTick();
  const saveStateBackup = useCallback((st)=>{ decLSset(stKey, st||{}); }, [stKey]);
  // Envoie tout ce qui est gardé sur l'appareil (seulement s'il reste des saisies non confirmées).
  const flushNow = useCallback(async () => {
    if (!firebaseReady || !sessionId) return false;
    return decFlushSession(sessionId);
  }, [sessionId]);
  // Crée l'en-tête sur le serveur au 1er fromage (pas avant → plus de ligne « parasite » si on fait retour sans rien découper).
  const ensureMeta = useCallback(() => {
    if (!firebaseReady || !sessionId || !metaLoaded) return; // hors ligne : l'envoi automatique s'en charge au retour du réseau
    const m = serverMetaRef.current; const lm = decLocalMeta(sessionId); const patch = {};
    decMetaFields.forEach(f=>{ if ((m==null || m[f]==null || m[f]==="") && lm[f]!=null && lm[f]!=="") patch[f]=lm[f]; });
    if (Object.keys(patch).length) db.ref(`decoupe/${sessionId}/meta`).update(patch).catch(()=>{});
  }, [sessionId, metaLoaded]);
  // Changement de session : on repart de la sauvegarde locale de CETTE session.
  useEffect(() => { setState(decLS(stKey, {}) || {}); setServerMeta(null); serverMetaRef.current=null; setMetaLoaded(false); }, [stKey]);
  useEffect(() => {
    if (!firebaseReady || !sessionId) return;
    const sRef = db.ref(`decoupe/${sessionId}/state`);
    const metaRef = db.ref(`decoupe/${sessionId}/meta`);
    const connectedRef = db.ref(".info/connected");
    const onState = (snap)=>{ const v=snap.val()||{};
      // Saisies locales pas encore confirmées : elles restent prioritaires (le serveur n'efface JAMAIS ce qui n'est pas parti).
      if (decIsPending(sessionId)) {
        const local = decLS(stKey, {}) || {}; const merged = { ...v };
        Object.entries(local).forEach(([k,lv])=>{ merged[k] = { ...(v[k]||{}), ...(lv||{}) }; });
        setState(merged); saveStateBackup(merged);
      } else if (Object.keys(v).length) { setState(v); saveStateBackup(v); }
    };
    const onMeta = (snap)=>{ const m=snap.val(); serverMetaRef.current=m||null; setServerMeta(m||null); setMetaLoaded(true);
      if (m && Array.isArray(m.products)) decLSset(pKey, decUnionProducts(m.products, decLS(pKey, [])));
      // En-tête absent sur le serveur alors que des saisies attendent : on le (re)crée pour que la découpe soit visible partout.
      if ((!m || !m.startedAt) && decIsPending(sessionId)) {
        const lm = decLocalMeta(sessionId); const patch = {};
        decMetaFields.forEach(f=>{ if ((m==null || m[f]==null || m[f]==="") && lm[f]!=null && lm[f]!=="") patch[f]=lm[f]; });
        const lp = decLS(pKey, []); if ((!m || !Array.isArray(m.products) || !m.products.length) && lp.length) patch.products = lp;
        if (Object.keys(patch).length) db.ref(`decoupe/${sessionId}/meta`).update(patch).catch(()=>{});
      }
    };
    const onConn = (snap)=>{ const c=!!snap.val(); setConnected(c); if(c && decIsPending(sessionId)) decFlushSession(sessionId).catch(()=>{}); };
    sRef.on("value", onState); metaRef.on("value", onMeta); connectedRef.on("value", onConn);
    return () => { sRef.off("value",onState); metaRef.off("value",onMeta); connectedRef.off("value",onConn); };
  }, [sessionId]);
  const setRow = useCallback((key, patch) => {
    // Mise à jour optimiste + sauvegarde locale immédiate (marche hors ligne), puis serveur.
    // `at` / `firstAt` = date de découpe du fromage (sert à l'historique console par jour de découpe).
    const now = Date.now(); const prev = (stateRef.current||{})[key]||{};
    const p2 = { ...patch, at:now }; if (!prev.firstAt) p2.firstAt = now;
    const ts = decMarkDirty(sessionId);
    setState(prevS=>{ const next={ ...prevS, [key]:{ ...(prevS[key]||{}), ...p2 } }; saveStateBackup(next); stateRef.current=next; return next; });
    ensureMeta();
    if (firebaseReady && sessionId) db.ref(`decoupe/${sessionId}/state/${key}`).update(p2).then(()=>{ const sm=serverMetaRef.current; if (sm && sm.startedAt) decMarkSynced(sessionId, ts); }).catch(()=>{});
  }, [sessionId, saveStateBackup, ensureMeta]);
  // En-tête effectif : local (entité/BL choisis au démarrage) complété/écrasé par le serveur dès qu'il existe.
  const meta = useMemo(() => ({ ...decLocalMeta(sessionId), ...(serverMeta||{}) }), [serverMeta, sessionId]);
  const pending = decIsPending(sessionId) && decLocalHasData(sessionId);
  return { state, meta, serverMeta, metaLoaded, connected: firebaseReady?connected:true, setRow, flushNow, ensureMeta, pending,
           syncedAt: decLS(decSyncKey(sessionId), 0) };
}

// Bornes de tolérance Kelbongoo (grammes) pour un fromage.
const frBounds = (p) => {
  const w = p.poids||FROMAGE_DEFAULT_POIDS, t = (p.tol!=null?p.tol:FROMAGE_DEFAULT_TOL)/100;
  return { min: Math.round(w*(1-t)), max: Math.round(w*(1+t)) };
};
// Décide de l'entité d'une pièce selon son poids + le nb de pièces KBG déjà faites.
const frRoute = (product, weight, kbgDone) => {
  const { min, max } = frBounds(product);
  const need = (product.kbgTarget||0) > 0 ? (kbgDone < product.kbgTarget) : (product.kbgTarget===0 && (product.robCmd||0)===0 ? true : false);
  // Dans la tolérance ET Kelbongoo a encore besoin de pièces -> KBG, sinon Robespierre.
  if (weight>=min && weight<=max && (need || (product.kbgTarget||0)===0 && (product.robCmd||0)===0)) return "KBG";
  return "ROB";
};
// Agrège l'état d'un fromage (pièces déjà coupées).
function frAgg(status) {
  const pieces = (status && status.pieces) || [];
  let kbgN=0, kbgG=0, robN=0, robG=0;
  pieces.forEach(pc => { if (pc.dest==="KBG"){ kbgN++; kbgG+=pc.w; } else { robN++; robG+=pc.w; } });
  return { kbgN, kbgG, robN, robG, total:pieces.length };
}

/* =========================================================================
   ENLÈVEMENT RUNGIS (v5.11) — remplace les « palettes fictives »
   Le préparateur coche les palettes (DISPATCH / PICKING) par lieu, indique le nombre,
   le frais ❄️ et les dollys fromage → mail à Rungis (Apps Script, action "request-enlevement").
   ========================================================================= */
const ENLEV_DISPATCH_BG = "#e8f5e9";
function collectEnlevement(allSessions, allPicking, dateKey, closes) {
  const lieux = {}; // code -> { code,label, dispatch:{sup:{name,qty}[],lines,total}|null, pickings:[] }
  const get = (code, label) => (lieux[code] = lieux[code] || { code, label: storeLong(code, label), dispatch:null, pickings:[] });
  const pd = buildPaletteItems(allSessions, dateKey);
  Object.entries(pd).forEach(([code, st]) => {
    const { open } = splitIntoPalettes(st.items, (closes[code]||{}).closes);
    if (!open.items.length) return;
    const bySup = {}; const lines = [];
    open.items.forEach(it => { bySup[it.supplier] = (bySup[it.supplier]||0) + it.qty; lines.push({ s:it.supplier, d:it.designation, q:it.qty }); });
    get(code, st.label).dispatch = { sup:Object.entries(bySup).map(([name,qty])=>({name,qty})).sort((a,b)=>b.qty-a.qty), lines, total:open.items.reduce((a,i)=>a+i.qty,0) };
  });
  Object.entries(allPicking||{}).forEach(([sid, p]) => {
    if (!p || !p.meta || p.enlevement) return;
    // v5.12 : à tout moment — tous les pickings non enlevés (14 j max), clôturés ou avec des produits validés.
    if ((Date.now() - (p.meta.startedAt||0)) > 14*86400000) return;
    const stt = p.state || {}; const bySup = {}; const lines = []; let total = 0;
    const st0 = pickingStats(p);
    const status = p.closed ? (p.closed.partial ? "clôture partielle" : "clôturé") : (st0.done ? `en cours ${st0.done}/${st0.total} validés` : "");
    if (!p.closed && !st0.done) return;
    (p.meta.products||[]).forEach(x => {
      const s = stt[x.k]; if (!(s && s.done)) return; const q = Number(s.picked)||0;
      if (q<=0) return; const sn = x.supName||x.supCode||"?";
      bySup[sn] = (bySup[sn]||0)+q; total += q; lines.push({ s:sn, d:x.designation||"", q });
    });
    if (!total) return;
    get(p.meta.storeCode||"?", p.meta.storeLabel).pickings.push({ sid, status, orderNum:p.meta.orderNum||"", sup:Object.entries(bySup).map(([name,qty])=>({name,qty})).sort((a,b)=>b.qty-a.qty), lines, total });
  });
  return Object.values(lieux).sort((a,b)=>a.label.localeCompare(b.label));
}

function compressPhoto(file, maxSide, q) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("lecture photo"));
    fr.onload = () => { const img = new Image(); img.onerror = () => reject(new Error("image illisible"));
      img.onload = () => { const m = maxSide||1000; let w = img.width, h = img.height; const r = Math.min(1, m/Math.max(w,h)); w = Math.round(w*r); h = Math.round(h*r);
        const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h); resolve(c.toDataURL("image/jpeg", q||0.7)); };
      img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

async function ownerKeyOf(code) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("pdp-enl|"+String(code||"")));
    return Array.from(new Uint8Array(b)).slice(0,12).map(x=>x.toString(16).padStart(2,"0")).join(""); } catch(e) { return ""; }
}
function useOwnerKey(me) {
  const [k, setK] = useState("");
  const code = me && me.code;
  useEffect(() => { let alive = true; if (code) ownerKeyOf(code).then(v => { if (alive) setK(v); }); return () => { alive = false; }; }, [code]);
  return k;
}

  const closes = usePalettesCloses(dateKey);
  const base = useMemo(() => collectEnlevement(allSessions, allPicking, dateKey, closes), [allSessions, allPicking, dateKey, closes]);
  const [mode, setMode] = useState(() => { try { return localStorage.getItem("enl_mode")==="P" ? "P" : "D"; } catch(e) { return "D"; } });
  const setModeKeep = (m) => { setMode(m); try { localStorage.setItem("enl_mode", m); } catch(e){} };
  // sel[clé] = { on, n, frais, merge, cond } ; cond (dispatch) = "pal" | "dolly" | "kbg"
  const [sel, setSel] = useState({});
  const [dolly, setDolly] = useState({});      // dolly FROMAGE par lieu (onglet dispatch)
  const [extra, setExtra] = useState([]);
  const [moves, setMoves] = useState({});
  const [photos, setPhotos] = useState({});    // photo par ligne (picking, facultatif)
  const [genPhoto, setGenPhoto] = useState(""); // photo GÉNÉRALE du dispatch
  const [sending, setSending] = useState(false);
  const opBy = safeName(operator && operator.name);
  const myKey = useOwnerKey(operator);
  const reqs = useEnlevementsEnCours(allPicking);
  const legacyReqs = reqs.filter(isLegacyEnl);
  const wantType = mode==="D" ? "DISPATCH" : "PICKING";
  const reqByCode = useMemo(() => { const m = {}; reqs.filter(r=>!isLegacyEnl(r)).forEach(r => (enlItems(r)||[]).forEach((it,i) => { if (it.type!==wantType) return; (m[it.code] = m[it.code] || []).push({ r, it, i }); })); return m; }, [reqs, wantType]);
  const DEF = { on:false, n:1, frais:false, merge:"", cond:"pal" };
  const g = (k) => ({ ...DEF, ...(sel[k]||{}) });
  const upd = (k, patch) => setSel(s => ({ ...s, [k]: { ...DEF, ...(s[k]||{}), ...patch } }));

  const allRows = useMemo(() => {
    const r = [];
    base.forEach(L => {
      if (L.dispatch) r.push({ k:"D:"+L.code, kind:"D", origin:L.code, sups:L.dispatch.sup, lines:L.dispatch.lines, total:L.dispatch.total });
      L.pickings.forEach(pk => r.push({ k:"P:"+pk.sid, kind:"P", origin:L.code, sid:pk.sid, ref:pk.orderNum, status:pk.status, sups:pk.sup, lines:pk.lines, total:pk.total }));
    });
    return r;
  }, [base]);
  const rows = allRows.filter(r => r.kind===mode);
  const nD = allRows.filter(r=>r.kind==="D").length, nP = allRows.filter(r=>r.kind==="P").length;
  const dest = (row) => moves[row.k] || row.origin;
  const lieux = useMemo(() => {
    const codes = [];
    rows.forEach(r => { const c = dest(r); if (!codes.includes(c)) codes.push(c); });
    Object.keys(reqByCode).forEach(c => { if (!codes.includes(c)) codes.push(c); });
    if (mode==="D") extra.forEach(c => { if (!codes.includes(c)) codes.push(c); });
    return codes.map(c => ({ code:c, label:storeLong(c), rows:rows.filter(r=>dest(r)===c) })).sort((a,b)=>a.label.localeCompare(b.label));
  }, [allRows, moves, extra, reqByCode, mode]);
  // palettes réelles d'une ligne (0 si fusionnée, dolly ou via Kelbongoo)
  const palOf = (r, L) => { const s=g(r.k); if (!s.on) return 0; if (r.kind==="D" && s.cond!=="pal") return 0;
    if (s.merge && L.rows.some(o=>o.k===s.merge && g(o.k).on && !g(o.k).merge)) return 0; return s.n; };
  const dolOf = (r) => { const s=g(r.k); return (s.on && r.kind==="D" && s.cond==="dolly") ? s.n : 0; };
  const label = (r) => r.kind==="D" ? "Dispatch du jour" : `Commande ${r.ref||"—"}`;

  const stepper = (val, set, min, col) => (
    <span style={{display:"inline-flex", alignItems:"center", gap:6}}>
      <button type="button" onClick={e=>{e.stopPropagation(); set(Math.max(min, val-1));}} style={{width:44,height:44,borderRadius:12,border:"2px solid "+(col||"#999"),background:"#fff",fontSize:26,fontWeight:900,color:col||"#333"}}>−</button>
      <b style={{minWidth:34, textAlign:"center", fontSize:30, color:col||"#111"}}>{val}</b>
      <button type="button" onClick={e=>{e.stopPropagation(); set(val+1);}} style={{width:44,height:44,borderRadius:12,border:"2px solid "+(col||"#999"),background:col||"#fff",fontSize:26,fontWeight:900,color:"#fff"}}>+</button>
    </span>
  );
  const photoInput = (id, onData) => (
    <input id={id} type="file" accept="image/*" capture="environment" style={{display:"none"}}
      onChange={async e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
        try { onData(await compressPhoto(f, 1000, 0.7)); } catch(err) { alert("Photo : "+err.message); } }} />);
  const photoBtnRow = (r) => { const ph = photos[r.k]; const id = "ph_"+r.k.replace(/[^\w]/g,"_");
    return (<span style={{display:"inline-flex", alignItems:"center", gap:8}}>{photoInput(id, d=>setPhotos(p=>({ ...p, [r.k]:d })))}
      {ph && <img src={ph} alt="" onClick={()=>document.getElementById(id).click()} style={{width:50, height:50, objectFit:"cover", borderRadius:8, border:"3px solid #2e7d32"}} />}
      <button type="button" onClick={()=>document.getElementById(id).click()} style={{padding:"10px 12px", borderRadius:10, fontWeight:800, fontSize:13, border:"2px solid "+(ph?"#2e7d32":"#999"), background:ph?"#e8f5e9":"#fff", color:ph?"#2e7d32":"#555"}}>📷 {ph?"Reprendre":"Photo (facultatif)"}</button></span>);
  };
  const condBtn = (r, val, txt, col) => { const s=g(r.k); const on = s.cond===val;
    return <button type="button" onClick={()=>upd(r.k,{cond:val, n:(val===s.cond?s.n:1)})} style={{flex:1, minWidth:90, padding:"12px 6px", borderRadius:12, fontWeight:900, fontSize:14, border:"3px solid "+col, background:on?col:"#fff", color:on?"#fff":col}}>{txt}</button>; };

  const rowView = (r, L, siteCol) => {
    const s = g(r.k); const col = r.kind==="D" ? DISPATCH_COLOR : PICKING_COLOR; const bg = r.kind==="D" ? ENLEV_DISPATCH_BG : PICKING_BG;
    const moved = dest(r) !== r.origin;
    const mergeTargets = L.rows.filter(o => o.k!==r.k && g(o.k).on && !g(o.k).merge && o.kind==="P");
    const merged = r.kind==="P" && s.on && s.merge && mergeTargets.some(o=>o.k===s.merge);
    const tgt = merged ? L.rows.find(o=>o.k===s.merge) : null;
    return (
      <div key={r.k} style={{border:"3px solid "+(s.on?col:"#ccc"), background:s.on?bg:"#fff", borderRadius:14, marginTop:10, borderLeft:"10px solid "+col, overflow:"hidden"}}>
        <div onClick={()=>upd(r.k,{on:!s.on})} style={{display:"flex", alignItems:"center", gap:10, padding:"10px 12px", cursor:"pointer", background:s.on?col:"#f3f3f3", color:s.on?"#fff":col}}>
          <span style={{fontSize:26, lineHeight:1}}>{s.on?"☑":"☐"}</span>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontWeight:900, fontSize:16}}>{r.kind==="D"?"🚚 DISPATCH":"🛒 PICKING"} · {label(r)}</div>
            <div style={{fontSize:12, fontWeight:700, opacity:.9}}>{r.total} unités{r.status?` · ${r.status}`:""}</div>
          </div>
          {!s.on && <span style={{fontSize:12, fontWeight:900}}>Toucher pour ajouter</span>}
        </div>
        <div style={{padding:"4px 12px 8px"}}><SupList sups={r.sups} color={col} /></div>
        {s.on && <div style={{padding:"10px 12px", borderTop:"2px dashed "+col+"55", background:"#fff"}}>
          {r.kind==="D" && <>
            <div style={{fontSize:13, fontWeight:900, color:col, textTransform:"uppercase", marginBottom:6}}>Comment ça part ?</div>
            <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
              {condBtn(r, "pal", "🟫 Palette", DISPATCH_COLOR)}{condBtn(r, "dolly", "🛞 Dolly", "#6d4c41")}{condBtn(r, "kbg", "📦 Via Kelbongoo", "#7b1fa2")}
            </div>
            {s.cond==="kbg"
              ? <div style={{marginTop:8, padding:"8px 10px", borderRadius:10, background:"#f3e5f5", color:"#4a148c", fontWeight:800, fontSize:13}}>📦 Part avec la tournée Kelbongoo — <b>pas compté</b> dans l'enlèvement Rungis.</div>
              : <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, marginTop:10, flexWrap:"wrap"}}>
                  <div style={{fontSize:13, fontWeight:900, color:col, textTransform:"uppercase"}}>{s.cond==="dolly" ? "Nombre de dollys" : "Nombre de palettes"}</div>
                  {stepper(s.n, v=>upd(r.k,{n:v}), 1, s.cond==="dolly" ? "#6d4c41" : col)}
                </div>}
          </>}
          {r.kind==="P" && (merged
            ? <div style={{display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:12, background:"#fff8e1", border:"2px solid #f9a825", fontWeight:900, color:"#8d6e00", fontSize:15}}>
                🔗 Sur la MÊME palette que « {label(tgt)} » <button onClick={()=>upd(r.k,{merge:""})} style={{marginLeft:"auto", padding:"6px 10px", borderRadius:8, background:"#fff", border:"1.5px solid #8d6e00", color:"#8d6e00", fontWeight:800}}>Séparer</button></div>
            : <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, flexWrap:"wrap"}}>
                <div><div style={{fontSize:13, fontWeight:900, color:col, textTransform:"uppercase"}}>Nombre de palettes</div>
                  <div style={{fontSize:11, color:"#777"}}>1 par défaut — + si ça ne tient pas sur une palette</div></div>
                {stepper(s.n, v=>upd(r.k,{n:v}), 1, col)}
              </div>)}
          {!(r.kind==="D" && s.cond==="kbg") && <div style={{display:"flex", gap:8, marginTop:10, flexWrap:"wrap", alignItems:"center"}}>
            {r.kind==="P" && !merged && photoBtnRow(r)}
            <button type="button" onClick={()=>upd(r.k,{frais:!s.frais})} style={{padding:"10px 12px", borderRadius:10, fontWeight:900, fontSize:14, border:"2px solid "+(s.frais?"#0277bd":"#bbb"), background:s.frais?"#0277bd":"#fff", color:s.frais?"#fff":"#666"}}>❄️ {s.frais?"Contient du FRAIS":"Frais ?"}</button>
            {r.kind==="P" && !merged && mergeTargets.length>0 && (
              <select value="" onChange={e=>{ if(e.target.value) upd(r.k,{merge:e.target.value}); }} style={{padding:"9px 8px", borderRadius:10, border:"2px solid #f9a825", fontWeight:800, color:"#8d6e00", background:"#fffdf3"}}>
                <option value="">🔗 Fusionner sur une autre palette…</option>
                {mergeTargets.map(o => <option key={o.k} value={o.k}>🛒 {label(o)}</option>)}
              </select>)}
          </div>}
          <div style={{display:"flex", alignItems:"center", gap:8, marginTop:10, flexWrap:"wrap"}}>
            <span style={{fontSize:13, fontWeight:900, color:"#555"}}>📍 Lieu :</span>
            <select value={dest(r)} onChange={e=>{ const v=e.target.value; setMoves(m=>{ const n={...m}; if (v===r.origin) delete n[r.k]; else n[r.k]=v; return n; }); upd(r.k,{merge:""}); }}
              style={{padding:"8px", borderRadius:10, border:"2px solid "+siteCol, fontWeight:900, color:siteCol, background:"#fff", fontSize:14}}>
              {Object.keys(STORE_LONG).map(c => <option key={c} value={c}>{c} · {STORE_LONG[c]}</option>)}
            </select>
            {moved && <span style={{fontSize:12, fontWeight:900, color:"#c62828", background:"#fdecea", borderRadius:6, padding:"3px 8px"}}>⚠️ déplacé de {r.origin} → {dest(r)}</span>}
          </div>
        </div>}
      </div>
    );
  };

  const built = lieux.map(L => {
    const palettes = [];
    L.rows.forEach(r => { const s=g(r.k); if (!s.on) return; const n=palOf(r,L); const dollies=dolOf(r); const kbg = r.kind==="D" && s.cond==="kbg";
      const tgt = (r.kind==="P" && n===0) ? L.rows.find(o=>o.k===s.merge) : null;
      palettes.push({ key:r.k, type:r.kind==="D"?"DISPATCH":"PICKING", ref:r.ref||"", n, dollies, kbg, cond:r.kind==="D"?s.cond:"pal", frais:!!s.frais && !kbg,
        mergedWith:tgt?("cde "+(tgt.ref||"")):"", sup:r.sups, lines:r.lines, total:r.total, origin:r.origin, sid:r.sid,
        photo:(r.kind==="P" && n>0) ? (photos[r.k]||"") : "" }); });
    return { code:L.code, label:L.label, color:siteColor(L.code), dolly:(mode==="D" ? (dolly[L.code]||0) : 0), palettes };
  }).filter(L => L.palettes.length || L.dolly>0);
  const sumL = (L) => ({ pal:L.palettes.reduce((a,p)=>a+p.n,0), dol:L.palettes.reduce((a,p)=>a+(p.dollies||0),0), kbg:L.palettes.filter(p=>p.kbg).length });
  const totPal = built.reduce((a,L)=>a+sumL(L).pal,0);
  const totDolD = built.reduce((a,L)=>a+sumL(L).dol,0);
  const totFro = built.reduce((a,L)=>a+L.dolly,0);
  const clean = (B) => B.map(L=>({ ...L, palettes:L.palettes.map(({sid,...p})=>p) }));
  const chipTxt = (L) => { const x=sumL(L); return [x.pal?x.pal+" pal.":"", x.dol?x.dol+" dolly":"", L.dolly?L.dolly+" 🧀":"", x.kbg?"📦 KBG":""].filter(Boolean).join(" + ") || "—"; };

  const send = async () => {
    if (!built.length) return;
    if (mode==="D" && !genPhoto && built.some(L=>L.palettes.some(p=>!p.kbg)) && !confirm("📷 Pas de photo générale du dispatch.\n\nOK = enregistrer quand même · Annuler = prendre la photo")) return;
    const recap = built.map(L => `📍 ${L.code} : ${chipTxt(L)}\n`+L.palettes.map(p=>`   • ${p.type==="DISPATCH"?"Dispatch":"Picking cde "+p.ref} → ${p.kbg?"via Kelbongoo (pas compté)":p.dollies?p.dollies+" dolly(s)":p.n?p.n+" pal.":"fusionné ("+p.mergedWith+")"}${p.frais?" ❄️":""}${p.origin!==L.code?" (déplacé de "+p.origin+")":""}`).join("\n")).join("\n");
    if (!confirm(`Enregistrer la demande d'enlèvement ${mode==="D"?"DISPATCH":"PICKING"} ?\n\n${recap}\n\nTOTAL : ${totPal} palette(s)${totDolD?` + ${totDolD} dolly(s)`:""}${totFro?` + ${totFro} dolly(s) fromage`:""}\n📨 Mail automatique à Rungis à 23h59.`)) return;
    setSending(true);
    const id = "enl_" + Date.now();
    const payload = { action:"request-enlevement", id, mode, by:opBy, byKey:myKey, date:dateKey, at:Date.now(), brand:BRAND, photoGeneral:(mode==="D"?genPhoto:""), lieux:clean(built) };
    const items = []; built.forEach(L => L.palettes.forEach(p => items.push({ key:p.key, code:L.code, type:p.type, ref:p.ref||"", n:p.n, dollies:p.dollies||0, kbg:!!p.kbg, frais:!!p.frais,
      mergedWith:p.mergedWith||"", origin:p.origin, sid:p.sid||"", total:p.total||0, sups:(p.sup||[]).map(x=>({name:x.name, qty:x.qty})),
      hasPhoto:!!(p.photo || (p.type==="DISPATCH" && genPhoto)), lines:(p.lines||[]).slice(0,500) })));
    const dispClose = {}; const tsBase = Date.now(); let tsI = 0;
    built.forEach(L => L.palettes.forEach(p => { if (p.type==="DISPATCH" && dispClose[p.origin]==null) dispClose[p.origin] = tsBase + (tsI++); }));
    try {
      if (!firebaseReady) throw new Error("connexion indisponible — réessaie dans un instant");
      const up = {};
      up[`enlevements/${id}`] = { at:Date.now(), by:opBy, byKey:myKey, mode, date:dateKey, totPal, totDol:totDolD+totFro, totDolDispatch:totDolD, totFromage:totFro, status:"attente-23h59", items, dispClose,
        lieux:built.map(L=>({ code:L.code, dolly:L.dolly, pal:sumL(L).pal, dollies:sumL(L).dol })) };
      built.forEach(L => L.palettes.forEach(p => {
        if (p.sid) {
          up[`picking/${p.sid}/enlevement`] = { id, at:Date.now(), by:opBy, byKey:myKey };
          if (p.origin !== L.code) { up[`picking/${p.sid}/meta/storeCode`] = L.code; up[`picking/${p.sid}/meta/storeLabel`] = pkStoreLabel(L.code); up[`picking/${p.sid}/meta/storeFixedBy`] = opBy+" · "+new Date().toLocaleString("fr-FR"); }
        }
      }));
      Object.entries(dispClose).forEach(([c, ts]) => { up[`palettes/${dateKey}/${c}/closes`] = [ ...(((closes[c]||{}).closes)||[]), ts ]; });
      await db.ref().update(up);
      // Photos + copie serveur en arrière-plan (l'écran ne reste plus bloqué sur « Enregistrement… »).
      try { fetch((ENLEVEMENT_URL||CODE_VERIFY_URL), { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload) }).catch(()=>{}); } catch(_) {}
    } catch(e) { alert("Erreur d'enregistrement : "+e.message); setSending(false); return; }
    setSending(false); setSel({}); setDolly({}); setPhotos({}); setGenPhoto(""); setMoves({});
    launchCelebration("Demande enregistrée ! 🚛", `${totPal} palette(s)${totDolD?` · ${totDolD} dolly`:""}${totFro?` · ${totFro} 🧀`:""} · mail à Rungis à 23h59`);
  };
  const freeCodes = Object.keys(STORE_LONG).filter(c => !lieux.find(x=>x.code===c));
  const MC = mode==="D" ? DISPATCH_COLOR : PICKING_COLOR;
  const tab = (m, txt, n) => { const on = mode===m; const c = m==="D" ? DISPATCH_COLOR : PICKING_COLOR;
    return <button onClick={()=>setModeKeep(m)} style={{flex:1, padding:"14px 6px", fontSize:16, fontWeight:900, border:"3px solid "+c, borderRadius:12, background:on?c:"#fff", color:on?"#fff":c}}>{txt}{n?` (${n})`:""}</button>; };

  return (
    <div className="app">
      <div className="header" style={{background:"linear-gradient(135deg,#e65100,#ff9800)"}}><div className="header-row"><div>
        <h1>🚛 Demander un enlèvement</h1>
        <div className="sub">Rungis · {fmtDateKey(dateKey)} · mail automatique à 23h59 · {opBy}</div></div>
        <div className="header-actions"><button className="header-btn" onClick={onBack}>← Retour</button></div></div></div>
      <div style={{padding:12, paddingBottom:150}}>
        <div style={{display:"flex", gap:8, marginBottom:10}}>{tab("D","🚚 DISPATCH",nD)}{tab("P","🛒 PICKING",nP)}</div>
        {legacyReqs.map(r => <div key={r.id} style={{border:"2px dashed #000", background:FLUO, borderRadius:10, padding:"6px 10px", marginBottom:8, fontSize:13, fontWeight:700}}>🧹 Ancienne demande bloquée ({fmtDateKey(r.date||"")} {fmtTime(r.at)}) <button onClick={()=>libererAncienneDemande(r, allPicking)} style={{marginLeft:8, padding:"4px 10px", borderRadius:8, border:"2px solid #b71c1c", color:"#b71c1c", background:"#fff", fontWeight:900}}>Libérer</button></div>)}
        {mode==="D" && (
          <div style={{border:"3px solid "+(genPhoto?"#2e7d32":DISPATCH_COLOR), borderRadius:14, padding:"10px 12px", background:genPhoto?"#e8f5e9":"#fff", display:"flex", alignItems:"center", gap:10, flexWrap:"wrap"}}>
            {photoInput("ph_general", d=>setGenPhoto(d))}
            {genPhoto && <img src={genPhoto} alt="" onClick={()=>document.getElementById("ph_general").click()} style={{width:70, height:70, objectFit:"cover", borderRadius:10, border:"3px solid #2e7d32"}} />}
            <div style={{flex:1, minWidth:150}}><div style={{fontWeight:900, color:DISPATCH_COLOR}}>📷 Photo générale du dispatch</div><div style={{fontSize:12, color:"#666"}}>Une seule photo de la zone : Rungis sait où sont les palettes.</div></div>
            <button onClick={()=>document.getElementById("ph_general").click()} style={{padding:"12px 14px", borderRadius:12, fontWeight:900, background:genPhoto?"#fff":DISPATCH_COLOR, color:genPhoto?"#2e7d32":"#fff", border:"2px solid "+(genPhoto?"#2e7d32":DISPATCH_COLOR)}}>{genPhoto?"Reprendre":"📷 Prendre la photo"}</button>
          </div>)}
        {lieux.length===0 && <div className="pal-empty">{mode==="D" ? "Aucun dispatch du jour en attente d'enlèvement." : "Aucun picking en attente d'enlèvement."}</div>}
        {lieux.map(L => { const c = siteColor(L.code); const np = L.rows.reduce((a,r)=>a+palOf(r,L),0); const nd = L.rows.reduce((a,r)=>a+dolOf(r),0); const lk = (reqByCode[L.code]||[]);
          return (
          <div key={L.code} style={{position:"relative", marginTop:26, border:"3px solid "+c, borderLeft:"12px solid "+c, borderRadius:16, background:c+"14", padding:"22px 10px 12px"}}>
            <div style={{position:"absolute", top:-16, left:10, right:10, display:"flex", justifyContent:"space-between", gap:8}}>
              <span style={{background:c, color:"#fff", fontWeight:900, fontSize:17, padding:"4px 12px", borderRadius:8, boxShadow:"0 2px 6px rgba(0,0,0,.2)"}}>📍 {L.code} · {L.label}</span>
              <span style={{background:"#fff", color:c, border:"3px solid "+c, fontWeight:900, fontSize:15, padding:"2px 10px", borderRadius:8}}>{np} pal.{nd?` + ${nd} dolly`:""}{(dolly[L.code]||0)&&mode==="D"?` + ${dolly[L.code]} 🧀`:""}{lk.length?` · 🔒 ${lk.length} demandé(s)`:""}</span>
            </div>
            {lk.map(x => <LockedEnlRow key={x.r.id+"_"+x.i} r={x.r} it={x.it} idx={x.i} myKey={myKey} />)}
            {L.rows.map(r => rowView(r, L, c))}
            {mode==="D" && <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:10, padding:"8px 10px", background:"#f1f8e9", border:"2px dashed #689f38", borderRadius:12}}>
              <div style={{fontWeight:900, color:"#33691e"}}>🧀 Dolly fromage <span style={{fontWeight:500, fontSize:11}}>(cagettes vertes)</span></div>
              {stepper(dolly[L.code]||0, v=>setDolly(d=>({...d,[L.code]:v})), 0, "#33691e")}
            </div>}
          </div>); })}
        {mode==="D" && freeCodes.length>0 && (
          <select className="input" style={{marginTop:16, width:"100%", padding:12, fontSize:14}} value="" onChange={e=>{ if(e.target.value) setExtra(x=>[...x, e.target.value]); }}>
            <option value="">➕ Ajouter un lieu (dolly fromage seul)…</option>
            {freeCodes.map(c => <option key={c} value={c}>{c} · {STORE_LONG[c]}</option>)}
          </select>
        )}
      </div>

function AttenteEnlevement({ allSessions, allPicking, onOpenEnlevement }) {

  const lieux = useMemo(() => collectEnlevement(allSessions, allPicking, dateKey, closes), [allSessions, allPicking, dateKey, closes]);

  return (
    <div className="recap-card" style={{borderLeft:"6px solid #e65100", marginTop:12}}>

      {disp.length===0 && <div style={{fontSize:13, color:"#999", padding:"4px 0"}}>Rien en attente.</div>}
      {disp.map(L => box(siteColor(L.code), <>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", gap:8}}>{chip(L.code, L.label)}<b style={{color:DISPATCH_COLOR, fontSize:16}}>{L.dispatch.total} u.</b></div>

      <div style={{marginTop:14, fontWeight:900, color:PICKING_COLOR}}>🛒 PICKING ({picks.length})</div>
      {picks.length===0 && <div style={{fontSize:13, color:"#999", padding:"4px 0"}}>Rien en attente.</div>}

        {pk.status && <div style={{fontSize:12, fontWeight:800, color:/en cours/.test(pk.status)?"#e65100":"#2e7d32", marginTop:2}}>{/en cours/.test(pk.status)?"⏳ ":"✓ "}{pk.status}</div>}
        <SupList sups={pk.sup} color={PICKING_COLOR} max={4} /></>, "p"+pk.sid))}
    </div>
  );
}

function launchConfetti(){
  try{
    const c=document.createElement('canvas');
    c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99999';
    c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
    const ctx=c.getContext('2d'), cols=['#e53935','#1a4d2e','#ff9800','#4caf50','#2196f3','#ffd600','#e91e63'];
    const burst=(cx,cy)=>Array.from({length:80},()=>({x:cx,y:cy,vx:(Math.random()-.5)*12,vy:(Math.random()-1)*12-3,g:.28,col:cols[(Math.random()*cols.length)|0],s:4+Math.random()*4,life:70+Math.random()*40}));
    let P=burst(innerWidth*.5,innerHeight*.4);
    setTimeout(()=>P=P.concat(burst(innerWidth*.25,innerHeight*.45)),250);
    setTimeout(()=>P=P.concat(burst(innerWidth*.75,innerHeight*.45)),500);
    let t=0;(function f(){ t++; ctx.clearRect(0,0,c.width,c.height);
      P.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life--; ctx.globalAlpha=Math.max(0,p.life/90); ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,p.s,p.s); });
      P=P.filter(p=>p.life>0);
      if(t<180) requestAnimationFrame(f); else c.remove();
    })();
  }catch(e){}
}
function ProductCard({ product, pkey, status, operator, storeColumns, onLock, onUnlock, onValidate, onUndo, onEdit }) {

  const isDone = status.done;
  const isMine = status.lockedBy===operator && !lockExpired;
  const getQty = (code) => (status.qtyStores && status.qtyStores[code]!==undefined) ? status.qtyStores[code] : ((product.stores && product.stores[code])||0);

/* =========================================================================
   MODALE D'AJUSTEMENT + MOTIF D'ÉCART
   ========================================================================= */
function EditModal({ product, status, storeColumns, onSave, onClose, allowReceivedEdit }) {
  const getInitial = (code) => {
    if (status.qtyStores && status.qtyStores[code]!==undefined) return String(status.qtyStores[code]);
    return String((product.stores && product.stores[code])||0);
  };
  const [qties, setQties] = useState(() => { const init={}; storeColumns.forEach(s=>{ init[s.code]=getInitial(s.code); }); return init; });
  const [recue, setRecue] = useState(String(status.qtyRecue!==undefined ? status.qtyRecue : product.recue));
  const [reasons, setReasons] = useState({}); // code|CENTRALE -> {reason, text}

  const toNum = (s) => { if (s===""||s===null||s===undefined) return 0; const n=parseInt(s,10); return isNaN(n)?0:n; };
  const handleNumChange = (code) => (e) => { const v=e.target.value; if (v===""||/^\d+$/.test(v)) setQties(prev=>({...prev,[code]:v})); };
  const handleRecueChange = (e) => { const v=e.target.value; if (v===""||/^\d+$/.test(v)) setRecue(v); };

  const recueN = toNum(recue);
  let total = 0; const numQties = {};
  storeColumns.forEach(s => { const n=toNum(qties[s.code]); numQties[s.code]=n; total+=n; });
  const gap = total - recueN;

  // Écarts = magasins où on dispatch MOINS que prévu, + centrale si reçu réduit.
  const diffs = [];
  storeColumns.forEach(s => {
    const planned = (product.stores && product.stores[s.code])||0;
    if (numQties[s.code] < planned) diffs.push({ key:s.code, store:s.label, code:s.code, planned, real:numQties[s.code] });
  });
  if (allowReceivedEdit && recueN < product.recue) {
    diffs.push({ key:"CENTRALE", store:"CENTRALE (reçu)", code:"CENTRALE", planned:product.recue, real:recueN });
  }
  const needReasons = diffs.length > 0;
  const missing = diffs.some(d => {
    const r = reasons[d.key];
    if (!r || !r.reason) return true;
    if (r.reason==="AUTRE" && !(r.text||"").trim()) return true;
    return false;
  });

  const setReason = (key, patch) => setReasons(prev => ({ ...prev, [key]: { ...(prev[key]||{}), ...patch } }));

  const handleSave = () => {
    const ecarts = diffs.map(d => ({
      store: d.code, storeLabel: d.store, planned: d.planned, real: d.real, delta: d.real-d.planned,
      reason: (reasons[d.key]||{}).reason || "AUTRE",
      reasonText: ((reasons[d.key]||{}).text || "").trim(),
      fournisseur: reasonIsFournisseur((reasons[d.key]||{}).reason)
    }));
    onSave({ qtyStores:numQties, qtyRecue:recueN, ecarts: ecarts.length ? ecarts : null });
  };

  const nbStores = storeColumns.length;
  const gridCols = nbStores<=3 ? `repeat(${nbStores},1fr)` : "repeat(2,1fr)";

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Ajuster les quantités</h3>
        <div className="designation-modal">{product.designation}{product.colisage>1?` · colis de ${product.colisage}`:""}</div>

        {allowReceivedEdit && (
          <div style={{background:"#fff3e0", padding:10, borderRadius:8, marginBottom:12, border:"1px solid #ffcc80"}}>
            <div style={{fontSize:11, fontWeight:700, color:"#e65100", marginBottom:4}}>QUANTITÉ REÇUE (centrale)</div>
            <input type="text" inputMode="numeric" pattern="[0-9]*" value={recue} onChange={handleRecueChange} onFocus={e=>e.target.select()} style={{width:"100%", padding:10, fontSize:22, fontWeight:700, textAlign:"center", border:"1.5px solid #ff9800", borderRadius:6}} />
            <div style={{fontSize:10, color:"#666", marginTop:4, textAlign:"center"}}>Initial: {product.recue}</div>
          </div>
        )}

        <div style={{fontSize:12, fontWeight:600, color:"#666", marginBottom:6}}>RÉPARTITION PAR MAGASIN</div>
        <div className="edit-grid" style={{gridTemplateColumns:gridCols}}>
          {storeColumns.map(s => (
            <div className="edit-cell" key={s.code}>
              <label>{s.label}</label>
              <input type="text" inputMode="numeric" pattern="[0-9]*" value={qties[s.code]} onChange={handleNumChange(s.code)} onFocus={e=>e.target.select()} />
            </div>
          ))}
        </div>

        <div style={{fontSize:12, marginBottom:12, textAlign:"center", padding:8, borderRadius:6, background:gap===0?"#e8f5e9":"#ffebee", color:gap===0?"#1a4d2e":"#c62828", fontWeight:600}}>
          Total réparti: {total} / Reçu: {recueN}
          {gap!==0 && <div style={{fontSize:11, marginTop:2}}>{gap>0?`⚠️ Surplus de ${gap}`:`⚠️ Manque ${-gap}`}</div>}
          {gap===0 && <div style={{fontSize:11, marginTop:2}}>✓ Total cohérent</div>}
        </div>

        {needReasons && (
          <div className="reason-block">
            <div className="rb-title">⚠️ MOTIF DE L'ÉCART (obligatoire)</div>
            {diffs.map(d => (
              <div className="reason-row" key={d.key}>
                <div className="rr-line">{d.store} : {d.planned} → <b>{d.real}</b> ({d.real-d.planned})</div>
                <select value={(reasons[d.key]||{}).reason||""} onChange={e=>setReason(d.key,{reason:e.target.value})}>
                  <option value="">— Choisir un motif —</option>
                  {ECART_REASONS.map(r => <option key={r.code} value={r.code}>{r.code}{r.fournisseur?" (avoir fournisseur)":" (interne)"}</option>)}
                </select>
                {(reasons[d.key]||{}).reason==="AUTRE" && (
                  <input type="text" placeholder="Préciser le motif…" value={(reasons[d.key]||{}).text||""} onChange={e=>setReason(d.key,{text:e.target.value})} />
                )}
              </div>
            ))}
          </div>
        )}

        <div className="modal-actions">
          <button className="btn-cancel" onClick={onClose}>Annuler</button>
          <button className="btn-confirm" onClick={handleSave} disabled={needReasons && missing}>Valider</button>
        </div>
      </div>
    </div>
  );
}
