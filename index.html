function useAllPicking() {
  const [pk, setPk] = useState({});
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref("picking");
    const h = (snap) => setPk(snap.val()||{});
    ref.on("value", h);
    return () => ref.off("value", h);
  }, []);
  return pk;
}

const pkEanNorm = (s) => String(s==null?"":s).replace(/\D/g,"").replace(/^0+/,"");
// Stats d'un picking : lignes pointées, OK, manquantes, unités.
function pickingStats(p) {
  const prods = (p && p.meta && p.meta.products) || [];
  const st = (p && p.state) || {};
  let done=0, ok=0, short=0, qty=0, picked=0;
  prods.forEach(x => { const s=st[x.k]; qty += Number(x.qty)||0;
    if (s && s.done) { done++; const pq=Number(s.picked)||0; picked+=pq; if (pq>=(Number(x.qty)||0)) ok++; else short++; } });
  return { total:prods.length, done, ok, short, qty, picked };
}

function PickingScreen({ pickingId, pick, operator, onLeave, onEnlevement }) {
  const meta  = (pick && pick.meta) || {};
  const state = (pick && pick.state) || {};
  const enlLock = pick && pick.enlevement;
  // v5.14 : enlèvement demandé → picking VERROUILLÉ (lecture seule) pour tout le monde.
  const closed = (pick && pick.closed) || (enlLock ? { at:enlLock.at, by:enlLock.by, enlLock:true } : null);
  const products = Array.isArray(meta.products) ? meta.products : [];
  const [scan, setScan] = useState("");
  const [editK, setEditK] = useState(null);
  const [editQty, setEditQty] = useState("");
  const [openSup, setOpenSup] = useState({});
  const [toast, setToast] = useState("");
  const [closing, setClosing] = useState(false);
  const [closeDlg, setCloseDlg] = useState(null);   // { store } : popup de clôture (lieu à confirmer)
  const [lieuDlg, setLieuDlg] = useState(false);    // popup « corriger le lieu »
  const [addDlg, setAddDlg] = useState(null);       // v5.15 : ajout manuel { ean, des, sup, qty }
  // Clavier écran masqué tant qu'on ne touche pas le champ (la douchette Zebra n'en a pas besoin).
  const [kbOn, setKbOn] = useState(false);
  // Onglets comme le dispatch : « À faire » (les validés disparaissent) / « Validés » (revoir, corriger, annuler).
  const [showDone, setShowDone] = useState(false);
  const scanRef = useRef(null);
  const focusScan = () => { setTimeout(()=>{ if (scanRef.current && !editK) scanRef.current.focus({ preventScroll:true }); }, 40); };
  useEffect(()=>{ focusScan(); }, []);
  const flash = (m, ms) => { setToast(m); setTimeout(()=>setToast(""), ms||1400); };
  const opBy = operator.name || "Opérateur";

  // Regroupement PAR FOURNISSEUR (nom), trié alphabétiquement.
  const groups = useMemo(() => {
    const g = {};
    products.forEach(p => { const n = (p.supName || p.supCode || "Fournisseur ?").trim(); (g[n] = g[n] || { name:n, codes:new Set(), items:[] }); if (p.supCode) g[n].codes.add(p.supCode); g[n].items.push(p); });
    return Object.values(g).map(x => Object.assign(x, { codes:[...x.codes] })).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
  }, [products]);
  // Recherche (fournisseur, produit, code) dans le même champ que le scan.
  const q = stripAccents(String(scan||"").toLowerCase()).trim();
  const searching = q.length >= 2;
  const isDone = (p) => !!(state[p.k] && state[p.k].done);
  const filterGroups = (wantDone) => {
    const toks = q.split(/\s+/).filter(Boolean);
    const hit = (t) => { const x = stripAccents(String(t||"").toLowerCase()); return toks.every(w => x.includes(w)); };
    return groups.map(g => {
      let items = g.items.filter(p => isDone(p) === wantDone);
      if (searching && !(hit(g.name) || g.codes.some(hit))) items = items.filter(p => hit(p.designation) || hit(p.ean) || hit(p.ref));
      return items.length ? Object.assign({}, g, { items, all:g.items }) : null;
    }).filter(Boolean);
  };
  const todoGroups = useMemo(() => filterGroups(false), [groups, q, searching, state]);
  const doneGroups = useMemo(() => filterGroups(true),  [groups, q, searching, state]);
  const shownGroups = showDone ? doneGroups : todoGroups;
  const otherGroups = showDone ? todoGroups : doneGroups;
  const countItems = (gs) => gs.reduce((a,g)=>a+g.items.length, 0);
  const nTodo = products.filter(p => !isDone(p)).length, nDone = products.length - nTodo;
  const eanIdx = useMemo(() => { const m={}; products.forEach(p => { const e=pkEanNorm(p.ean); if (e && !m[e]) m[e]=p; }); return m; }, [products]);
  const stx = pickingStats(pick);

  const openEdit = (p) => {
    const s = state[p.k];
    setEditK(p.k); setEditQty(String(s && s.done ? (Number(s.picked)||0) : (Number(p.qty)||0)));
    const gName = (p.supName || p.supCode || "Fournisseur ?").trim();
    setOpenSup(o => Object.assign({}, o, { [gName]:true }));
  };
  const closeEdit = () => { setEditK(null); focusScan(); };

  // Zebra : si le scan est tapé dans le champ quantité (popup ouverte), on le détecte à la vitesse de frappe.
  const kb = useRef({ buf:"", t:0, base:"" });
  const onQtyKeyDown = (e) => {
    const now = Date.now(), k = kb.current;
    if (now - k.t > 80) { k.buf = ""; k.base = editQty; }
    k.t = now;
    if (e.key === "Enter") {
      e.preventDefault();
      if (k.buf.length >= 6) { const code = k.buf; k.buf = ""; setEditQty(k.base); commitScan(code, k.base); }
      else validate();
      return;
    }
    if (/^\d$/.test(e.key)) k.buf += e.key;
  };
  const commitScan = (raw, qBefore) => {
    if (qBefore == null) qBefore = editQty;
    const txt = String(raw||"").trim();
    // Saisie avec des lettres = RECHERCHE : si un seul produit correspond, on l'ouvre ; sinon la liste reste filtrée.
    // Scan arrivé à la suite d'une recherche tapée : on prend le code-barres en fin de saisie.
    const tail = txt.match(/(\d{6,})$/);
    if (/[a-zA-ZÀ-ÿ]/.test(txt) && tail && eanIdx[pkEanNorm(tail[1])]) raw = tail[1];
    else if (/[a-zA-ZÀ-ÿ]/.test(txt)) {
      const items = shownGroups.reduce((a,g)=>a.concat(g.items), []);
      const others = otherGroups.reduce((a,g)=>a.concat(g.items), []);
      if (items.length === 1) { setScan(""); openEdit(items[0]); }
      else if (items.length === 0 && others.length === 1) { setScan(""); openEdit(others[0]); }
      return;
    }
    const ean = pkEanNorm(extractEan(raw));
    setScan("");
    if (ean.length < 3) { focusScan(); return; }
    const p = eanIdx[ean];
    // Popup ouverte + nouveau scan (Zebra) → on valide d'abord le produit en cours avec la quantité affichée.
    if (editK && p && p.k !== editK && !closed) validate(qBefore);
    if (!p) { try{ navigator.vibrate && navigator.vibrate([80,60,80]); }catch(e){}
      if (closed) { flash("⚠️ Produit absent de ce picking", 1800); focusScan(); return; }
      setAddDlg({ ean:String(extractEan(raw)||"").replace(/\D/g,""), des:"", sup:"", qty:"1" }); return; }
    try { navigator.vibrate && navigator.vibrate(40); } catch(e){}
    openEdit(p);
  };

  const writeState = (k, patch) => {
    if (!firebaseReady) { flash("Hors-ligne : non synchronisé"); return; }
    db.ref(`picking/${pickingId}/state/${k}`).update(patch);
  };
  const doValidate = (p, v) => {
    writeState(p.k, { done:true, picked:v, qty:Number(p.qty)||0, doneBy:opBy, doneAt:Date.now() });
    const manque = (Number(p.qty)||0) - v;
    flash(manque>0 ? `⚠️ ${v}/${p.qty} — manque ${manque}` : `✓ ${v} sur la palette`);
  };
  const validate = (qOverride) => {
    const p = products.find(x => x.k === editK); if (!p) return closeEdit();
    const v = Math.max(0, Math.floor(Number(String(qOverride!=null?qOverride:editQty).replace(/\D/g,""))||0));
    doValidate(p, v);
    closeEdit();
  };
  // Validation MANUELLE rapide (carton entier non ouvert, sans scan) : la quantité commandée d'un tap.
  const quickValidate = (p) => { if (closed) return; doValidate(p, Number(p.qty)||0); try{ navigator.vibrate && navigator.vibrate(30); }catch(e){} focusScan(); };
  const undo = (k) => { if (firebaseReady) db.ref(`picking/${pickingId}/state/${k}`).remove(); closeEdit(); };

  // v5.12 — corriger le magasin du picking (ex. attribué à Bichat au lieu de Robespierre).
  const setStore = async (code) => {
    if (!firebaseReady || !code || code===meta.storeCode) return;
    await db.ref(`picking/${pickingId}/meta`).update({ storeCode:code, storeLabel:pkStoreLabel(code), storeFixedBy:opBy+" · "+new Date().toLocaleString("fr-FR"), storeBefore:meta.storeCode||"" });
  };
  const cloturer = () => setCloseDlg({ store: meta.storeCode || "ROB" });
  const doCloturer = async (storeCode) => {
    const notDone = products.filter(p => !(state[p.k] && state[p.k].done));
    const partial = notDone.length > 0;
    setCloseDlg(null);
    setClosing(true);
    try { if (storeCode && storeCode !== meta.storeCode) await setStore(storeCode); } catch(e) { alert("Erreur changement de lieu : "+e.message); setClosing(false); return; }
    const stCode = storeCode || meta.storeCode || ""; const stLabel = pkStoreLabel(stCode);
    const lines = products.map(p => { const s = state[p.k] || {}; const picked = s.done ? (Number(s.picked)||0) : 0;
      return { supplier:p.supName||p.supCode||"", supCode:p.supCode||"", ean:p.ean||"", designation:p.designation||"", qty:Number(p.qty)||0, picked, ecart:picked-(Number(p.qty)||0), done:!!s.done, doneBy:s.doneBy||"", doneAt:s.doneAt?new Date(s.doneAt).toISOString():"" }; });
    const manques = lines.filter(l => l.ecart < 0);
    const times = products.map(p => state[p.k] && state[p.k].doneAt).filter(Boolean).sort((a,b)=>a-b);
    const closedObj = { at:Date.now(), by:opBy, total:lines.length, ok:lines.length-manques.length, short:manques.length,
      qty:lines.reduce((a,l)=>a+l.qty,0), picked:lines.reduce((a,l)=>a+l.picked,0) };
    try {
      if (firebaseReady) {
        // Les lignes non pointées sont figées à 0 (manquant) pour l'historique console.
        const up = {}; notDone.forEach(p => { up[`state/${p.k}`] = { done:true, picked:0, qty:Number(p.qty)||0, doneBy:opBy+(partial?" (clôture partielle — non préparé)":" (clôture)"), doneAt:Date.now(), auto:true, nonPrepare:partial }; });
        closedObj.partial = partial; closedObj.nonPrepares = notDone.length; closedObj.storeCode = stCode;
        up["closed"] = closedObj;
        await db.ref(`picking/${pickingId}`).update(up);
      }
    } catch(e) { alert("Erreur d'enregistrement : "+e.message); setClosing(false); return; }
    // Mail récap à rr@pribon.org — envoyé MÊME sans écart (« picking XXX réalisé »).
    try {
      // Envoyé au MÊME Apps Script que la réception / verify-code (CODE_VERIFY_URL) → action log-picking-recap.
      await fetch(CODE_VERIFY_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({ action:"log-picking-recap", sessionId:pickingId, brand:BRAND, orderNum:meta.orderNum||"", orderDate:meta.orderDate||"",
          storeCode:stCode, storeLabel:stLabel, partial, nonPrepares:notDone.length, operator:opBy, operatorCode:operator.code||"",
          startedAt: times[0] ? new Date(times[0]).toISOString() : null, endedAt:new Date().toISOString(),
          total:closedObj.total, ok:closedObj.ok, short:closedObj.short, qty:closedObj.qty, picked:closedObj.picked,
          manques, lines }) });
    } catch(e) {}
    setClosing(false);
    launchCelebration(partial ? `Clôture partielle ${meta.orderNum||""} ✔` : `Picking ${meta.orderNum||""} réalisé !`, `${stLabel} · ${closedObj.total-closedObj.short}/${closedObj.total} OK${closedObj.short?` · ${closedObj.short} manque(s)/non préparé(s)`:""}`);
    if (onEnlevement && confirm("Picking clôturé pour "+stLabel+".\n\nDemander l'enlèvement à Rungis maintenant ?")) onEnlevement(); else onLeave();
  };

  const saveAdd = async () => {
    const d = addDlg; if (!d) return;
    const des = String(d.des||"").trim(); const q = Math.max(0, Math.floor(Number(String(d.qty).replace(/\D/g,""))||0));
    if (!des) { alert("Indique le nom du produit."); return; }
    if (!q) { alert("Indique la quantité mise sur la palette."); return; }
    if (!firebaseReady) { alert("Hors-ligne : impossible d'ajouter."); return; }
    const k = "m_" + (d.ean||"x").replace(/[^0-9A-Za-z]/g,"") + "_" + Date.now();
    const np = { k, ean:d.ean||"", ref:"", designation:des, qty:0, supCode:"", supName:(String(d.sup||"").trim()||"AJOUT MANUEL"), manual:true, addedBy:opBy, addedAt:Date.now() };
    try {
      await db.ref(`picking/${pickingId}/meta/products`).transaction(cur => [ ...(Array.isArray(cur)?cur:[]), np ]);
      await db.ref(`picking/${pickingId}/state/${k}`).set({ done:true, picked:q, qty:0, doneBy:opBy, doneAt:Date.now(), manual:true });
      flash(`➕ ${des} ajouté (${q})`, 1800); setAddDlg(null); focusScan();
    } catch(e) { alert("Erreur : "+e.message); }
  };
  const editP = editK ? products.find(x => x.k === editK) : null;
  const pct = stx.total ? Math.round(stx.done*100/stx.total) : 0;

  return (
    <div className="app">
      <div className="header" style={{background:PICKING_COLOR}}>
        <div className="header-row">
          <div>
            <h1>🛒 PICKING · <span onClick={()=>!(pick&&pick.enlevement)&&setLieuDlg(true)} style={{background:siteColor(meta.storeCode), borderRadius:8, padding:"1px 8px", cursor:"pointer"}} title="Corriger le lieu">{meta.storeLabel || meta.storeCode || "Magasin"} ✏️</span></h1>
            <div className="sub">Commande {meta.orderNum||"—"}{meta.orderDate?` du ${meta.orderDate}`:""} · {stx.done}/{stx.total} produits · {groups.length} fournisseur(s)</div>
          </div>
          <div className="header-actions">{onEnlevement && <button className="header-btn" onClick={onEnlevement} title="Demander un enlèvement à Rungis">🚛</button>}<button className="header-btn" onClick={onLeave}>← Retour</button></div>
        </div>
        <div className="tabs-bar pk-tabs">
          <button className={`tab ${!showDone?"active":""}`} style={!showDone?{color:PICKING_COLOR, borderBottomColor:PICKING_COLOR, background:PICKING_BG}:{}} onClick={()=>setShowDone(false)}>À faire ({nTodo})</button>
          <button className={`tab ${showDone?"active":""}`} style={showDone?{color:"#2e7d32", borderBottomColor:"#2e7d32", background:"#e8f5e9"}:{}} onClick={()=>setShowDone(true)}>✓ Validés ({nDone}){stx.short?` · ⚠${stx.short}`:""}</button>
        </div>
      </div>


      <div style={{padding:14, paddingBottom:140, maxWidth:720, margin:"0 auto"}}>
        {enlLock && <div style={{marginBottom:10, padding:"12px", borderRadius:12, background:FLUO, border:"3px solid #000", color:"#000", fontWeight:900, fontSize:15}}>🔒 Enlèvement demandé par <span style={{background:"#000", color:FLUO, padding:"1px 8px", borderRadius:6}}>{safeName(enlLock.by)}</span> à {fmtTime(enlLock.at)}<div style={{fontSize:12, fontWeight:700, marginTop:4}}>Picking verrouillé : plus de modification possible. Seul {safeName(enlLock.by)} peut annuler sa demande (écran Enlèvement).</div></div>}
        {closed && !closed.enlLock && <div style={{marginBottom:10, padding:"10px 12px", borderRadius:10, background:"#e8f5e9", border:"1.5px solid #2e7d32", color:"#2e7d32", fontWeight:800, fontSize:14}}>✓ Picking {closed.partial?"clôturé PARTIELLEMENT":"clôturé"} par {closed.by||"—"} à {fmtTime(closed.at)}{closed.partial?` · ${closed.nonPrepares||0} produit(s) non préparé(s)`:""}
          {onEnlevement && !(pick&&pick.enlevement) && <button onClick={onEnlevement} style={{display:"block", width:"100%", marginTop:8, padding:12, borderRadius:10, background:"#e65100", color:"#fff", fontWeight:900, fontSize:15}}>🚛 Demander l'enlèvement à Rungis</button>}</div>}
        {!firebaseReady && <div className="admin-note" style={{color:"#c62828"}}>⚠️ Hors-ligne : le picking ne sera pas synchronisé.</div>}

        <div style={{height:10, background:"#e0e7ef", borderRadius:6, overflow:"hidden", marginBottom:12}}>
          <div style={{height:"100%", width:pct+"%", background:stx.short?"#ef6c00":PICKING_COLOR, transition:"width .3s"}} />
        </div>

        <div className="scan-search-wrap">
          <input ref={scanRef} className="scan-search-input" style={{borderColor:PICKING_COLOR, fontSize:18, paddingRight:44}} type="text" enterKeyHint="search" autoComplete="off"
            inputMode={kbOn ? "text" : "none"} onPointerDown={()=>setKbOn(true)} onBlur={()=>setKbOn(false)}
            placeholder="📟 Scan ou recherche…" value={scan}
            onChange={e=>setScan(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); commitScan(scan); } }} autoFocus />
          {scan && <button onClick={()=>{ setScan(""); focusScan(); }} aria-label="Effacer"
            style={{position:"absolute", right:8, top:"50%", transform:"translateY(-50%)", width:34, height:34, borderRadius:17, background:"#eef2f7", color:"#555", fontSize:18, fontWeight:900}}>✕</button>}
        </div>
        {!closed && <button onClick={()=>setAddDlg({ ean:"", des:"", sup:"", qty:"1" })} style={{width:"100%", margin:"-6px 0 10px", padding:"10px", borderRadius:10, border:"2px dashed "+PICKING_COLOR, background:"#fff", color:PICKING_COLOR, fontWeight:900, fontSize:14}}>➕ Ajouter un produit hors commande (scan ou saisie)</button>}
        <div style={{fontSize:11, color:"#888", margin:"-4px 2px 12px"}}>{showDone
          ? <>Produits déjà mis sur la palette. Touche une ligne pour <b>corriger</b> la quantité ou <b>annuler</b>.</>
          : <>Carton entier non ouvert : touche <b style={{color:PICKING_COLOR}}>✓</b> sur la ligne. Touche la ligne pour une autre quantité. Une fois validé, le produit passe dans <b>Validés</b>.</>}</div>
        {searching && shownGroups.length===0 && <div className="admin-note">Aucun résultat ici pour « {scan} ».
          {countItems(otherGroups)>0 && <> <button onClick={()=>setShowDone(!showDone)} style={{marginLeft:6, padding:"4px 10px", borderRadius:8, background:showDone?PICKING_BG:"#e8f5e9", color:showDone?PICKING_COLOR:"#2e7d32", fontWeight:800, fontSize:12}}>{countItems(otherGroups)} dans {showDone?"À faire":"Validés"} →</button></>}</div>}
        {!searching && !showDone && nTodo===0 && products.length>0 && <div style={{textAlign:"center", padding:"18px 10px", color:"#2e7d32", fontWeight:800}}>✓ Tout est validé. Vérifie l'onglet <b>Validés</b> si besoin, puis clôture le picking.</div>}
        {!searching && showDone && nDone===0 && <div className="admin-note">Rien de validé pour l'instant.</div>}

        {shownGroups.map(g => {
          const all = g.all || g.items;
          const gDone = all.filter(p => state[p.k] && state[p.k].done).length;
          const gShort = all.filter(p => state[p.k] && state[p.k].done && (Number(state[p.k].picked)||0) < (Number(p.qty)||0)).length;
          const full = gDone === all.length;
          // Fournisseurs REPLIÉS à l'ouverture : on choisit celui par lequel on commence. Recherche = tout déplié.
          const supKey = (showDone?"v_":"a_") + g.name;
          const isOpen = searching || !!openSup[supKey];
          return (
            <div key={g.name} style={{background:"#fff", borderRadius:12, marginBottom:10, border:"1.5px solid "+(full?(gShort?"#ffcc80":"#a5d6a7"):"#cfd8e3"), overflow:"hidden"}}>
              <div onClick={()=>setOpenSup(o=>Object.assign({}, o, {[supKey]:!isOpen}))}
                style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, padding:"12px 14px", cursor:"pointer", background:full?(gShort?"#fff3e0":"#e8f5e9"):PICKING_BG}}>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:900, fontSize:16, color:"#1a237e", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>🏷️ {g.name}</div>
                  <div style={{fontSize:11, color:"#666", fontFamily:"monospace"}}>{g.codes.join(" · ")}</div>
                </div>
                <div style={{display:"flex", alignItems:"center", gap:8, whiteSpace:"nowrap"}}>
                  {gShort>0 && <span style={{fontSize:12, fontWeight:800, color:"#e65100"}}>⚠ {gShort}</span>}
                  <span style={{fontWeight:900, fontSize:15, color:showDone?"#2e7d32":PICKING_COLOR}}>{showDone ? `✓ ${g.items.length}` : `${g.items.length} à faire`}</span>
                  <span style={{fontSize:11, color:"#999"}}>{gDone}/{all.length}</span>
                  <span style={{fontSize:16, color:"#888"}}>{isOpen?"▾":"▸"}</span>
                </div>
              </div>
              {isOpen && g.items.map(p => {
                const s = state[p.k]; const d = s && s.done; const pq = d ? (Number(s.picked)||0) : null; const sh = d && pq < (Number(p.qty)||0);
                return (
                  <div key={p.k} onClick={()=>openEdit(p)}
                    style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, padding:"11px 14px", borderTop:"1px solid #eef1f5", cursor:"pointer", background:d?(sh?"#fff8f0":"#f4fbf5"):"#fff"}}>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:700, fontSize:14, lineHeight:1.25, wordBreak:"break-word", color:d?"#555":"#111"}}>{d?(sh?"⚠️ ":"✅ "):""}{p.manual?"➕ ":""}{p.designation}{p.manual?<span style={{fontSize:11, fontWeight:800, color:"#6a1b9a"}}> · ajouté hors commande{p.addedBy?" par "+safeName(p.addedBy):""}</span>:null}</div>
                      <div style={{fontSize:11, color:"#888", fontFamily:"monospace"}}>{p.ean||"sans code"}{d && s.doneBy?` · ${s.doneBy}`:""}</div>
                    </div>
                    <div style={{display:"flex", alignItems:"center", gap:8, whiteSpace:"nowrap"}}>
                      {d ? <><div style={{fontWeight:900, fontSize:18, color:sh?"#e65100":"#2e7d32"}}>{pq}<span style={{fontSize:12, color:"#999"}}>/{p.qty}</span></div>
                             {!closed && <span style={{fontSize:15, color:"#888"}} title="Modifier">✏️</span>}</>
                         : <><div style={{fontWeight:900, fontSize:20, color:PICKING_COLOR}}>{p.qty}</div>
                             {!closed && <button onClick={e=>{ e.stopPropagation(); quickValidate(p); }} aria-label="Valider la quantité"
                               style={{width:44, height:44, borderRadius:10, background:PICKING_COLOR, color:"#fff", fontSize:22, fontWeight:900}}>✓</button>}</>}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
        {products.length===0 && <div className="admin-note">Aucun produit dans ce picking.</div>}
      </div>

      <div className="bottom-bar">
        <div className="stats"><span>{stx.done}/{stx.total} pointés</span><span>{stx.short>0?<b style={{color:"#e65100"}}>{stx.short} manque(s)</b>:<span>0 manque</span>}</span></div>
        <button className="btn-finish" style={{background:closed?"#9e9e9e":PICKING_COLOR}} onClick={cloturer} disabled={closing||!!closed||stx.total===0||stx.done===0}>
          {closed ? (closed.enlLock ? "🔒 Enlèvement demandé" : "✓ Picking clôturé") : (closing ? "Envoi…" : (stx.done < stx.total ? `◐ Clôture partielle (${stx.done}/${stx.total})` : "✓ Clôturer le picking"))}</button>
      </div>

      {toast && <div className="toast">{toast}</div>}
      {addDlg && (
        <div onClick={()=>{ setAddDlg(null); focusScan(); }} style={{position:"fixed", inset:0, background:"rgba(0,0,0,.55)", zIndex:1002, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"28px 12px", overflowY:"auto"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff", width:"100%", maxWidth:460, borderRadius:16, padding:18, borderTop:"6px solid "+PICKING_COLOR}}>
            <div style={{fontWeight:900, fontSize:18}}>➕ Ajouter un produit hors commande</div>
            <div style={{fontSize:12, color:"#666", margin:"4px 0 12px"}}>Produit pas dans la commande {meta.orderNum||""} mais mis sur la palette {meta.storeCode||""}. Il apparaîtra dans « Validés » et dans le récap (ajout manuel).</div>
            <label style={{fontSize:12, fontWeight:800, color:"#555"}}>Code-barres (scanne ou tape)</label>
            <input value={addDlg.ean} inputMode="numeric" autoFocus={!addDlg.ean} onChange={e=>setAddDlg(d=>({ ...d, ean:e.target.value.replace(/\D/g,"").slice(0,14) }))} style={{width:"100%", padding:12, fontSize:18, fontFamily:"monospace", border:"2px solid #ddd", borderRadius:10, margin:"4px 0 10px"}} placeholder="EAN" />
            <label style={{fontSize:12, fontWeight:800, color:"#555"}}>Nom du produit *</label>
            <input value={addDlg.des} autoFocus={!!addDlg.ean} onChange={e=>setAddDlg(d=>({ ...d, des:e.target.value }))} style={{width:"100%", padding:12, fontSize:16, border:"2px solid "+PICKING_COLOR, borderRadius:10, margin:"4px 0 10px"}} placeholder="ex. Jus de pomme 1L" />
            <label style={{fontSize:12, fontWeight:800, color:"#555"}}>Fournisseur (facultatif)</label>
            <input value={addDlg.sup} onChange={e=>setAddDlg(d=>({ ...d, sup:e.target.value }))} style={{width:"100%", padding:12, fontSize:15, border:"2px solid #ddd", borderRadius:10, margin:"4px 0 10px"}} placeholder="ex. RELAIS VERT" />
            <label style={{fontSize:12, fontWeight:800, color:"#555"}}>Quantité mise sur la palette *</label>
            <div style={{display:"flex", alignItems:"center", gap:6, margin:"4px 0 14px"}}>
              <button onClick={()=>setAddDlg(d=>({ ...d, qty:String(Math.max(0,(Number(d.qty)||0)-1)) }))} style={{width:52, height:52, borderRadius:10, background:"#f0f0f0", fontSize:28, fontWeight:800}}>−</button>
              <input type="tel" inputMode="numeric" value={addDlg.qty} onChange={e=>setAddDlg(d=>({ ...d, qty:e.target.value.replace(/\D/g,"").slice(0,6) }))} onFocus={e=>e.target.select()} style={{flex:1, minWidth:0, padding:"10px 4px", fontSize:28, fontWeight:900, textAlign:"center", border:"1.5px solid #ddd", borderRadius:10}} />
              <button onClick={()=>setAddDlg(d=>({ ...d, qty:String((Number(d.qty)||0)+1) }))} style={{width:52, height:52, borderRadius:10, background:PICKING_COLOR, color:"#fff", fontSize:28, fontWeight:800}}>+</button>
            </div>
            <button onClick={saveAdd} style={{width:"100%", padding:16, borderRadius:12, background:PICKING_COLOR, color:"#fff", fontWeight:900, fontSize:17}}>➕ Ajouter sur la palette</button>
            <button onClick={()=>{ setAddDlg(null); focusScan(); }} style={{width:"100%", marginTop:8, padding:10, borderRadius:10, background:"#eef2f7", color:"#555", fontWeight:700}}>Annuler</button>
          </div>
        </div>)}
      {(closeDlg || lieuDlg) && (() => {
        const isClose = !!closeDlg; const cur = isClose ? closeDlg.store : (meta.storeCode||"");
        const nd = products.filter(p => !(state[p.k] && state[p.k].done)).length;
        const pick1 = (c) => { if (isClose) setCloseDlg({ store:c }); else { setStore(c).then(()=>flash("📍 Lieu corrigé : "+pkStoreLabel(c), 1800)).catch(e=>alert(e.message)); setLieuDlg(false); } };
        return (
          <div onClick={()=>{ setCloseDlg(null); setLieuDlg(false); }} style={{position:"fixed", inset:0, background:"rgba(0,0,0,.55)", zIndex:1001, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"28px 12px", overflowY:"auto"}}>
            <div onClick={e=>e.stopPropagation()} style={{background:"#fff", width:"100%", maxWidth:460, borderRadius:16, padding:18, borderTop:"6px solid "+PICKING_COLOR}}>
              <div style={{fontWeight:900, fontSize:18, marginBottom:4}}>{isClose ? (nd ? "◐ Clôture partielle" : "✓ Clôturer le picking") : "📍 Corriger le lieu du picking"}</div>
              <div style={{fontSize:13, color:"#555", marginBottom:12}}>Commande {meta.orderNum||"—"} · actuellement <b style={{color:siteColor(meta.storeCode)}}>{meta.storeLabel||meta.storeCode||"?"}</b></div>
              {isClose && nd>0 && <div style={{background:"#fff3e0", border:"1.5px solid #ef6c00", borderRadius:10, padding:10, fontSize:13, color:"#7a3d00", marginBottom:12}}>
                ⚠️ <b>{nd}</b> produit(s) pas encore validé(s) : ils seront notés <b>« non préparés »</b>. Seuls les <b>{stx.done}</b> produits validés partent sur la palette.</div>}
              <div style={{fontSize:12, fontWeight:900, color:"#333", textTransform:"uppercase", marginBottom:6}}>{isClose ? "Confirme le lieu de destination" : "Choisis le bon lieu"}</div>
              {PK_STORES.map(st => { const c = siteColor(st.code); const on = cur===st.code; return (
                <button key={st.code} onClick={()=>pick1(st.code)} style={{display:"flex", alignItems:"center", gap:10, width:"100%", marginBottom:8, padding:"14px 12px", borderRadius:12, border:"3px solid "+c, background:on?c:c+"14", color:on?"#fff":c, fontWeight:900, fontSize:17, textAlign:"left"}}>
                  <span style={{background:on?"#fff":c, color:on?c:"#fff", borderRadius:6, padding:"2px 8px", fontSize:14}}>{st.code}</span>{st.label}{on?" ✓":""}</button>); })}
              {isClose && <button onClick={()=>doCloturer(closeDlg.store)} style={{width:"100%", marginTop:6, padding:16, borderRadius:12, background:nd?"#ef6c00":PICKING_COLOR, color:"#fff", fontWeight:900, fontSize:17}}>
                {nd ? `◐ Clôturer partiellement → ${closeDlg.store}` : `✓ Clôturer → ${closeDlg.store}`}</button>}
              <button onClick={()=>{ setCloseDlg(null); setLieuDlg(false); }} style={{width:"100%", marginTop:8, padding:10, borderRadius:10, background:"#eef2f7", color:"#555", fontWeight:700}}>Annuler</button>
            </div>
          </div>);
      })()}
      {/* Popup quantité (comme l'inventaire) : Valider = tout mis sur la palette ; sinon quantité inférieure. */}
      {editP && (() => {
        const want = Number(editP.qty)||0; const v = Math.max(0, Math.floor(Number(String(editQty).replace(/\D/g,""))||0));
        const s = state[editP.k]; const manque = want - v;
        return (
          <div onClick={closeEdit} style={{position:"fixed", inset:0, background:"rgba(0,0,0,.5)", zIndex:1000, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"28px 12px", overflowY:"auto"}}>
            <div onClick={e=>e.stopPropagation()} style={{background:"#fff", width:"100%", maxWidth:460, borderRadius:16, padding:18, boxShadow:"0 12px 40px rgba(0,0,0,.3)", borderTop:"6px solid "+PICKING_COLOR}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8}}>
                <div style={{fontSize:11, fontWeight:900, color:PICKING_COLOR, letterSpacing:".5px", paddingTop:4}}>🛒 PICKING · {editP.supName||editP.supCode}</div>
                <button onClick={closeEdit} aria-label="Fermer" style={{flex:"0 0 auto", width:40, height:40, marginTop:-6, marginRight:-6, borderRadius:20, background:"#eef2f7", color:"#333", fontSize:20, fontWeight:900}}>✕</button>
              </div>
              {s && s.done && <div style={{margin:"6px 0 2px", padding:"6px 10px", borderRadius:8, background:"#fff8e1", color:"#8d6e00", fontSize:12, fontWeight:800}}>✏️ Déjà validé : {Number(s.picked)||0}/{want}{s.doneBy?` par ${s.doneBy}`:""} — tu peux corriger la quantité ou annuler.</div>}
              <div style={{fontWeight:900, fontSize:18, margin:"6px 0 2px"}}>{editP.designation}</div>
              <div style={{fontSize:12, color:"#888", fontFamily:"monospace", marginBottom:14}}>{editP.ean}</div>
              <div style={{textAlign:"center", background:PICKING_BG, borderRadius:12, padding:"10px 0", marginBottom:14}}>
                <div style={{fontSize:12, color:"#555", fontWeight:700}}>À mettre sur la palette {meta.storeCode||""}</div>
                <div style={{fontSize:40, fontWeight:900, color:PICKING_COLOR, lineHeight:1.1}}>{want}</div>
              </div>
              <div style={{fontSize:11, fontWeight:800, color:"#666", marginBottom:6, textTransform:"uppercase", letterSpacing:".3px", textAlign:"center"}}>Quantité mise sur la palette</div>
              <div style={{display:"flex", alignItems:"center", gap:6}}>
                <button onClick={()=>setEditQty(String(Math.max(0, v-1)))} style={{width:52, height:52, borderRadius:10, background:"#f0f0f0", fontSize:28, fontWeight:800, color:"#555"}}>−</button>
                <input type="tel" inputMode="numeric" value={editQty} onKeyDown={onQtyKeyDown}
                  onChange={e=>setEditQty(e.target.value.replace(/\D/g,"").slice(0,12))} onFocus={e=>e.target.select()}
                  style={{flex:1, minWidth:0, padding:"10px 4px", fontSize:28, fontWeight:900, textAlign:"center", border:"1.5px solid #ddd", borderRadius:10}} />
                <button onClick={()=>setEditQty(String(v+1))} style={{width:52, height:52, borderRadius:10, background:PICKING_COLOR, color:"#fff", fontSize:28, fontWeight:800}}>+</button>
              </div>
              {manque>0 && <div style={{marginTop:10, textAlign:"center", fontWeight:800, color:"#e65100", background:"#fff3e0", borderRadius:8, padding:8}}>⚠️ Manque {manque} — signalé dans le mail de fin</div>}
              {manque<0 && <div style={{marginTop:10, textAlign:"center", fontWeight:800, color:"#6a1b9a", background:"#f3e5f5", borderRadius:8, padding:8}}>+{-manque} de plus que commandé</div>}
              <div style={{display:"flex", gap:8, marginTop:14}}>
                <button onClick={()=>setEditQty("0")} style={{flex:"0 0 auto", padding:"14px 14px", background:"#fdecea", color:"#c62828", borderRadius:12, fontWeight:800, fontSize:14}}>0 rupture</button>
                <button onClick={()=>validate()} disabled={!!closed} style={{flex:1, padding:16, background:manque>0?"#ef6c00":PICKING_COLOR, color:"#fff", borderRadius:12, fontWeight:900, fontSize:17}}>{s && s.done ? `✓ Corriger (${v})` : `✓ Valider (${v})`}</button>
              </div>
              {s && s.done && !closed && <button onClick={()=>undo(editP.k)} style={{width:"100%", marginTop:10, padding:10, background:"#eef2f7", color:"#555", borderRadius:10, fontWeight:700, fontSize:13}}>↩︎ Annuler le pointage</button>}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

/* =========================================================================
   APP ROOT
   ========================================================================= */
function App() {
  // Module courant : null (menu) | dispatch | decoupe | vin | reception | admin
  const [module, setModule] = useState(null);
  // Opérateur (login par code) — partagé entre modules, persistant.
  const [operator, setOperator] = useState(() => {
    const c = localStorage.getItem("centrale_op_code")||"";
    const at = parseInt(localStorage.getItem("centrale_op_at")||"0", 10);
    if (!c) return null;
    if (!at || (Date.now()-at) > CODE_SESSION_TTL_MS) { // session expirée -> reconnexion
      ["centrale_op_code","centrale_op_name","centrale_op_at"].forEach(k=>localStorage.removeItem(k));
      return null;
    }
    return { code:c, name: localStorage.getItem("centrale_op_name")||"" };
  });
  // Plus de connexion admin dans l'app : l'identité = uniquement le code opérateur.
  // On purge l'ancienne clé qui provoquait une "connexion" fantôme (ex. hg@probon.fr).
  const adminEmail = "";
  useEffect(() => { try { localStorage.removeItem("centrale_admin_email"); } catch(e){} }, []);
  const logout = () => {
    ["centrale_op_code","centrale_op_name","centrale_op_at"].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
    setOperator(null); setModule(null);
  };
  // v5.15 : opérateur sans nom (ancienne connexion) → Prénom Nom résolus depuis le registre (le code n'est jamais affiché).
  useEffect(() => {
    if (!operator || !operator.code || operator.name) return;
    let alive = true; const c = operator.code;
    resolveOperatorName(c).then(n => { if (!alive || !n) return; try { localStorage.setItem("centrale_op_name", n); } catch(e){}
      setOperator(o => (o && o.code===c) ? { ...o, name:n } : o); });
    return () => { alive = false; };
  }, [operator && operator.code, operator && operator.name]);

  // ----- État module DISPATCH -----
  const [sessionId, setSessionId] = useState(localStorage.getItem("dispatch_sessionId")||"");
  const [supplier, setSupplier] = useState(localStorage.getItem("dispatch_supplier")||"");
  const [products, setProducts] = useState(() => { try { return JSON.parse(localStorage.getItem("dispatch_products")||"[]"); } catch { return []; } });
  const [storeColumns, setStoreColumns] = useState(() => { try { return JSON.parse(localStorage.getItem("dispatch_storeColumns")||"[]"); } catch { return []; } });
  const [dView, setDView] = useState("home"); // home | dispatch | recap | palette | naming | picking
  const [recapData, setRecapData] = useState(null);
  const [namingData, setNamingData] = useState(null);
  const [paletteStore, setPaletteStore] = useState(null);

  // ----- État module DÉCOUPE -----
  const [decSessionId, setDecSessionId] = useState("");
  const [decSupplier, setDecSupplier] = useState("");
  const [decProducts, setDecProducts] = useState([]);
  const [decEntity, setDecEntity] = useState("");   // KBG | ROB (poussé par la console)
  const [decView, setDecView] = useState("home"); // home | decoupe | recap
  const [decRecapData, setDecRecapData] = useState(null);

  // ----- État module INVENTAIRE VIN -----
  const [vinInvId, setVinInvId] = useState("");
  const [vinView, setVinView] = useState("home"); // home | inv

  // ----- État module ADMIN -----
  const [adminView, setAdminView] = useState("screen"); // screen | session
  const [adminViewingSession, setAdminViewingSession] = useState(null);

  const allSessions = useAllSessions();
  const allDecoupe = useAllDecoupe();
  const allVin = useInventaireVin();
  const allPicking = useAllPicking();
  const [pickingId, setPickingId] = useState(""); // picking ouvert (module Dispatch & Picking)

  // SYNCHRO AUTOMATIQUE découpe : à chaque retour d'internet + toutes les 20 s, tout ce qui est resté
  // sur la tablette (labo sans réseau) part vers le serveur → la console est mise à jour sans rien faire.
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref(".info/connected");
    const h = (snap)=>{ __decOnline = !!snap.val(); decSyncEmit(); if (__decOnline) decFlushAll(); };
    ref.on("value", h);
    const t = setInterval(()=>{ if (__decOnline) decFlushAll(); }, 20000);
    return () => { ref.off("value", h); clearInterval(t); };
  }, []);
  // BOUTON RETOUR / PRÉCÉDENT (tablette, navigateur) : avant il faisait sortir de la page en pleine découpe
  // (saisies en attente perdues en mémoire). Maintenant il navigue DANS l'app : pesée → découpe → accueil découpe → menu.
  const navRef = useRef({});
  navRef.current = { module, decView, decSessionId, dView, vinView };
  useEffect(() => {
    try { history.pushState({ centrale:1 }, ""); } catch(e){}
    const onPop = () => {
      try { history.pushState({ centrale:1 }, ""); } catch(e){} // on reste dans l'app
      const n = navRef.current;
      if (n.module==="decoupe") {
        if (n.decView==="decoupe" && n.decSessionId) { window.dispatchEvent(new Event("centrale-back-decoupe")); return; }
        if (n.decView==="recap") { setDecView("decoupe"); return; }
        setModule(null); return;
      }
      if (n.module==="dispatch" && n.dView && n.dView!=="home") { setDView("home"); return; }
      if (n.module==="vin" && n.vinView==="inv") { setVinView("home"); return; }
      if (n.module) setModule(null);
    };
    window.addEventListener("popstate", onPop);
    // Fermeture / rechargement de la page avec des découpes pas encore envoyées → avertissement du navigateur.
    const onUnload = (e) => { if (decPendingSids().length) { e.preventDefault(); e.returnValue = "Découpe pas encore envoyée à la console."; return e.returnValue; } };
    window.addEventListener("beforeunload", onUnload);
    return () => { window.removeEventListener("popstate", onPop); window.removeEventListener("beforeunload", onUnload); };
  }, []);
  // Forçage de MAJ : au démarrage + toutes les 10 min.
  useEffect(() => { centraleCheckVersion(); const t=setInterval(centraleCheckVersion, 10*60*1000); return ()=>clearInterval(t); }, []);
  // Expiration de session code (1 h) : déconnexion automatique -> reconnexion obligatoire.
  useEffect(() => {
    const check = () => {
      const at = parseInt(localStorage.getItem("centrale_op_at")||"0", 10);
      if (operator && (!at || (Date.now()-at) > CODE_SESSION_TTL_MS)) {
        ["centrale_op_code","centrale_op_name","centrale_op_at"].forEach(k=>localStorage.removeItem(k));
        setOperator(null);
      }
    };
    const t = setInterval(check, 30*1000); return () => clearInterval(t);
  }, [operator]);
  // Messages entrepôt (broadcasts poussés par la console) -> bannière.
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref("broadcasts"); const h = (snap)=>renderBroadcastBanner(snap.val()||{});
    ref.on("value", h); return () => ref.off("value", h);
  }, []);
  // Suit le module courant pour filtrer la bannière (dispatch / découpe).
  useEffect(() => { window.__centraleModule = module; renderBroadcastBanner(__lastBcast); }, [module]);

  // Chaîne d'affichage de l'opérateur (les composants dispatch attendent une chaîne).
  const opObj = operator || { code:"", name:"Opérateur" };
  const opName = operatorDisplay(opObj.code||"", opObj.name||"");

  useEffect(() => {
    if (sessionId) localStorage.setItem("dispatch_sessionId", sessionId);
    if (supplier) localStorage.setItem("dispatch_supplier", supplier);
    if (products.length>0) localStorage.setItem("dispatch_products", JSON.stringify(products));
    if (storeColumns.length>0) localStorage.setItem("dispatch_storeColumns", JSON.stringify(storeColumns));
  }, [sessionId, supplier, products, storeColumns]);

  /* ---- DISPATCH ---- */
  const handleSessionStart = (sid, sup, prods, cols) => {
    setSessionId(sid); setSupplier(sup); setProducts(prods); setStoreColumns(cols||[]);
    setModule("dispatch"); setDView("dispatch");
    if (firebaseReady) db.ref(`dispatch/${sid}/meta`).set({ supplier:sup, startedAt:Date.now(), products:prods, storeColumns:cols||[], createdBy:opName });
    try { fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({ action:"log-dispatch-start", sessionId:sid, supplier:sup, operator:opName, operatorCode:opObj.code, total:prods.length, startedAt:new Date().toISOString(), brand:BRAND }) }).catch(()=>{}); } catch(e){}
  };
  const handleJoinSession = (sid) => {
    if (!firebaseReady) return;
    db.ref(`dispatch/${sid}/meta`).once("value").then(snap => { const m=snap.val(); if(m){ setSessionId(sid); setSupplier(m.supplier||"Fournisseur"); setProducts(m.products||[]); setStoreColumns(m.storeColumns||[]); setDView("dispatch"); } });
  };
  const handleNeedsNaming = (data) => { setNamingData(data); setModule("dispatch"); setDView("naming"); };
  const handleNamingConfirm = (fp, fc) => { if(!namingData) return; const sup=namingData.supplier; const sid=`${stripAccents(sup).replace(/[^a-zA-Z0-9]/g,"_").toLowerCase()}_${Date.now()}`; setNamingData(null); handleSessionStart(sid, sup, fp, fc); };
  const handleFinish = (state, pk) => { setRecapData({ state, products:pk }); setDView("recap"); };
  const handleLeaveSession = () => {
    ["dispatch_sessionId","dispatch_supplier","dispatch_products","dispatch_storeColumns"].forEach(k=>localStorage.removeItem(k));
    setSessionId(""); setSupplier(""); setProducts([]); setStoreColumns([]); setRecapData(null); setDView("home");
  };

  /* ---- DÉCOUPE ---- */
  const handleDecoupeStart = (sid, sup, prods) => {
    setDecSessionId(sid); setDecSupplier(sup); setDecProducts(prods); setModule("decoupe"); setDecView("decoupe");
    if (firebaseReady) db.ref(`decoupe/${sid}/meta`).set({ supplier:sup, startedAt:Date.now(), products:prods, createdBy:opName });
    try { fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({ action:"log-decoupe-start", sessionId:sid, supplier:sup, operator:opName, operatorCode:opObj.code, total:prods.length, startedAt:new Date().toISOString(), brand:BRAND }) }).catch(()=>{}); } catch(e){}
  };
  // Rejoindre : sans attendre le serveur (marche hors ligne) — liste en mémoire, sinon sauvegarde de l'appareil.
  const handleDecoupeJoin = (sid) => {
    const s = (allDecoupe||{})[sid]; const m = (s && s.meta) || decLocalMeta(sid);
    setDecSessionId(sid); setDecSupplier(m.supplier||"Découpe"); setDecProducts(m.products||[]); setDecEntity(m.entity||""); setModule("decoupe"); setDecView("decoupe");
  };
  // Découpe du jour LIBRE : l'opérateur commence sans BL. Session clé sur le n° BL (bl_<ent>_<num>) pour
  // converger avec le BL poussé par la console, sinon session « du jour ». .update pour ne pas écraser un BL déjà chargé.
  // N° de BL OBLIGATOIRE : la découpe est clé sur bl_<entité>_<n°> = même clé que le BL chargé par le responsable
  // dans la console → les 44 fromages du BL arrivent tout seuls dans la découpe (et inversement).
  // Rien n'est écrit sur le serveur ici : l'en-tête n'est créé qu'au 1er fromage (plus de ligne « parasite »).
  const handleDecoupeStartLibre = (entity, blNum) => {
    const ent = (entity||"ROB").toUpperCase();
    const bl = (blNum||"").toString().trim();
    if (!bl) { alert("Le n° de BL est obligatoire pour démarrer une découpe."); return; }
    const blKey = bl.replace(/[^a-zA-Z0-9]/g,"");
    let sid = "bl_"+ent.toLowerCase()+"_"+blKey;
    const all = allDecoupe||{};
    if (!(all[sid] && all[sid].meta)) {
      // Découpe déjà existante pour ce BL (autre identifiant : BL renseigné après coup, ancienne version…) → on la rejoint.
      const found = Object.entries(all).find(([k,s]) => s && s.meta && s.meta.startedAt && String(s.meta.docNumber||"").replace(/[^a-zA-Z0-9]/g,"")===blKey && String(s.meta.entity||"").toUpperCase()===ent);
      if (found) sid = found[0];
    }
    const s = all[sid];
    const supLabel = (ent==="KBG"?"Découpe Kelbongoo":"Découpe Robespierre")+" · BL "+bl;
    if (!(s && s.meta) && !decLocalHasData(sid)) decLSset(decMetaKey(sid), { supplier:supLabel, entity:ent, docNumber:bl, startedAt:Date.now(), createdBy:opName, libre:true });
    const m = (s && s.meta) || decLocalMeta(sid);
    setDecSessionId(sid); setDecSupplier(m.supplier||supLabel); setDecProducts(m.products||[]); setDecEntity(m.entity||ent); setModule("decoupe"); setDecView("decoupe");
  };
  const handleDecoupeFinish = (state, pk) => { setDecRecapData({ state, products:pk }); setDecView("recap"); };
  const handleDecoupeLeave = () => { setDecSessionId(""); setDecSupplier(""); setDecProducts([]); setDecEntity(""); setDecRecapData(null); setDecView("home"); };

  /* ---- INVENTAIRE VIN ---- */
  const handleVinStart = () => {
    const invId = `vin_${Date.now()}`;
    const metaObj = { label:"Inventaire vin", startedAt:Date.now(), dateKey:todayKey(), createdBy:opName };
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/meta`).set(metaObj);
    setVinInvId(invId); setVinView("inv"); setModule("vin");
  };
  const handleVinJoin = (invId) => { setVinInvId(invId); setVinView("inv"); };
  const handleVinLeave = () => { setVinInvId(""); setVinView("home"); };

  /* ---- Divers ---- */
  const handleResetCache = () => {
    if (!confirm("Vider le cache de l'app sur CET appareil ?\n(Ne supprime pas les données Firebase partagées.)")) return;
    Object.keys(localStorage).filter(k=>k.startsWith("dispatch_")&&k!=="centrale_op_code"&&k!=="centrale_op_name").forEach(k=>localStorage.removeItem(k));
    setSessionId(""); setSupplier(""); setProducts([]); setStoreColumns([]); setRecapData(null); setDView("home");
    setTimeout(()=>window.location.reload(), 100);
  };
  const pickModule = (m) => {
    if (m==="reception") { try { window.open(RECEPTION_URL, "_blank"); } catch(e){ location.href = RECEPTION_URL; } return; }
    setModule(m);
  };

  // ===== LANDING =====
  if (module===null) return <ModuleSelect onPick={pickModule} onResetCache={handleResetCache} operator={operator} onLogout={logout} />;

  // ===== ADMIN = accès à la CONSOLE DE CHARGEMENT (gestion) =====
  if (module==="admin") return <AdminConsoleScreen onBack={()=>setModule(null)} />;

  // ===== DISPATCH PALETTE =====
  if (module==="dispatch") {
    if (!operator) return <CodeLoginScreen moduleLabel="Dispatch & Picking" moduleKey="dispatch" onLogin={(op)=>setOperator(op)} onBack={()=>setModule(null)} />;
    if (dView==="picking" && pickingId) return <PickingScreen pickingId={pickingId} pick={allPicking[pickingId]} operator={opObj} onLeave={()=>{ setPickingId(""); setDView("home"); }} onEnlevement={()=>{ setPickingId(""); setDView("enlevement"); }} />;
    if (dView==="naming" && namingData) return <NamingScreen supplier={namingData.supplier} products={namingData.products} storeColumns={namingData.storeColumns} onConfirm={handleNamingConfirm} onCancel={()=>{ setNamingData(null); setDView("home"); }} />;
    if (dView==="enlevement") return <EnlevementScreen operator={opObj} allSessions={allSessions} allPicking={allPicking} onBack={()=>setDView("home")} />;
    if (dView==="palette" && paletteStore) return <PaletteDetailScreen storeCode={paletteStore} allSessions={allSessions} adminEmail={true} onClose={()=>{ setPaletteStore(null); setDView("home"); }} />;
    if (dView==="recap" && recapData) return <RecapScreen sessionId={sessionId} operator={opName} supplier={supplier} products={recapData.products} storeColumns={storeColumns} state={recapData.state} onClose={()=>setDView("dispatch")} onLeave={handleLeaveSession} />;
    if (dView==="dispatch" && sessionId && products.length>0) return <DispatchScreen sessionId={sessionId} operator={opName} supplier={supplier} products={products} storeColumns={storeColumns} onFinish={handleFinish} onLeave={handleLeaveSession} />;
    return <HomeScreen operator={opName} meOp={opObj} allSessions={allSessions} allPicking={allPicking} adminEmail={false} onJoinSession={handleJoinSession} onJoinPicking={(id)=>{ setPickingId(id); setDView("picking"); }} onOpenEnlevement={()=>setDView("enlevement")} onBack={()=>setModule(null)} onLogout={logout} />;
  }

  // ===== INVENTAIRE VIN =====
  if (module==="vin") {
    if (!operator) return <CodeLoginScreen moduleLabel="Inventaire vin" moduleKey="vin" onLogin={(op)=>setOperator(op)} onBack={()=>setModule(null)} />;
    if (vinView==="inv" && vinInvId) return <InventaireVinScreen invId={vinInvId} inv={allVin[vinInvId]} operator={opObj} onLeave={handleVinLeave} />;
    return <InventaireVinHome operator={opObj} allVin={allVin} onNew={handleVinStart} onJoin={handleVinJoin} onBack={()=>setModule(null)} onLogout={logout} />;
  }

  // ===== DÉCOUPE FROMAGE =====
  if (module==="decoupe") {
    if (!operator) return <CodeLoginScreen moduleLabel="Découpe fromage" moduleKey="decoupe" onLogin={(op)=>setOperator(op)} onBack={()=>setModule(null)} />;
    if (decView==="recap" && decRecapData) return <DecoupeRecap sessionId={decSessionId} operator={opObj} supplier={decSupplier} entity={decEntity} products={decRecapData.products} state={decRecapData.state} allDecoupe={allDecoupe} onClose={()=>setDecView("decoupe")} onLeave={handleDecoupeLeave} />;
    if (decView==="decoupe" && decSessionId) return <DecoupeScreen sessionId={decSessionId} operator={opObj} supplier={decSupplier} products={decProducts} onFinish={handleDecoupeFinish} onLeave={handleDecoupeLeave} />;
    return <DecoupeHome operator={opObj} allDecoupe={allDecoupe} onJoin={handleDecoupeJoin} onStart={handleDecoupeStartLibre} onBack={()=>setModule(null)} onLogout={logout} />;
  }

  return <ModuleSelect onPick={pickModule} onResetCache={handleResetCache} operator={operator} onLogout={logout} />;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  console.error("Rendu impossible", e);
  if (window.showBootError) window.showBootError("Erreur au démarrage de l'application.");
}
</script>
<script>
/* v5.7 — DOUCHETTE ZEBRA (DataWedge en mode clavier + Entrée), valable pour TOUTE l'app.
   Si un scan arrive alors qu'aucun champ n'a le focus (après un tap, une popup…), il est
   renvoyé dans le champ de scan visible de l'écran (.scan-search-input) au lieu d'être perdu. */
(function(){
  var buf = "", last = 0;
  function visibleScanInput(){
    var l = document.querySelectorAll(".scan-search-input");
    for (var i=0;i<l.length;i++){ var r=l[i].getBoundingClientRect(); if (r.width>0 && r.height>0) return l[i]; }
    return null;
  }
  document.addEventListener("keydown", function(e){
    var a = document.activeElement, tag = a && a.tagName;
    if (tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT" || (a && a.isContentEditable)) { buf=""; return; }
    var now = Date.now();
    if (now - last > 80) buf = "";            // une douchette tape très vite (< 80 ms entre 2 touches)
    last = now;
    if (e.key === "Enter") {
      var code = buf; buf = "";
      if (code.length < 4) return;
      var inp = visibleScanInput(); if (!inp) return;
      e.preventDefault();
      var setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set;
      setter.call(inp, code); inp.dispatchEvent(new Event("input", { bubbles:true }));
      inp.focus({ preventScroll:true });
      setTimeout(function(){ inp.dispatchEvent(new KeyboardEvent("keydown", { key:"Enter", code:"Enter", keyCode:13, which:13, bubbles:true })); }, 40);
      return;
    }
    if (e.key && e.key.length === 1) buf += e.key;
  }, true);
})();
</script>
</body>
